<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加用户</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="UserAddForm" onsubmit="return false;" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
			<div class="layui-form-item">
				<label class="layui-form-label">用户名</label>
				<div class="layui-input-block">
					<input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">密码</label>
				<div class="layui-input-block">
					<input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">所属角色</label>
				<div class="layui-input-block">
					<select name="role" lay-verify="required">
						<option value="">请选择角色</option>
						{{#foreach:roleList}}
						<option value="{{$id}}">{{$name}}</option>
						{{#end}}
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">权限级别 <i class="layui-icon layui-icon-tips" lay-tips="该字段与角色管理中的字段用途相同，使用其中更高的作为最终权限级别" style="color: #1E9FFF; cursor: help;"></i></label>
				<div class="layui-input-block">
					<input type="number" name="authLevel" value="0" placeholder="请输入权限级别（0-999）" autocomplete="off" class="layui-input">
				</div>
			</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		// SHA-256 哈希函数（使用 Web Crypto API）
		async function sha256(message) {
			if (!window.crypto || !window.crypto.subtle) {
				throw new Error('当前环境无法计算密码哈希，请使用 HTTPS 或 localhost 访问后台');
			}
			const msgBuffer = new TextEncoder().encode(message);
			const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
			const hashArray = Array.from(new Uint8Array(hashBuffer));
			const hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
			return hashHex;
		}
		
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			var $ = layui.jquery;
			
			// 渲染表单
			form.render();
			
			// 启用提示功能
			$(document).on('mouseenter', '[lay-tips]', function(){
				var tips = $(this).attr('lay-tips');
				if(tips){
					layer.tips(tips, this, {
						tips: [1, '#333'],
						time: 3000
					});
				}
			}).on('mouseleave', '[lay-tips]', function(){
				// 补充：鼠标离开时关闭气泡，避免多个气泡残留
				layer.closeAll('tips');
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submit)', function(data){
				var field = data.field;
				var btn = data.elem;
				if (btn.disabled) return false;
				btn.disabled = true;
				btn.classList.add('layui-btn-disabled');
				// 先同步阻止默认提交，再等待哈希，避免明文密码进入 GET 地址。
				(async function () {
					try {
				
						// 计算密码的 SHA-256 哈希值（客户端加盐：用户名 + "_xywhsoft_" + 密码）
						const pwdHash = await sha256(field.username + '_xywhsoft_' + field.password);
				
						// 构建提交数据（传输哈希值而非明文）
						var submitData = {
							username: field.username,
							password: pwdHash,
							role: parseInt(field.role),
							authLevel: parseInt(field.authLevel) || 0
						};
				
						// 提交请求
						const response = await fetch('/admin/auth/user', {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json'
							},
							body: JSON.stringify(submitData),
						});
						const result = await response.json();
						if ( result.result ) {
							layer.msg(result.message, {icon: 1});
							// 刷新父窗口列表
							parent.layui.table.reloadData('Table_Auth_User');
							// 关闭当前弹窗
							var index = parent.layer.getFrameIndex(window.name);
							parent.layer.close(index);
						} else {
							layer.msg('请求服务报错：' + result.message, {icon: 2});
						}
					} catch (error) {
						layer.msg(error.message || '添加失败，请重试', {icon: 2});
					} finally {
						btn.disabled = false;
						btn.classList.remove('layui-btn-disabled');
					}
				})();
				
				// 阻止默认 form 跳转
				return false;
			});
		});
	</script>
</body>
</html>
