<script>
layui.use(['table', 'form'], function(){
  var table = layui.table;
  var form = layui.form;
  var layer = layui.layer;
  var $ = layui.$;
  var pluginXid = 'cms.article';
  var domBase = 'Content_MakePlugin_cms_article_Categories';
  var ids = {
    table: 'Table_' + domBase,
    toolbar: 'Toolbar_' + domBase,
    tool: 'Tool_' + domBase,
    editor: 'Editor_' + domBase,
    form: 'Form_' + domBase,
    filter: 'CategoryFilter_' + domBase,
    filterApply: 'CategoryFilterApply_' + domBase,
    filterClear: 'CategoryFilterClear_' + domBase,
    summary: 'CategorySummary_' + domBase,
    parent: 'Parent_' + domBase,
    seoFields: 'SeoFields_' + domBase,
    save: 'Save_' + domBase,
    cancel: 'Cancel_' + domBase
  };
  var state = { layerIndex: 0, current: null, categories: [], seoEnabled: false, collapsedMap: {} };

  function byId(id) { return document.getElementById(id); }
  function textOf(value) { return value == null ? '' : String(value); }
  function escapeHtml(value) {
    return textOf(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function reloadTable() { table.reloadData(ids.table, { page: { curr: 1 } }); }
  function categoryFilterKeyword() {
    var input = byId(ids.filter);
    return input ? textOf(input.value).trim().toLowerCase() : '';
  }
  function rowContainsKeyword(row, keyword) {
    if (!keyword) return true;
    var text = [
      row.title,
      row.treeTitle,
      row.slug,
      row.path,
      row.breadcrumb,
      row.templateKey
    ].map(textOf).join(' ').toLowerCase();
    return text.indexOf(keyword) >= 0;
  }
  function buildCategoryRowMaps(rows) {
    var maps = { byId: {}, childrenByParent: {} };
    (rows || []).forEach(function(row){
      row = row || {};
      var id = Number(row.id || 0);
      var parentId = Number(row.parentId || 0);
      if (id > 0) maps.byId[id] = row;
      if (!maps.childrenByParent[parentId]) maps.childrenByParent[parentId] = [];
      maps.childrenByParent[parentId].push(row);
    });
    return maps;
  }
  function markCategoryFilterContext(row, maps, keep) {
    var id = Number((row || {}).id || 0);
    var parentId = Number((row || {}).parentId || 0);
    var queue = [];
    var guard = 0;
    if (id > 0) keep[id] = true;
    while (parentId > 0 && guard < 64) {
      keep[parentId] = true;
      parentId = maps.byId[parentId] ? Number(maps.byId[parentId].parentId || 0) : 0;
      guard++;
    }
    queue = (maps.childrenByParent[id] || []).slice(0);
    guard = 0;
    while (queue.length && guard < 5000) {
      var child = queue.shift() || {};
      var childId = Number(child.id || 0);
      if (childId > 0) keep[childId] = true;
      Array.prototype.push.apply(queue, maps.childrenByParent[childId] || []);
      guard++;
    }
  }
  function filterCategoryRows(rows) {
    var keyword = categoryFilterKeyword();
    if (!keyword) return rows || [];
    var maps = buildCategoryRowMaps(rows);
    var keep = {};
    (rows || []).forEach(function(row){
      if (rowContainsKeyword(row || {}, keyword)) markCategoryFilterContext(row || {}, maps, keep);
    });
    return (rows || []).filter(function(row){ return !!keep[Number((row || {}).id || 0)]; });
  }
  function hasCollapsedAncestor(row, rowMap) {
    var parentId = Number((row && row.parentId) || 0);
    var guard = 0;
    while (parentId > 0 && guard < 64) {
      if (state.collapsedMap[parentId]) return true;
      var parent = rowMap[parentId];
      parentId = parent ? Number(parent.parentId || 0) : 0;
      guard++;
    }
    return false;
  }
  function visibleCategoryRows(rows) {
    var rowMap = {};
    (rows || []).forEach(function(row){ rowMap[Number(row.id || 0)] = row || {}; });
    return (rows || []).filter(function(row){ return !hasCollapsedAncestor(row || {}, rowMap); });
  }
  function categoryCollapsedCount() {
    var count = 0;
    Object.keys(state.collapsedMap || {}).forEach(function(key){ if (state.collapsedMap[key]) count++; });
    return count;
  }
  function updateCategorySummary(totalRows, visibleRows) {
    var node = byId(ids.summary);
    if (!node) return;
    node.innerHTML = '栏目树：显示 ' + Number(visibleRows || 0) + ' / ' + Number(totalRows || 0) + '，已收起节点 ' + categoryCollapsedCount();
  }
  function setAllCategoryCollapsed(collapsed) {
    state.collapsedMap = {};
    if (collapsed) {
      (state.categories || []).forEach(function(row){
        if (Number((row || {}).childCount || 0) > 0) state.collapsedMap[Number(row.id || 0)] = true;
      });
    }
    reloadTable();
  }
  function toggleCategoryCollapsed(row) {
    var id = Number((row || {}).id || 0);
    if (id <= 0) return;
    if (state.collapsedMap[id]) delete state.collapsedMap[id];
    else state.collapsedMap[id] = true;
    reloadTable();
  }
  function renderCategoryTreeTitle(row) {
    var childCount = Number((row || {}).childCount || 0);
    var id = Number((row || {}).id || 0);
    var collapsed = !!state.collapsedMap[id];
    var icon = collapsed ? '&#9658;' : '&#9660;';
    var title = escapeHtml(row.breadcrumb || row.path || '');
    var text = escapeHtml(row.treeTitle || row.title || '\u672a\u547d\u540d\u680f\u76ee');
    var toggle = childCount > 0 ? '<button type="button" class="layui-btn layui-btn-primary layui-btn-xs managed-category-tree-toggle" lay-event="toggleTree" title="' + (collapsed ? '展开' : '收起') + '">' + icon + '</button>' : '<span class="managed-category-tree-spacer"></span>';
    return '<div class="managed-category-tree-title" title="' + title + '">' + toggle + '<span class="managed-category-tree-name">' + text + '</span></div>';
  }
  function normalizeRow(row) {
    row = row || {};
    return {
      id: row.id || '',
      parentId: row.parentId || 0,
      title: row.title || '',
      slug: row.slug || '',
      path: row.path || '',
      breadcrumb: row.breadcrumb || row.path || '',
      level: row.level || 0,
      description: row.description || '',
      coverUrl: row.coverUrl || '',
      templateKey: row.templateKey || '',
      seoTitle: row.seoTitle || '',
      seoKeywords: row.seoKeywords || '',
      seoDescription: row.seoDescription || '',
      sort: row.sort || 0,
      status: row.status == null ? 1 : row.status
    };
  }
  function hasAbilityPack(meta, packId) {
    var packs = (((meta || {}).contracts || {}).abilityPacks) || [];
    return packs.some(function(item){ return String((item || {}).packId || '') === String(packId); });
  }
  function loadMeta() {
    return fetch('/api/plugin/' + pluginXid + '/meta', { cache: 'no-store' })
      .then(function(response){ return response.json(); })
      .then(function(result){
        state.seoEnabled = !!(result && result.result && hasAbilityPack(result.data || {}, 'content.seo'));
        var seoHost = byId(ids.seoFields);
        if (seoHost) seoHost.className = state.seoEnabled ? 'managed-category-seo enabled' : 'managed-category-seo';
      }).catch(function(){ state.seoEnabled = false; });
  }
  function renderParentOptions(current) {
    var select = byId(ids.parent);
    var currentId = Number((current && current.id) || 0);
    var currentPath = (current && current.path) || '';
    select.innerHTML = '';
    var root = document.createElement('option');
    root.value = '0';
    root.textContent = '\u65e0\u7236\u680f\u76ee';
    select.appendChild(root);
    (state.categories || []).forEach(function(item){
      var id = Number(item.id || 0);
      var path = item.path || '';
      if (!id || id === currentId) return;
      if (currentPath && path.indexOf(currentPath) === 0) return;
      var option = document.createElement('option');
      option.value = String(id);
      option.textContent = textOf(item.breadcrumb || item.treeTitle || item.title || ('#' + id));
      select.appendChild(option);
    });
  }
  function openEditor(row) {
    state.current = normalizeRow(row);
    state.layerIndex = layer.open({
      title: state.current.id ? '\u7f16\u8f91\u680f\u76ee' : '\u6dfb\u52a0\u680f\u76ee',
      type: 1,
      area: ['680px', '650px'],
      shadeClose: false,
      content: $('#' + ids.editor),
      success: function(){
        renderParentOptions(state.current);
        var formValue = Object.assign({}, state.current);
        if (!state.seoEnabled) {
          formValue.seoTitle = '';
          formValue.seoKeywords = '';
          formValue.seoDescription = '';
        }
        form.val(ids.form, formValue);
        form.render();
      },
      end: function(){ byId(ids.editor).style.display = 'none'; }
    });
  }
  function saveCategory() {
    var data = form.val(ids.form);
    data.id = Number(data.id || 0);
    data.parentId = Number(data.parentId || 0);
    data.sort = Number(data.sort || 0);
    data.status = Number(data.status || 1);
    fetch('/admin/api/plugin/' + pluginXid + '/category/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    }).then(function(response){ return response.json(); }).then(function(result){
      if (!result || !result.result) throw new Error((result && result.message) || '\u4fdd\u5b58\u5931\u8d25');
      layer.close(state.layerIndex);
      layer.msg('\u5df2\u4fdd\u5b58', { icon: 1 });
      reloadTable();
    }).catch(function(error){ layer.msg(error.message || String(error), { icon: 2 }); });
  }
  function deleteCategory(row) {
    layer.confirm('\u786e\u5b9a\u5220\u9664 "' + escapeHtml(row.title || '') + '" \u5417\uff1f', { icon: 3, title: '\u5220\u9664\u786e\u8ba4' }, function(index){
      fetch('/admin/api/plugin/' + pluginXid + '/category/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: row.id })
      }).then(function(response){ return response.json(); }).then(function(result){
        if (!result || !result.result) throw new Error((result && result.message) || '\u5220\u9664\u5931\u8d25');
        layer.msg('\u5df2\u5220\u9664', { icon: 1 });
        reloadTable();
      }).catch(function(error){ layer.msg(error.message || String(error), { icon: 2 }); });
      layer.close(index);
    });
  }
  function renderCategorySortRows(rows) {
    var html = '';
    rows = Array.isArray(rows) ? rows : [];
    rows.forEach(function(row){
      html += '<tr><td>' + escapeHtml(row.rowIndex || '') + '</td>'
        + '<td>' + escapeHtml(row.id || '') + '</td>'
        + '<td>' + escapeHtml(row.parentId || 0) + '</td>'
        + '<td>' + escapeHtml(row.sort || 0) + '</td>'
        + '<td>' + escapeHtml(row.moveParent ? '是' : '否') + '</td>'
        + '<td>' + escapeHtml(row.updated ? '是' : '否') + '</td>'
        + '<td>' + escapeHtml(row.descendantPathsUpdated ? '是' : '否') + '</td>'
        + '<td>' + escapeHtml(row.message || '') + '</td></tr>';
    });
    if (!rows.length) html += '<tr><td colspan="8" style="text-align:center;color:#999;">暂无结果行</td></tr>';
    return html;
  }
  function showCategorySortResult(result) {
    result = result || {};
    var rows = Array.isArray(result.rows) ? result.rows : [];
    var html = '<div style="padding:12px 16px;">'
      + '<table class="layui-table"><thead><tr><th>更新数</th><th>后代路径失败</th><th>最大批量</th><th>结果行</th></tr></thead><tbody><tr>'
      + '<td>' + escapeHtml(result.updated || 0) + '</td>'
      + '<td>' + escapeHtml(result.descendantPathFailures || 0) + '</td>'
      + '<td>' + escapeHtml(result.maxSortRows || '') + '</td>'
      + '<td>' + escapeHtml(rows.length) + '</td></tr></tbody></table>'
      + '<table class="layui-table"><thead><tr><th>行号</th><th>ID</th><th>父栏目</th><th>排序</th><th>移动父级</th><th>已更新</th><th>后代路径</th><th>消息</th></tr></thead><tbody>'
      + renderCategorySortRows(rows)
      + '</tbody></table>'
      + '<pre style="max-height:160px;overflow:auto;background:#f7f7f7;padding:10px;">' + escapeHtml(JSON.stringify(result, null, 2)) + '</pre>'
      + '</div>';
    layer.open({ type: 1, title: '栏目排序结果', area: ['760px', '560px'], content: html });
  }
  function saveSort() {
    var items = [];
    document.querySelectorAll('.managed-category-sort-input-' + domBase).forEach(function(input){
      items.push({ id: Number(input.getAttribute('data-id') || 0), sort: Number(input.value || 0) });
    });
    if (!items.length) {
      layer.msg('\u6682\u65e0\u53ef\u4fdd\u5b58\u7684\u680f\u76ee', { icon: 0 });
      return;
    }
    fetch('/admin/api/plugin/' + pluginXid + '/category/sort', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items: items })
    }).then(function(response){ return response.json(); }).then(function(result){
      if (!result || !result.result) throw new Error((result && result.message) || '\u4fdd\u5b58\u5931\u8d25');
      showCategorySortResult(result);
      layer.msg('\u6392\u5e8f\u5df2\u4fdd\u5b58', { icon: 1 });
      reloadTable();
    }).catch(function(error){ layer.msg(error.message || String(error), { icon: 2 }); });
  }

  function dragSortItems() {
    return state.categories.map(function(row){
      return { id: Number(row.id || 0), parentId: Number(row.parentId || 0), title: row.breadcrumb || row.treeTitle || row.title || ('#' + row.id), sort: Number(row.sort || 0) };
    }).filter(function(row){ return row.id > 0; });
  }

  function dragParentOptions(row, rows) {
    var html = '<select class="managed-category-drag-parent" data-id="' + row.id + '"><option value="0">顶级栏目</option>';
    rows.forEach(function(item){
      if (Number(item.id) === Number(row.id)) return;
      html += '<option value="' + Number(item.id || 0) + '"' + (Number(row.parentId || 0) === Number(item.id || 0) ? ' selected' : '') + '>' + escapeHtml(item.title) + '</option>';
    });
    return html + '</select>';
  }

  function openDragSort() {
    var rows = dragSortItems();
    var html = '<div class="managed-category-drag-list" id="DragSortList_' + domBase + '">';
    rows.forEach(function(row){
      html += '<div class="managed-category-drag-item" draggable="true" data-id="' + row.id + '"><span class="managed-category-drag-handle">&#9776;</span><span style="flex:1">' + escapeHtml(row.title) + '</span>' + dragParentOptions(row, rows) + '</div>';
    });
    if (!rows.length) html += '<div style="padding:24px;text-align:center;color:#999;">暂无栏目</div>';
    html += '</div><div style="border-top:1px solid #eee;padding:12px 16px;text-align:right;"><button type="button" class="layui-btn" id="DragSortSave_' + domBase + '">保存</button><button type="button" class="layui-btn layui-btn-primary" id="DragSortCancel_' + domBase + '">取消</button></div>';
    var index = layer.open({
      type: 1,
      title: '栏目拖拽排序',
      area: ['560px', '620px'],
      content: html,
      success: function(layero){
        var dragging = null;
        var list = layero[0].querySelector('#DragSortList_' + domBase);
        if (!list) return;
        Array.prototype.forEach.call(list.querySelectorAll('.managed-category-drag-item'), function(item){
          item.addEventListener('dragstart', function(){ dragging = item; item.classList.add('dragging'); });
          item.addEventListener('dragend', function(){ item.classList.remove('dragging'); dragging = null; });
          item.addEventListener('dragover', function(ev){
            ev.preventDefault();
            if (!dragging || dragging === item) return;
            var rect = item.getBoundingClientRect();
            var after = ev.clientY > rect.top + rect.height / 2;
            list.insertBefore(dragging, after ? item.nextSibling : item);
          });
        });
        layero[0].querySelector('#DragSortCancel_' + domBase).onclick = function(){ layer.close(index); };
        layero[0].querySelector('#DragSortSave_' + domBase).onclick = function(){
          var items = [];
          Array.prototype.forEach.call(list.querySelectorAll('.managed-category-drag-item'), function(item, idx){
            var select = item.querySelector('.managed-category-drag-parent');
            items.push({ id: Number(item.getAttribute('data-id') || 0), parentId: Number(select && select.value || 0), sort: (idx + 1) * 10 });
          });
          fetch('/admin/api/plugin/' + pluginXid + '/category/sort', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: items })
          }).then(function(response){ return response.json(); }).then(function(result){
            if (!result || !result.result) throw new Error((result && result.message) || '保存拖拽排序失败');
            layer.close(index);
            showCategorySortResult(result);
            layer.msg('已保存', { icon: 1 });
            reloadTable();
          }).catch(function(error){ layer.msg(error.message || String(error), { icon: 2 }); });
        };
      }
    });
  }

  table.render({
    elem: '#' + ids.table,
    toolbar: '#' + ids.toolbar,
    url: '/admin/api/plugin/' + pluginXid + '/category/tree',
    method: 'get',
    parseData: function(result){
      var rows = (result && result.data) || [];
      var keyword = categoryFilterKeyword();
      var filteredRows = filterCategoryRows(rows);
      var filtered = keyword ? filteredRows : visibleCategoryRows(filteredRows);
      state.categories = rows;
      updateCategorySummary(rows.length, filtered.length);
      return {
        code: result && result.result ? 0 : 1,
        msg: (result && result.message) || '',
        count: filtered.length,
        data: filtered
      };
    },
    defaultToolbar: ['filter', 'exports', 'print'],
    height: 'full-135',
    cellMinWidth: 80,
    skin: 'line',
    page: false,
    cols: [[
      { field: 'id', width: 80, title: 'ID' },
      { field: 'treeTitle', minWidth: 260, title: '\u680f\u76ee\u540d\u79f0', templet: renderCategoryTreeTitle },
      { field: 'breadcrumb', minWidth: 220, title: '\u680f\u76ee\u8def\u5f84', templet: function(d){ return escapeHtml(d.breadcrumb || d.path || ''); } },
      { field: 'parentId', width: 100, title: '\u7236\u680f\u76ee' },
      { field: 'childCount', width: 100, title: '\u5b50\u680f\u76ee' },
      { field: 'contentCount', width: 110, title: '\u5185\u5bb9\u6570' },
      { field: 'templateKey', width: 120, title: '\u6a21\u677f', templet: function(d){ return escapeHtml(d.templateKey || 'default'); } },
      { field: 'sort', width: 100, title: '\u6392\u5e8f', templet: function(d){ return '<input type="number" class="layui-input managed-category-sort-input managed-category-sort-input-' + domBase + '" data-id="' + Number(d.id || 0) + '" value="' + Number(d.sort || 0) + '">'; } },
      { field: 'status', width: 100, title: '\u72b6\u6001', templet: function(d){ return d.status ? '<span class="layui-badge layui-bg-green">\u542f\u7528</span>' : '<span class="layui-badge">\u505c\u7528</span>'; } },
      { field: 'updateTimeText', width: 170, title: '\u4fee\u6539\u65f6\u95f4' },
      { width: 140, title: '\u64cd\u4f5c', fixed: 'right', templet: '#' + ids.tool }
    ]]
  });

  table.on('toolbar(' + ids.table + ')', function(obj){
    if (obj.event === 'Add_Content_MakePlugin_cms_article_Categories') openEditor({});
    if (obj.event === 'SaveSort_Content_MakePlugin_cms_article_Categories') saveSort();
    if (obj.event === 'DragSort_Content_MakePlugin_cms_article_Categories') openDragSort();
    if (obj.event === 'ExpandAll_Content_MakePlugin_cms_article_Categories') setAllCategoryCollapsed(false);
    if (obj.event === 'CollapseAll_Content_MakePlugin_cms_article_Categories') setAllCategoryCollapsed(true);
    if (obj.event === 'Refresh_Content_MakePlugin_cms_article_Categories') reloadTable();
  });
  table.on('tool(' + ids.table + ')', function(obj){
    if (obj.event === 'toggleTree') toggleCategoryCollapsed(obj.data || {});
    if (obj.event === 'edit') openEditor(obj.data || {});
    if (obj.event === 'delete') deleteCategory(obj.data || {});
  });
  byId(ids.filterApply).onclick = reloadTable;
  byId(ids.filterClear).onclick = function(){
    byId(ids.filter).value = '';
    reloadTable();
  };
  byId(ids.filter).addEventListener('keydown', function(ev){
    if (ev.key === 'Enter') reloadTable();
  });
  byId(ids.save).onclick = saveCategory;
  byId(ids.cancel).onclick = function(){ layer.close(state.layerIndex); };
  loadMeta();
});
</script>
