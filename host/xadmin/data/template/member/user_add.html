<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加前台用户</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px; min-height: calc(100vh - 40px); display: flex; flex-direction: column;" lay-filter="MemberUserAddForm">
		<div class="layui-form-item">
			<label class="layui-form-label">用户名</label>
			<div class="layui-input-block">
				<input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">密码</label>
			<div class="layui-input-block">
				<input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">昵称</label>
			<div class="layui-input-block">
				<input type="text" name="nickname" placeholder="请输入昵称（可选）" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">用户组</label>
			<div class="layui-input-block">
				<select name="groupId" lay-verify="required">
					<option value="">请选择用户组</option>
					{*GroupComboListItem:groupList}
				</select>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">权限级别</label>
			<div class="layui-input-block">
				<input type="number" name="authLevel" value="0" placeholder="请输入权限级别（0-999）" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">状态</label>
			<div class="layui-input-block">
				<select name="status">
					<option value="1" selected>正常</option>
					<option value="0">禁用</option>
				</select>
			</div>
		</div>
		<div style="flex: 1;"></div>
		<div class="layui-form-item" style="text-align: right; margin-bottom: 0;">
			<button class="layui-btn" lay-submit lay-filter="submit">保存</button>
			<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		async function sha256(message) {{
			const msgBuffer = new TextEncoder().encode(message);
			const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
			const hashArray = Array.from(new Uint8Array(hashBuffer));
			const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
			return hashHex;
		}
		
		layui.use('form', function(){{
			var form = layui.form;
			var layer = layui.layer;
			form.render();
			
			document.getElementById('btnCancel').onclick = function(){{
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			form.on('submit(submit)', async function(data){{
				var field = data.field;
				const pwdHash = await sha256(field.username + '_xywhsoft_' + field.password);
				
				var submitData = {{
					username: field.username,
					password: pwdHash,
					nickname: field.nickname || '',
					groupId: parseInt(field.groupId),
					authLevel: parseInt(field.authLevel) || 0,
					status: parseInt(field.status)
				};
				
				fetch('/admin/member/user', {{
					method: 'POST',
					headers: {{ 'Content-Type': 'application/json' },
					body: JSON.stringify(submitData),
				})
				.then(response => response.json())
				.then(data => {{
					if ( data.result ) {{
						layer.msg(data.message, {{icon: 1});
						parent.layui.table.reloadData('Table_Member_User');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {{
						layer.msg('请求服务报错：' + data.message, {{icon: 2});
					}
				})
				.catch(error => {{
					layer.msg('请求出错', {{icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
{#define:GroupComboListItem}<option value="{$id}">{$name}</option>{#end}
