<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>编辑附件</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
<form class="layui-form" lay-filter="Form_Attachment_Edit" style="height: 100%; display: flex; flex-direction: column;">
<div style="flex: 1; overflow-y: auto; padding: 20px;">
	<input type="hidden" name="xid" id="xid">
	
	<div class="layui-form-item">
		<label class="layui-form-label">文件名</label>
		<div class="layui-input-block">
			<input type="text" name="filename" class="layui-input" disabled>
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">文件类型</label>
		<div class="layui-input-block">
			<input type="text" name="ext" class="layui-input" disabled>
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">文件大小</label>
		<div class="layui-input-block">
			<input type="text" name="sizeText" class="layui-input" disabled>
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">允许外链</label>
		<div class="layui-input-block">
			<input type="checkbox" name="allowHotlink" lay-skin="switch" lay-text="是|否">
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">访问类型</label>
		<div class="layui-input-block">
			<select name="accessType" lay-filter="accessType">
				<option value="0">公开</option>
				<option value="1">登录可见</option>
				<option value="2">付费下载</option>
				<option value="3">权限级别</option>
			</select>
		</div>
	</div>
	
	<div class="layui-form-item" id="priceItem" style="display: none;">
		<label class="layui-form-label">价格(分)</label>
		<div class="layui-input-block">
			<input type="number" name="price" value="0" placeholder="请输入价格，单位：分" autocomplete="off" class="layui-input">
		</div>
	</div>
	
	<div class="layui-form-item" id="accessLevelItem" style="display: none;">
		<label class="layui-form-label">权限级别</label>
		<div class="layui-input-block">
			<input type="number" name="accessLevel" value="0" min="0" max="99" placeholder="0-99，用户级别≥此值才能访问" autocomplete="off" class="layui-input">
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">备注</label>
		<div class="layui-input-block">
			<textarea name="remark" class="layui-textarea" placeholder="请输入备注信息"></textarea>
		</div>
	</div>
</div>
<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
	<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
	<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
</div>
</form>

<script src="/layui/layui.js"></script>
<script>
layui.use(['form'], function(){
	var form = layui.form;
	var layer = layui.layer;
	var $ = layui.$;
	
	// 获取 URL 参数
	var params = new URLSearchParams(window.location.search);
	var sXID = params.get('xid');
	
	if ( !sXID ) {
		layer.msg('缺少附件参数', {icon: 2});
		return;
	}
	
	// 取消按钮
	document.getElementById('btnCancel').onclick = function(){
		var index = parent.layer.getFrameIndex(window.name);
		parent.layer.close(index);
	};
	
	// 监听访问类型变化
	form.on('select(accessType)', function(data){
		if ( data.value == '2' ) {
			$('#priceItem').show();
			$('#accessLevelItem').hide();
		} else if ( data.value == '3' ) {
			$('#priceItem').hide();
			$('#accessLevelItem').show();
		} else {
			$('#priceItem').hide();
			$('#accessLevelItem').hide();
		}
	});
	
	// 格式化文件大小
	function formatSize(size)
	{
		if ( size >= 1073741824 ) {
			return (size / 1073741824).toFixed(2) + ' GB';
		} else if ( size >= 1048576 ) {
			return (size / 1048576).toFixed(2) + ' MB';
		} else if ( size >= 1024 ) {
			return (size / 1024).toFixed(2) + ' KB';
		} else {
			return size + ' B';
		}
	}
	
	// 加载附件信息
	fetch('/admin/attachment/get?xid=' + sXID)
	.then(function(r){ return r.json(); })
	.then(function(res){
		if ( res.result && res.data ) {
			var data = res.data;
			$('#xid').val(data.xid);
			$('input[name="filename"]').val(data.filename);
			$('input[name="ext"]').val(data.ext);
			$('input[name="sizeText"]').val(formatSize(data.size));
			$('input[name="allowHotlink"]').prop('checked', !!data.allowHotlink);
			$('select[name="accessType"]').val(data.accessType);
			$('input[name="price"]').val(data.price || 0);
			$('input[name="accessLevel"]').val(data.accessLevel || 0);
			$('textarea[name="remark"]').val(data.remark || '');
			
			// 显示对应的条件字段
			if ( data.accessType == 2 ) {
				$('#priceItem').show();
			} else if ( data.accessType == 3 ) {
				$('#accessLevelItem').show();
			}
			
			form.render();
		} else {
			layer.msg(res.message || '加载失败', {icon: 2});
		}
	})
	.catch(function(err){
		layer.msg('请求出错', {icon: 2});
		console.error(err);
	});
	
	// 提交事件
	form.on('submit(submit)', function(formData){
		var field = formData.field;
		
		var postData = {
			xid: field.xid,
			allowHotlink: field.allowHotlink ? true : false,
			accessType: parseInt(field.accessType),
			accessLevel: parseInt(field.accessLevel) || 0,
			price: parseInt(field.price) || 0,
			remark: field.remark || ''
		};
		
		fetch('/admin/attachment/save', {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify(postData)
		})
		.then(function(r){ return r.json(); })
		.then(function(res){
			if ( res.result ) {
				layer.msg('保存成功', {icon: 1});
				// 刷新父窗口列表
				if ( parent.layui && parent.layui.table ) {
					parent.layui.table.reloadData('Table_Attachment_List');
				}
				// 关闭当前弹窗
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			} else {
				layer.msg(res.message || '保存失败', {icon: 2});
			}
		})
		.catch(function(err){
			layer.msg('请求出错', {icon: 2});
			console.error(err);
		});
		
		return false;
	});
});
</script>
</body>
</html>
