<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加菜单</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px; min-height: calc(100vh - 40px); display: flex; flex-direction: column;" lay-filter="menuAddForm">
		<div class="layui-form-item">
			<label class="layui-form-label">上级分类</label>
			<div class="layui-input-block">
				<select name="parent" id="parentSelect" lay-filter="parent">
					<option value="0">无（顶级菜单）</option>
				</select>
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">菜单标题</label>
			<div class="layui-input-block">
				<input type="text" name="title" required lay-verify="required" placeholder="请输入菜单标题" autocomplete="off" class="layui-input">
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">图标</label>
			<div class="layui-input-block">
				<div style="display: flex; width: 100%;">
					<span id="iconPreview" style="flex-shrink: 0; width: 38px; height: 36px; line-height: 36px; text-align: center; border: 1px solid #e6e6e6; border-radius: 4px 0 0 4px; font-size: 18px; border-right: none; background: #fff;"></span>
					<input type="text" name="icon" id="iconInput" placeholder="请选择图标" autocomplete="off" class="layui-input" style="flex: 1; border-radius: 0;" readonly>
					<button type="button" class="layui-btn layui-btn-primary" id="btnSelectIcon" style="flex-shrink: 0; border-radius: 0 4px 4px 0; margin-left: -1px;">选择</button>
				</div>
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">链接地址</label>
			<div class="layui-input-block">
				<input type="text" name="href" placeholder="如：view/home" autocomplete="off" class="layui-input">
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">打开方式</label>
			<div class="layui-input-block">
				<select name="openType">
					<option value="_component">组件（_component）</option>
					<option value="_iframe">内嵌页面（_iframe）</option>
					<option value="_blank">新窗口（_blank）</option>
				</select>
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">排序值</label>
			<div class="layui-input-block">
				<input type="number" name="sort" value="0" placeholder="数值越小越靠前" autocomplete="off" class="layui-input">
			</div>
		</div>
		
		<div class="layui-form-item">
			<label class="layui-form-label">是否显示</label>
			<div class="layui-input-block">
				<input type="checkbox" name="visible" lay-skin="switch" lay-text="显示|隐藏" checked>
			</div>
		</div>
		
		<div class="layui-form-item layui-form-text">
			<label class="layui-form-label">备注</label>
			<div class="layui-input-block">
				<textarea name="remark" placeholder="可选，备注信息" class="layui-textarea"></textarea>
			</div>
		</div>
		
		<div style="flex: 1;"></div>
		<div class="layui-form-item" style="text-align: right; margin-bottom: 0;">
			<button class="layui-btn" lay-submit lay-filter="submitMenuAdd">保存</button>
			<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script src="/js/icon-picker.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			var $ = layui.$;
			
			// 从 URL 获取预设的父级ID
			var urlParams = new URLSearchParams(window.location.search);
			var iParentID = parseInt(urlParams.get('parent')) || 0;
			
			// 加载分类列表
			function loadParentCategories()
			{
				fetch('/auth/menu')
				.then(response => response.json())
				.then(result => {
					if ( result.result ) {
						var arrData = result.data || [];
						var sOptions = '<option value="0"' + (iParentID === 0 ? ' selected' : '') + '>无（顶级菜单）</option>';
						
						for ( var i = 0; i < arrData.length; i++ ) {
							var item = arrData[i];
							if ( item.type === 0 ) {
								var sSelected = (iParentID === item.id) ? ' selected' : '';
								sOptions += '<option value="' + item.id + '"' + sSelected + '>' + item.title + '</option>';
							}
						}
						
						$('#parentSelect').html(sOptions);
						form.render('select');
					}
				})
				.catch(error => {
					console.error('Error:', error);
				});
			}
			
			// 渲染表单
			form.render();
			loadParentCategories();
			
			// 图标选择按钮
			$('#btnSelectIcon').on('click', function(){
				IconPicker.open(this, function(sIcon){
					$('#iconInput').val(sIcon);
					if ( sIcon ) {
						$('#iconPreview').html('<i class="' + sIcon + '"></i>');
					} else {
						$('#iconPreview').html('');
					}
				});
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submitMenuAdd)', function(data){
				var field = data.field;
				
				var tblFormData = {
					parent: parseInt(field.parent) || 0,
					title: field.title,
					icon: field.icon || '',
					type: 1,
					href: field.href || '',
					openType: field.openType || '_component',
					sort: parseInt(field.sort) || 0,
					visible: field.visible === 'on' ? 1 : 0,
					remark: field.remark || ''
				};
				
				fetch('/auth/menu', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(tblFormData)
				})
				.then(response => response.json())
				.then(result => {
					if ( result.result ) {
						layer.msg(result.message || '添加成功', {icon: 1});
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg(result.message || '添加失败', {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
