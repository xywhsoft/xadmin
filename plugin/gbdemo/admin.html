<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Board Admin</title>
  <style>
    body{margin:0;background:#09090b;color:#fafafa;font-family:"Segoe UI",system-ui,sans-serif}
    .shell{max-width:1200px;margin:0 auto;padding:32px 18px 72px}
    .hero{background:linear-gradient(135deg,#1c1917,#292524);border-radius:24px;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.4);margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    .hero h1{margin:0;font-size:30px}
    .hero p{margin:6px 0 0;color:#a8a29e}
    .stats{display:flex;gap:12px;flex-wrap:wrap}
    .stat{background:#1c1917;border:1px solid #292524;border-radius:16px;padding:14px 18px;text-align:center;min-width:100px}
    .stat-num{font-size:26px;font-weight:800;color:#f59e0b}
    .stat-label{font-size:11px;color:#78716c;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
    .panel{background:#1c1917;border:1px solid #292524;border-radius:22px;padding:24px;box-shadow:0 14px 36px rgba(0,0,0,.25)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .toolbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .toolbar h2{margin:0;font-size:20px}
    .badge{display:inline-flex;padding:5px 10px;border-radius:999px;background:#292524;color:#d6d3d1;font-size:12px;font-weight:700}
    .sel{border:1px solid #44403c;border-radius:999px;background:#0c0a09;color:#e7e5e4;padding:8px 12px;font:inherit}
    .btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;transition:.15s}
    .btn-primary{background:#f59e0b;color:#1c1917}
    .btn-ghost{background:#292524;color:#d6d3d1}
    .btn-danger{background:#dc2626;color:#fff}
    .btn:hover{transform:translateY(-1px)}
    .list{display:flex;flex-direction:column;gap:14px}
    .item{padding:18px;border-radius:16px;background:#0c0a09;border:1px solid #292524}
    .item-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}
    .item-meta strong{display:block;font-size:16px;color:#fafafa;margin-bottom:4px}
    .item-meta span{display:block;font-size:13px;color:#78716c}
    .cat-tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#1e3a5f;color:#93c5fd;font-size:11px;font-weight:700;margin-left:8px}
    .ip-tag{font-size:11px;color:#57534e;margin-left:8px}
    .status-pill{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .st-pending{background:#3f2a12;color:#fcd34d}
    .st-approved{background:#123524;color:#86efac}
    .st-rejected{background:#3b1111;color:#fca5a5}
    .content{white-space:pre-wrap;line-height:1.7;color:#e7e5e4;margin-bottom:12px}
    .reply-grid{display:grid;grid-template-columns:180px 1fr auto;gap:10px;align-items:start}
    .reply-grid textarea{width:100%;min-height:80px;box-sizing:border-box;border:1px solid #44403c;border-radius:12px;background:#09090b;color:#e7e5e4;padding:10px;font:inherit;resize:vertical}
    .reply-preview{padding:12px;border-radius:12px;background:#1c1917;border:1px solid #292524;color:#a8a29e;margin-top:10px}
    .reply-label{font-size:11px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
    .reply-actions{display:flex;flex-direction:column;gap:8px}
    .like-count{font-size:13px;color:#f59e0b;margin-top:6px}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid #292524}
    .pager-info{font-size:13px;color:#78716c}
    .pager-actions{display:flex;gap:10px}
    .status-bar{min-height:18px;font-size:13px;color:#f59e0b;margin-bottom:12px}
    .empty{padding:42px 0;text-align:center;color:#57534e}
    @media(max-width:920px){.reply-grid{grid-template-columns:1fr}.hero h1{font-size:26px}}
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div>
        <h1>Message Board Admin</h1>
        <p>Review, approve, reply to, and manage messages.</p>
      </div>
      <div class="stats" id="ga_stats"></div>
    </section>
    <section class="panel">
      <div class="toolbar">
        <div class="toolbar-left">
          <h2>Messages</h2>
          <span class="badge" id="ga_total">0 total</span>
        </div>
        <div class="toolbar-left">
          <select class="sel" id="ga_filter_status" onchange="gaLoad(1)">
            <option value="-1">All statuses</option>
            <option value="0">Pending</option>
            <option value="1">Approved</option>
            <option value="2">Rejected</option>
          </select>
          <select class="sel" id="ga_filter_cat" onchange="gaLoad(1)">
            <option value="">All categories</option>
          </select>
          <button class="btn btn-ghost" onclick="gaLoad(ga.page)">Refresh</button>
        </div>
      </div>
      <div class="status-bar" id="ga_status"></div>
      <div class="list" id="ga_list"><div class="empty">Loading...</div></div>
      <div class="pager">
        <div class="pager-info" id="ga_pager">Page 1</div>
        <div class="pager-actions">
          <button class="btn btn-ghost" id="ga_prev" onclick="gaPrev()">Previous</button>
          <button class="btn btn-ghost" id="ga_next" onclick="gaNext()">Next</button>
        </div>
      </div>
    </section>
  </div>
  <script>
    const ga={page:1,pageSize:15,total:0};
    function gaEsc(v){return String(v||"").replace(/[&<>"']/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==='"'?"&quot;":"&#39;")}
    function gaStText(s){return s===0?"Pending":s===1?"Approved":s===2?"Rejected":"Unknown"}
    function gaStCls(s){return s===0?"st-pending":s===1?"st-approved":"st-rejected"}
    function gaOpts(cur){return[0,1,2].map(s=>`<option value="${s}"${s===cur?" selected":""}>${gaStText(s)}</option>`).join("")}
    function gaSetStatus(msg,color){const el=document.getElementById("ga_status");el.style.color=color||"#f59e0b";el.innerText=msg||""}
    function gaLoadStats(){
      fetch("/admin/api/plugin/gbdemo/stats").then(r=>r.json()).then(data=>{
        if(!data.result||!data.data)return;
        const d=data.data;
        document.getElementById("ga_stats").innerHTML=
          `<div class="stat"><div class="stat-num">${d.total||0}</div><div class="stat-label">Total</div></div>`+
          `<div class="stat"><div class="stat-num">${d.approved||0}</div><div class="stat-label">Approved</div></div>`+
          `<div class="stat"><div class="stat-num">${d.pending||0}</div><div class="stat-label">Pending</div></div>`+
          `<div class="stat"><div class="stat-num">${d.rejected||0}</div><div class="stat-label">Rejected</div></div>`+
          `<div class="stat"><div class="stat-num">${d.reactions||0}</div><div class="stat-label">Reactions</div></div>`;
      }).catch(()=>{});
    }
    function gaRender(payload){
      const list=document.getElementById("ga_list");
      const items=(payload&&payload.data)||[];
      ga.page=(payload&&payload.page)||1;
      ga.pageSize=(payload&&payload.pageSize)||ga.pageSize;
      ga.total=(payload&&payload.total)||0;
      document.getElementById("ga_total").innerText=`${ga.total} total`;
      document.getElementById("ga_pager").innerText=`Page ${ga.page} / ${Math.max(1,Math.ceil(ga.total/ga.pageSize))}`;
      document.getElementById("ga_prev").disabled=ga.page<=1;
      document.getElementById("ga_next").disabled=ga.page*ga.pageSize>=ga.total;
      if(!items.length){list.innerHTML="<div class='empty'>No messages matched.</div>";return}
      list.innerHTML=items.map(item=>{
        const rp=item.reply?`<div class="reply-preview"><div class="reply-label">Current reply</div><div style="white-space:pre-wrap">${gaEsc(item.reply)}</div><div style="font-size:12px;color:#57534e;margin-top:6px">${gaEsc(item.replyTimeText||"")}</div></div>`:`<div class="reply-preview"><div class="reply-label">Current reply</div><div>None</div></div>`;
        const cat=item.category?`<span class="cat-tag">${gaEsc(item.category)}</span>`:"";
        const ip=item.ipAddr?`<span class="ip-tag">IP: ${gaEsc(item.ipAddr)}</span>`:"";
        const likes=item.likes>0?`<div class="like-count">&#x2764;&#xFE0F; ${item.likes} likes</div>`:"";
        return `<article class="item"><div class="item-top"><div class="item-meta"><strong>${gaEsc(item.nickname)}${cat}${ip}</strong><span>Created: ${gaEsc(item.createTimeText||"")} &middot; Updated: ${gaEsc(item.updateTimeText||"")}</span></div><span class="status-pill ${gaStCls(item.status)}">${gaEsc(item.statusText||gaStText(item.status))}</span></div><div class="content">${gaEsc(item.content)}</div>${likes}<div class="reply-grid"><div><select class="sel" id="ga_s_${item.id}">${gaOpts(item.status)}</select></div><textarea id="ga_r_${item.id}" placeholder="Admin reply">${gaEsc(item.reply||"")}</textarea><div class="reply-actions"><button class="btn btn-primary" onclick="gaSave(${item.id})">Save</button><button class="btn btn-danger" onclick="gaDel(${item.id})">Delete</button></div></div><div style="margin-top:10px">${rp}</div></article>`;
      }).join("");
    }
    function gaLoad(page){
      const status=document.getElementById("ga_filter_status").value;
      const cat=document.getElementById("ga_filter_cat").value;
      const catQ=cat?`&category=${encodeURIComponent(cat)}`:"";
      fetch(`/admin/api/plugin/gbdemo/list?page=${encodeURIComponent(page||1)}&limit=${encodeURIComponent(ga.pageSize||15)}&status=${encodeURIComponent(status)}${catQ}`)
        .then(r=>r.json()).then(data=>{if(!data.result)throw new Error(data.message||"Load failed");gaRender(data)})
        .catch(err=>gaSetStatus(err&&err.message?err.message:"Load failed","#f87171"));
    }
    function gaPrev(){if(ga.page>1)gaLoad(ga.page-1)}
    function gaNext(){if(ga.page*ga.pageSize<ga.total)gaLoad(ga.page+1)}
    function gaSave(id){
      const body={id,status:parseInt(document.getElementById(`ga_s_${id}`).value,10),reply:document.getElementById(`ga_r_${id}`).value};
      gaSetStatus("Saving...");
      fetch("/admin/api/plugin/gbdemo/update",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
        .then(r=>r.json()).then(data=>{if(!data.result)throw new Error(data.message||"Save failed");gaSetStatus(data.message||"Saved.");gaLoad(ga.page);gaLoadStats()})
        .catch(err=>gaSetStatus(err&&err.message?err.message:"Save failed","#f87171"));
    }
    function gaDel(id){
      if(!confirm(`Delete message #${id} and all its replies?`))return;
      gaSetStatus("Deleting...");
      fetch("/admin/api/plugin/gbdemo/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})
        .then(r=>r.json()).then(data=>{if(!data.result)throw new Error(data.message||"Delete failed");gaSetStatus(data.message||"Deleted.");gaLoad(ga.page);gaLoadStats()})
        .catch(err=>gaSetStatus(err&&err.message?err.message:"Delete failed","#f87171"));
    }
    function gaLoadMeta(){
      fetch("/api/plugin/gbdemo/meta").then(r=>r.json()).then(data=>{
        if(!data.result||!data.data)return;
        const d=data.data;
        ga.pageSize=d.pageSize||15;
        if(d.categories){
          const cats=d.categories.split(",").map(s=>s.trim()).filter(Boolean);
          const sel=document.getElementById("ga_filter_cat");
          sel.innerHTML=`<option value="">All categories</option>`+cats.map(c=>`<option value="${gaEsc(c)}">${gaEsc(c)}</option>`).join("");
        }
      }).catch(()=>{});
    }
    gaLoadMeta();gaLoadStats();gaLoad(1);
  </script>
</body>
</html>
