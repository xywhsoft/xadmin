.wrap{flex:1;overflow:auto}.tbl{width:100%;border-collapse:collapse;table-layout:fixed}.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid #eef2f7;font-size:14px;box-sizing:border-box}.tbl th{position:sticky;top:0;background:#f8fafc;z-index:1;color:#5b6b7b;text-align:left}

function norm(p){return (p||"").replace(/\\/g,"/").replace(/\/+/g,"/").replace(/^\//,"").replace(/\/$/,"")}
function join(a,b){return norm(a?(a+"/"+b):b)}
function enc(s){return encodeURIComponent(s||"")}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function isImg(ext){return["jpg","jpeg","png","gif","bmp","webp","svg","ico"].indexOf((ext||"").toLowerCase())>=0}
function isArc(ext){return["zip","7z","rar","tar","gz","tgz","xz","bz2"].indexOf((ext||"").toLowerCase())>=0}
function isEdit(ext,name){ext=(ext||"").toLowerCase();name=(name||"").toLowerCase();if(name==="dockerfile"||name==="makefile")return true;return["txt","md","log","ini","cfg","conf","json","xml","html","htm","css","js","ts","jsx","tsx","c","h","cpp","hpp","py","java","go","rs","sh","bat","sql","yaml","yml","toml","csv","env"].indexOf(ext)>=0}
function size(n){n=Number(n||0);if(n>=1073741824)return(n/1073741824).toFixed(2)+" GB";if(n>=1048576)return(n/1048576).toFixed(2)+" MB";if(n>=1024)return(n/1024).toFixed(2)+" KB";return n+" B"}
function msg(t,i){layer.msg(t,{icon:i||0})}
function setStatus(t){document.getElementById("status").textContent=t}
function api(url,opt){return fetch(url,opt).then(function(r){return r.json().catch(function(){return{result:false,message:I18N.serverNoJson}})})}
function curSel(){var map={},ids=Object.keys(state.selected),out=[];state.items.forEach(function(it){map[String(it.id)]=it});ids.forEach(function(id){if(map[id])out.push(map[id])});return out}
function syncBtns(){var c=curSel(),has=c.length>0,oneArc=c.length===1&&!c[0].isdir&&isArc(c[0].ext);[["btnCopy",has],["btnCut",has],["btnDelete",has],["btnCompress",has],["btnExtract",oneArc],["btnPaste",!!state.clip&&state.clip.items.length>0]].forEach(function(p){var el=document.getElementById(p[0]);if(p[1])el.classList.remove("disabled");else el.classList.add("disabled")});document.getElementById("selection").textContent=I18N.selectedPrefix+c.length+I18N.selectedSuffix}
function renderCrumb(){var el=document.getElementById("crumb"),parts=state.path?state.path.split("/"):[],html='<a href="#" data-p="">'+I18N.root+'</a>',p="";parts.forEach(function(part,i){p+=(p?"/":"")+part;html+='<span>/</span>'+(i===parts.length-1?'<strong>'+esc(part)+'</strong>':'<a href="#" data-p="'+esc(p)+'">'+esc(part)+'</a>')});el.innerHTML=html;Array.prototype.forEach.call(el.querySelectorAll("a[data-p]"),function(a){a.onclick=function(e){e.preventDefault();state.path=this.getAttribute("data-p")||"";load()}})}
function itemType(it){if(it.isroot)return I18N.drive;if(it.isdir)return I18N.folder;return it.ext?String(it.ext).toUpperCase():I18N.file}
function icon(it){if(it.isdir)return"layui-icon-file-b";if(isImg(it.ext))return"layui-icon-picture";if(isArc(it.ext))return"layui-icon-release";return"layui-icon-file"}
function rowHtml(it){var cls=state.selected[String(it.id)]?"sel":"",fileCls=it.isdir?"":"file",actions="",disabled=it.isroot?' disabled':'';if(!it.isroot){actions+='<button class="layui-btn layui-btn-xs layui-btn-primary" data-dl="'+it.id+'">'+I18N.download+'</button>';if(!it.isdir&&isEdit(it.ext,it.name))actions+=' <button class="layui-btn layui-btn-xs" data-ed="'+it.id+'">'+I18N.edit+'</button>';if(!it.isdir&&isImg(it.ext))actions+=' <button class="layui-btn layui-btn-xs" data-img="'+it.id+'">'+I18N.preview+'</button>';actions+=' <button class="layui-btn layui-btn-xs layui-btn-danger" data-del="'+it.id+'">'+I18N.delete+'</button>'}return'<tr data-id="'+it.id+'" class="'+cls+'"><td class="c1"><input class="chk" data-id="'+it.id+'" type="checkbox"'+disabled+' '+(state.selected[String(it.id)]?"checked":"")+'></td><td><div class="name"><i class="layui-icon '+icon(it)+'"></i><span class="'+fileCls+'" data-open="'+it.id+'">'+esc(it.name)+'</span></div></td><td class="c3">'+(it.isdir?"-":size(it.size))+'</td><td class="c4">'+esc(it.time||"-")+'</td><td class="c5">'+esc(itemType(it))+'</td><td class="c6">'+actions+'</td></tr>'}
function find(id){id=String(id);for(var i=0;i<state.items.length;i++)if(String(state.items[i].id)===id)return state.items[i];return null}
function render(){var tb=document.getElementById("tbody");if(!state.items.length){tb.innerHTML='<tr><td colspan="6" class="empty">'+I18N.empty+'</td></tr>';syncBtns();return}tb.innerHTML=state.items.map(rowHtml).join("");Array.prototype.forEach.call(document.querySelectorAll(".chk"),function(el){el.onchange=function(){var id=String(this.getAttribute("data-id"));if(this.disabled)return;if(this.checked)state.selected[id]=true;else delete state.selected[id];render()}});Array.prototype.forEach.call(document.querySelectorAll("[data-open]"),function(el){el.onclick=function(){var tr=this.closest("tr"),chk=tr.querySelector(".chk");if(!chk.disabled){chk.checked=!chk.checked;chk.dispatchEvent(new Event("change"))}};el.ondblclick=function(){open(find(this.getAttribute("data-open")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-dl]"),function(el){el.onclick=function(){download(find(this.getAttribute("data-dl")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-ed]"),function(el){el.onclick=function(){edit(find(this.getAttribute("data-ed")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-img]"),function(el){el.onclick=function(){preview(find(this.getAttribute("data-img")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(el){el.onclick=function(){removeItems([find(this.getAttribute("data-del"))])}});syncBtns()}
function load(){state.selected={};document.getElementById("checkAll").checked=false;renderCrumb();setStatus(I18N.loadingPrefix+(state.path||I18N.root));api("/admin/api/plugin/filemanager/list?path="+enc(state.path)).then(function(res){state.items=Array.isArray(res.data)?res.data:[];state.items.sort(function(a,b){if(!!a.isdir!==!!b.isdir)return a.isdir?-1:1;return String(a.name||"").localeCompare(String(b.name||""),"zh-CN")});render();setStatus(I18N.currentPrefix+(state.path||I18N.root)+I18N.currentMiddle+state.items.length+I18N.currentSuffix)}).catch(function(err){state.items=[];render();setStatus(I18N.loadFailed);msg(I18N.listFailed+err.message,2)})}
function open(it){if(!it)return;if(it.isdir){state.path=join(state.path,it.name);load();return}if(isImg(it.ext)){preview(it);return}if(isEdit(it.ext,it.name)){edit(it);return}download(it)}
function download(it){if(!it)return;window.open("/admin/api/plugin/filemanager/download?path="+enc(join(state.path,it.name)),"_blank")}
function promptCreate(isFile){layer.prompt({formType:0,title:isFile?I18N.createFileTitle:I18N.createDirTitle},function(val,idx){val=String(val||"").trim();if(!val){msg(I18N.nameRequired,2);return}api("/admin/api/plugin/filemanager/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fileName:val,folderPath:state.path,isfile:isFile?1:0})}).then(function(res){if(res.result){layer.close(idx);msg(isFile?I18N.fileCreated:I18N.folderCreated,1);load()}else msg(res.message||I18N.createFailed,2)}).catch(function(err){msg(I18N.createFailed+"\uff1a"+err.message,2)})})}
function removeItems(items){items=(items||[]).filter(Boolean);if(!items.length){msg(I18N.selectFirst);return}layer.confirm(I18N.confirmDeletePrefix+items.length+I18N.confirmDeleteSuffix,{icon:3,title:I18N.confirmDeleteTitle},function(idx){api("/admin/api/plugin/filemanager/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({folderPath:state.path,items:items.map(function(it){return{name:it.name,isdir:it.isdir?1:0}})})}).then(function(res){layer.close(idx);if(res.result){msg(I18N.deleteSuccess,1);load()}else msg(res.message||I18N.deleteFailed,2)}).catch(function(err){layer.close(idx);msg(I18N.deleteFailed+"\uff1a"+err.message,2)})})}
function copySel(isCut){var items=curSel();if(!items.length){msg(I18N.selectFirst);return}state.clip={isCut:!!isCut,items:items.map(function(it){return{sourcePath:join(state.path,it.name),isdir:it.isdir?1:0}})};syncBtns();msg(isCut?I18N.cutted:I18N.copied,1)}
function pasteSel(){if(!state.clip||!state.clip.items.length){msg(I18N.clipboardEmpty);return}api("/admin/api/plugin/filemanager/copy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetPath:state.path,isCut:state.clip.isCut?1:0,items:state.clip.items})}).then(function(res){if(res.result){msg(state.clip.isCut?I18N.moveSuccess:I18N.copySuccess,1);if(state.clip.isCut)state.clip=null;load()}else msg(res.message||I18N.pasteFailed,2);syncBtns()}).catch(function(err){msg(I18N.pasteFailed+"\uff1a"+err.message,2)})}
function edit(it){if(!it)return;var fp=join(state.path,it.name);api("/admin/api/plugin/filemanager/content?path="+enc(fp)).then(function(res){if(!res.result){msg(res.message||I18N.readFailed,2);return}var html='<div class="editor"><div class="hd">'+esc(fp)+'</div><textarea id="editorText">'+esc(res.content||"")+'</textarea></div>';var id=layer.open({type:1,title:I18N.editTitle,area:["860px","640px"],maxmin:true,content:html,btn:[I18N.save,I18N.close],yes:function(){api("/admin/api/plugin/filemanager/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:fp,content:document.getElementById("editorText").value})}).then(function(ret){if(ret.result){msg(I18N.saveSuccess,1);layer.close(id);load()}else msg(ret.message||I18N.saveFailed,2)}).catch(function(err){msg(I18N.saveFailed+"\uff1a"+err.message,2)})}})}).catch(function(err){msg(I18N.readFailed+"\uff1a"+err.message,2)})}

function upload(files){files=Array.prototype.slice.call(files||[]);if(!files.length)return;var i=0,bad=0;setStatus(I18N.uploadingPrefix+files.length+I18N.uploadingSuffix);(function next(){if(i>=files.length){setStatus(I18N.uploadFinished);msg(bad>0?I18N.uploadPartialPrefix+bad+I18N.uploadPartialSuffix:I18N.uploadSuccess,bad>0?2:1);load();return}var fd=new FormData();fd.append("file",files[i]);fetch("/admin/api/plugin/filemanager/upload?path="+enc(state.path),{method:"POST",body:fd}).then(function(r){return r.json()}).then(function(res){if(!res.result)bad++;i++;next()}).catch(function(){bad++;i++;next()})})()}
function compressSel(){var items=curSel();if(!items.length){msg(I18N.selectFirst);return}var def=items.length===1?items[0].name:"archive";layer.open({type:1,title:I18N.compressTitle,area:["420px","290px"],content:'<div style="padding:16px"><div class="layui-form-item"><label class="layui-form-label" style="width:90px">'+I18N.format+'</label><div class="layui-input-block" style="margin-left:120px"><select id="cfmt" class="layui-input"><option value="zip">zip</option><option value="7z">7z</option><option value="tar.gz">tar.gz</option></select></div></div><div class="layui-form-item"><label class="layui-form-label" style="width:90px">'+I18N.archiveName+'</label><div class="layui-input-block" style="margin-left:120px"><input id="cname" class="layui-input" value="'+esc(def.replace(/\.[^.]+$/,""))+'"></div></div><div class="layui-form-item"><label class="layui-form-label" style="width:90px">'+I18N.savePath+'</label><div class="layui-input-block" style="margin-left:120px"><input id="cpath" class="layui-input" value="'+esc(state.path)+'"></div></div></div>',btn:[I18N.run,I18N.cancel],yes:function(idx){var fmt=document.getElementById("cfmt").value,name=document.getElementById("cname").value.trim(),save=norm(document.getElementById("cpath").value.trim());if(!name){msg(I18N.archiveNameRequired,2);return}api("/admin/api/plugin/filemanager/compress",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({format:fmt,filename:name,savePath:save,sourcePath:state.path,items:items.map(function(it){return{name:it.name}})})}).then(function(res){if(res.result){layer.close(idx);msg(I18N.compressSuccess,1);load()}else msg(res.message||I18N.compressFailed,2)}).catch(function(err){msg(I18N.compressFailed+"\uff1a"+err.message,2)})}})}
function extractSel(){var items=curSel();if(items.length!==1||items[0].isdir||!isArc(items[0].ext)){msg(I18N.selectOneArchive);return}var it=items[0],ap=join(state.path,it.name),def=join(state.path,it.name.replace(/\.[^.]+$/,""));layer.prompt({formType:0,title:I18N.extractTitle,value:def},function(val,idx){val=norm(String(val||"").trim());if(!val){msg(I18N.extractPathRequired,2);return}api("/admin/api/plugin/filemanager/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({archivePath:ap,extractPath:val})}).then(function(res){if(res.result){layer.close(idx);msg(I18N.extractSuccess,1);load()}else msg(res.message||I18N.extractFailed,2)}).catch(function(err){msg(I18N.extractFailed+"\uff1a"+err.message,2)})})}
layui.use(["layer"],function(){layer=layui.layer;document.getElementById("btnUp").onclick=function(){if(!state.path)return;var arr=state.path.split("/");arr.pop();state.path=arr.join("/");load()};document.getElementById("btnRefresh").onclick=load;document.getElementById("btnNewFile").onclick=function(){promptCreate(true)};document.getElementById("btnNewDir").onclick=function(){promptCreate(false)};document.getElementById("btnDelete").onclick=function(){removeItems(curSel())};document.getElementById("btnCopy").onclick=function(){copySel(false)};document.getElementById("btnCut").onclick=function(){copySel(true)};document.getElementById("btnPaste").onclick=pasteSel;document.getElementById("btnCompress").onclick=compressSel;document.getElementById("btnExtract").onclick=extractSel;document.getElementById("btnUpload").onclick=function(){document.getElementById("uploadInput").click()};document.getElementById("uploadInput").onchange=function(){upload(this.files);this.value=""};document.getElementById("checkAll").onchange=function(){state.selected={};if(this.checked)state.items.forEach(function(it){if(!it.isroot)state.selected[String(it.id)]=true});render()};document.getElementById("crumb").ondblclick=function(){var inp=document.getElementById("pathInput");inp.style.display="block";inp.value=state.path;inp.focus();inp.select()};document.getElementById("pathInput").onkeydown=function(e){if(e.key==="Enter"){state.path=norm(this.value);this.style.display="none";load()}else if(e.key==="Escape"){this.style.display="none"}};document.getElementById("pathInput").onblur=function(){this.style.display="none"};load()})
})();
</script>
