<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Content_Model" lay-filter="Table_Content_Model"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Content_Model">
	<div class="layui-inline">
		<input type="text" id="Search_Content_Model" placeholder="搜索模型名称..." class="layui-input" style="width: 240px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Content_Model_Search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Content_Model_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm" lay-event="Content_Model_Add"><i class="layui-icon layui-icon-addition"></i> 添加模型</button>
	</div>
</script>

<!-- 操作列 -->
<script type="text/html" id="Tool_Content_Model">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<!-- 页面逻辑处理 -->
<script>
	layui.use(["table", "layer"], function(){
		var table = layui.table;
		var layer = layui.layer;
		var $ = layui.$;
		var allRows = [];

		function normalizeRows(result) {
			var rows = result && result.data;
			return Array.isArray(rows) ? rows : [];
		}

		function textOf(value) {
			return value == null ? "" : String(value);
		}

		function rowTitle(row) {
			return textOf(row.title || row.name || row.xid || "-");
		}

		function escapeHtml(value) {
			return textOf(value)
				.replace(/&/g, "&amp;")
				.replace(/</g, "&lt;")
				.replace(/>/g, "&gt;")
				.replace(/"/g, "&quot;")
				.replace(/'/g, "&#39;");
		}

		function filterRows(keyword) {
			var q = textOf(keyword).trim().toLowerCase();
			if (!q) return allRows.slice();
			return allRows.filter(function(row){
				return [
					row.title,
					row.name,
					row.xid,
					row.namespace,
					row.typeKey,
					row.description,
					row.generatedPluginXid
				].some(function(value){
					return textOf(value).toLowerCase().indexOf(q) >= 0;
				});
			});
		}

		function renderRows(rows) {
			table.reloadData("Table_Content_Model", {
				data: rows,
				page: { curr: 1 }
			});
		}

		function loadRows(keyword) {
			return fetch("/admin/api/plugin/content-system/types", {
				credentials: "same-origin",
				headers: { "Accept": "application/json" }
			})
			.then(function(response){ return response.json(); })
			.then(function(result){
				if (!result || result.result !== true) {
					throw new Error((result && result.message) || "加载模型列表失败");
				}
				allRows = normalizeRows(result);
				renderRows(filterRows(keyword));
			})
			.catch(function(error){
				layer.msg(error.message || "加载模型列表失败", { icon: 2 });
			});
		}

		function openEditor(id) {
			var title = id ? "编辑模型" : "添加模型";
			var url = "/admin/view/plugin/content-system/editor";
			if (id) url += "?id=" + encodeURIComponent(id);
			else url += "?new=1";
			layer.open({
				title: title,
				type: 2,
				shadeClose: false,
				area: ["92%", "88%"],
				content: url,
				end: function(){
					loadRows(document.getElementById("Search_Content_Model").value);
				}
			});
		}

		table.render({
			elem: "#Table_Content_Model",
			toolbar: "#Toolbar_Content_Model",
			data: [],
			defaultToolbar: ["filter", "exports", "print"],
			height: "full-135",
			cellMinWidth: 80,
			skin: "line",
			totalRow: false,
			page: {
				limit: 20,
				groups: 11,
				layout: ["count", "prev", "page", "next", "limit", "refresh", "skip"]
			},
			cols: [[
				{field: "id", width: 80, title: "ID"},
				{title: "模型名称", minWidth: 180, templet: function(d){ return "<code>" + escapeHtml(rowTitle(d)) + "</code>"; }},
				{field: "xid", width: 200, title: "插件标识"},
				{field: "namespace", width: 120, title: "命名空间"},
				{title: "当前修订", width: 110, templet: function(d){ return '<span class="layui-badge layui-bg-blue">' + Number(d.currentRevision || 0) + '</span>'; }},
				{title: "已应用修订", width: 120, templet: function(d){ return '<span class="layui-badge layui-bg-green">' + Number(d.appliedRevision || 0) + '</span>'; }},
				{title: "受管插件", width: 190, templet: function(d){ return escapeHtml(d.generatedPluginXid || "-"); }},
				{field: "updateTimeText", width: 180, title: "修改时间"},
				{width: 150, title: "操作", fixed: "right", templet: "#Tool_Content_Model"}
			]],
			done: function(){},
			error: function(res, msg){ console.log(res, msg); }
		});

		table.on("toolbar(Table_Content_Model)", function(obj){
			switch (obj.event) {
				case "Content_Model_Search":
					renderRows(filterRows(document.getElementById("Search_Content_Model").value));
					break;
				case "Content_Model_Refresh":
					loadRows(document.getElementById("Search_Content_Model").value);
					break;
				case "Content_Model_Add":
					openEditor(0);
					break;
			}
		});

		table.on("tool(Table_Content_Model)", function(obj){
			var data = obj.data || {};
			if (obj.event === "edit") {
				openEditor(data.id);
			} else if (obj.event === "delete") {
				layer.confirm('确定删除模型 "' + rowTitle(data) + '" 吗？', {
					icon: 3,
					title: "删除确认"
				}, function(index){
					$.ajax({
						url: "/admin/api/plugin/content-system/type/delete",
						type: "POST",
						data: JSON.stringify({ id: data.id }),
						contentType: "application/json",
						dataType: "json",
						success: function(result){
							if (result && result.result === true) {
								layer.msg(result.message || "删除成功", { icon: 1 });
								loadRows(document.getElementById("Search_Content_Model").value);
							} else {
								layer.msg((result && result.message) || "删除失败", { icon: 2 });
							}
						},
						error: function(){
							layer.msg("请求出错", { icon: 2 });
						}
					});
					layer.close(index);
				});
			}
		});

		document.getElementById("Search_Content_Model").addEventListener("keydown", function(event){
			if (event.key === "Enter") {
				renderRows(filterRows(event.target.value));
			}
		});

		loadRows("");
	});
	
</script>
