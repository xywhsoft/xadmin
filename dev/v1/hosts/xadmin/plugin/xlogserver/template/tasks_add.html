<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>新建任务</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
	<style>
		body {{ padding: 16px; background: #fff; }}
	</style>
</head>
<body>
	<form class="layui-form" lay-filter="TaskForm">
		<div class="layui-form-item">
			<label class="layui-form-label">任务名称</label>
			<div class="layui-input-block">
				<input type="text" name="name" required lay-verify="required" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">任务描述</label>
			<div class="layui-input-block">
				<textarea name="desc" class="layui-textarea"></textarea>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-input-block">
				<button class="layui-btn" lay-submit lay-filter="submitTask">保存</button>
				<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
			</div>
		</div>
	</form>

	<script src="/layui/layui.js"></script>
	<script>
		var G_ServiceId = {$serviceId};
		layui.use(['form'], function(){{
			var form = layui.form;
			var layer = layui.layer;
			var $ = layui.$;
			form.on('submit(submitTask)', function(data){{
				$.ajax({{
					url: '/admin/api/plugin/xlogserver/tasks?serviceId=' + G_ServiceId,
					type: 'POST',
					data: JSON.stringify(data.field),
					contentType: 'application/json',
					dataType: 'json',
					success: function(res){{
						if (res.result) {{
							parent.layer.msg('任务已创建', {{icon: 1}});
							if (parent.xlogReloadTasks) parent.xlogReloadTasks();
							var index = parent.layer.getFrameIndex(window.name);
							parent.layer.close(index);
						}} else {{
							layer.msg(res.message || '保存失败', {{icon: 2}});
						}}
					}}
				}});
				return false;
			}});
			document.getElementById('btnCancel').onclick = function(){{
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			}};
		}});
	</script>
</body>
</html>
