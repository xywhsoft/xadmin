<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Services" lay-filter="Table_Services"></table>
</div>

<script type="text/html" id="Toolbar_Services">
	<div class="layui-inline">
		<input type="text" id="searchServices" placeholder="Search services..." class="layui-input" style="width: 240px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Services_Search"><i class="layui-icon layui-icon-search"></i> Search</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Services_Refresh"><i class="layui-icon layui-icon-refresh"></i> Refresh</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="Services_Add"><i class="layui-icon layui-icon-add-1"></i> New Service</button>
		<button class="layui-btn layui-btn-sm layui-btn-danger" lay-event="Services_Del"><i class="layui-icon layui-icon-delete"></i> Delete</button>
	</div>
</script>

<script type="text/html" id="Tool_Services">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">Edit</a>
		<a class="layui-btn layui-btn-xs layui-bg-red" lay-event="delete">Delete</a>
	</div>
</script>

<script>
	layui.use(['table'], function(){
		var table = layui.table;
		var layer = layui.layer;
		var $ = layui.$;

		table.render({
			elem: '#Table_Services',
			toolbar: '#Toolbar_Services',
			url: '/admin/api/plugin/xlogserver/services',
			defaultToolbar: ['filter', 'exports', 'print'],
			height: 'full-135',
			cellMinWidth: 60,
			skin: "line",
			totalRow: false,
			page: {
				limit: 20,
				groups: 11,
				layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
			},
			cols: [[
				{type: 'checkbox', fixed: 'left'},
				{field:'id', width:80, title: 'ID'},
				{field:'name', width:200, title: 'Service'},
				{field:'desc', title: 'Description'},
				{field:'db', width:360, title: 'Database'},
				{field:'createTime', width:180, title: 'Created'},
				{field:'updateTime', width:180, title: 'Updated'},
				{width:120, title: 'Actions', templet: '#Tool_Services'},
			]],
			done: function(){},
			error: function(res, msg){ console.log(res, msg) }
		});

		table.on('toolbar(Table_Services)', function(obj){
			switch ( obj.event ) {
				case 'Services_Search':
					table.reloadData('Table_Services', {
						where: { search: "%" + document.getElementById('searchServices').value + "%" },
					});
				break;
				case 'Services_Refresh':
					table.reloadData('Table_Services');
				break;
				case 'Services_Add':
					layer.open({
						title: 'New Service',
						type: 2,
						shadeClose: true,
						area: ['500px', '320px'],
						content: '/admin/view/plugin/xlogserver/services/add',
					});
				break;
				case 'Services_Del':
					var checkStatus = table.checkStatus('Table_Services');
					var data = checkStatus.data;
					var count = data.length;
					if ( count === 0 ) {
						layer.msg('Please select services to delete', {icon: 2});
						return;
					}
					var ids = [];
					var names = [];
					for ( var i = 0; i < count; i++ ) {
						ids.push(data[i].id);
						names.push(data[i].name);
					}
					layer.confirm('Delete ' + count + ' services?<br>' + names.join(', ') + '<br><span style="color: red;">This cannot be undone!</span>', {icon: 3, title: 'Confirm Delete'}, function(index){
						$.ajax({
							url: '/admin/api/plugin/xlogserver/services',
							type: 'DELETE',
							data: JSON.stringify(ids),
							contentType: 'application/json',
							dataType: 'json',
							success: function(res){
								if ( res.result ) {
									layer.msg(res.message, {icon: 1});
									table.reloadData('Table_Services');
								} else {
									layer.msg(res.message, {icon: 2});
								}
							}
						});
						layer.close(index);
					});
				break;
			};
		});

		table.on('tool(Table_Services)', function(obj){
			var data = obj.data;
			if ( obj.event == 'edit' ) {
				layer.open({
					title: 'Edit Service',
					type: 2,
					shadeClose: true,
					area: ['500px', '366px'],
					content: '/admin/view/plugin/xlogserver/services/edit?id=' + data.id,
				});
			} else if ( obj.event == 'delete' ) {
				layer.confirm('Delete service "' + data.name + '"?<br>Database file will not be deleted.', {icon: 3, title: 'Confirm Delete'}, function(index){
					$.ajax({
						url: '/admin/api/plugin/xlogserver/services',
						type: 'DELETE',
						data: JSON.stringify([data.id]),
						contentType: 'application/json',
						dataType: 'json',
						success: function(res){
							if ( res.result ) {
								layer.msg(res.message, {icon: 1});
								table.reloadData('Table_Services');
							} else {
								layer.msg(res.message, {icon: 2});
							}
						}
					});
					layer.close(index);
				});
			}
		});
	});
</script>
