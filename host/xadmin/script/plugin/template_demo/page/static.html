<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>静态页面示例</title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
		h1 { color: #2c3e50; }
		.info { background: #e8f4f8; padding: 20px; border-radius: 5px; margin: 20px 0; }
		.note { background: #fff3cd; padding: 15px; border-left: 4px solid #ffc107; margin: 20px 0; }
	</style>
</head>
<body>
	<h1>静态页面示例</h1>
	<div class="info">
		<p>这是从插件 <code>page</code> 目录加载的静态 HTML 页面。</p>
		<p>与模板不同，静态页面不经过模板引擎渲染，直接返回原始 HTML 内容。</p>
	</div>
	<div class="note">
		<p><strong>注意：</strong>放置在插件 page 目录下的页面可以享受 xAdmin 的权限控制机制。</p>
	</div>
</body>
</html>
