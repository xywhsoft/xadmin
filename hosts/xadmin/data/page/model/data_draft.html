<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>草稿箱</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Model_Draft" lay-filter="Table_Model_Draft"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Model_Draft">
	<div class="layui-inline">
		<input type="text" id="searchKeyword" placeholder="搜索..." class="layui-input" style="width: 200px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Draft_Search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Draft_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm layui-bg-green" lay-event="Draft_Publish_Selected"><i class="layui-icon layui-icon-release"></i> 批量发布</button>
		<button class="layui-btn layui-btn-sm layui-bg-orange" lay-event="Draft_Delete_Selected"><i class="layui-icon layui-icon-delete"></i> 批量删除</button>
		<button class="layui-btn layui-btn-sm layui-bg-red" lay-event="Draft_Clear"><i class="layui-icon layui-icon-fonts-clear"></i> 清空草稿箱</button>
	</div>
</script>

<!-- 操作列模板 -->
<script type="text/html" id="Tool_Model_Draft">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-bg-green" lay-event="publish">发布</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<!-- 作者类型模板 -->
<script type="text/html" id="Tpl_AuthorType">
{{# if(d.authorType === 0){ }}
<span class="layui-badge layui-bg-blue">管理员</span>
{{# } else if(d.authorType === 1){ }}
<span class="layui-badge layui-bg-green">会员</span>
{{# } else { }}
<span class="layui-badge layui-bg-gray">游客</span>
{{# } }}
</script>

<script src="/layui/layui.js"></script>
<script>
layui.use(['table'], function(){
	var table = layui.table;
	var layer = layui.layer;
	var $ = layui.$;
	
	// 从 URL 路径解析模型信息
	var sPath = window.location.pathname;
	var arrMatch = sPath.match(/\/admin\/view\/model\/data\/([^\/]+)\/([^\/]+)\/draft/);
	var sNamespace = '';
	var sModelName = '';
	
	if ( arrMatch && arrMatch.length >= 3 ) {
		sNamespace = arrMatch[1];
		sModelName = arrMatch[2];
	} else {
		arrMatch = sPath.match(/\/admin\/view\/model\/data\/([^\/]+)\/draft/);
		if ( arrMatch && arrMatch.length >= 2 ) {
			sModelName = arrMatch[1];
		}
	}
	
	// 构建 API 路径前缀
	var sApiPrefix = sNamespace ? ('/admin/' + sNamespace + '/' + sModelName) : ('/admin/' + sModelName);
	
	// 获取模型配置
	fetch('/admin/model/get?name=' + sModelName)
	.then(function(response){ return response.json(); })
	.then(function(result){
		if ( !result || !result.result ) {
			layer.msg('获取模型配置失败', {icon: 2});
			return;
		}
		
		var tblModel = result.data;
		
		// 获取字段配置
		fetch('/admin/model/fields?name=' + sModelName)
		.then(function(response){ return response.json(); })
		.then(function(fieldsResult){
			if ( !fieldsResult || !fieldsResult.result ) {
				layer.msg('获取字段配置失败', {icon: 2});
				return;
			}
			
			var arrFields = fieldsResult.data || [];
			
			// 构建表格列配置
			var arrCols = [
				{type: 'checkbox', fixed: 'left'},
				{field:'id', width:80, title: 'ID', sort: true}
			];
			
			// 根据字段配置添加列
			for ( var i = 0; i < arrFields.length; i++ ) {
				var tblField = arrFields[i];
				var tblCol = {
					field: tblField.name,
					title: tblField.title || tblField.name
				};
				
				if ( tblField.listWidth ) {
					tblCol.width = tblField.listWidth;
				}
				
				if ( tblField.type === 'image' ) {
					tblCol.templet = '<img src="{{= d.' + tblField.name + ' }}" style="max-width:60px;max-height:40px;">';
				} else if ( tblField.type === 'switch' ) {
					tblCol.templet = '{{# if(d.' + tblField.name + '){ }}<span class="layui-badge layui-bg-green">是</span>{{# } else { }}<span class="layui-badge layui-bg-gray">否</span>{{# } }}';
				}
				
				if ( tblField.showInList !== false ) {
					arrCols.push(tblCol);
				}
			}
			
			// 添加作者列
			arrCols.push({field:'authorName', width:120, title: '作者'});
			arrCols.push({field:'authorType', width:80, title: '来源', templet: '#Tpl_AuthorType'});
			
			// 添加时间列
			arrCols.push({field:'createTime', width:180, title: '创建时间'});
			
			// 添加操作列
			arrCols.push({width:180, title: '操作', toolbar: '#Tool_Model_Draft', fixed: 'right'});
			
			// 创建渲染实例
			table.render({
				elem: '#Table_Model_Draft',
				toolbar: '#Toolbar_Model_Draft',
				url: sApiPrefix + '/draft/list',
				defaultToolbar: ['filter', 'exports', 'print'],
				height: 'full-80',
				cellMinWidth: 60,
				skin: "line",
				page: {
					limit: 20,
					groups: 11,
					layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
				},
				cols: [arrCols],
				done: function(){
				},
				error: function(res, msg){
					console.log(res, msg);
				}
			});
			
			// 工具栏事件
			table.on('toolbar(Table_Model_Draft)', function(obj){
				switch ( obj.event ) {
					case 'Draft_Search':
						table.reloadData('Table_Model_Draft', {
							where: {
								search: document.getElementById('searchKeyword').value,
							},
						});
					break;
					case 'Draft_Refresh':
						table.reloadData('Table_Model_Draft');
					break;
					case 'Draft_Publish_Selected':
						var checkStatus = table.checkStatus('Table_Model_Draft');
						var data = checkStatus.data;
						if ( data.length === 0 ) {
							layer.msg('请选择要发布的草稿', {icon: 0});
							return;
						}
						var ids = data.map(function(item){ return item.id; });
						layer.confirm('确定要发布选中的 ' + ids.length + ' 条草稿吗？', {
							icon: 3,
							title: '批量发布确认'
						}, function(index){
							fetch(sApiPrefix + '/draft/publish_batch', {
								method: 'POST',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({ ids: ids })
							})
							.then(function(response){ return response.json(); })
							.then(function(result){
								if ( result && result.result === true ) {
									layer.msg(result.message || '发布成功', {icon: 1});
									table.reloadData('Table_Model_Draft');
								} else {
									layer.msg(result.message || '发布失败', {icon: 2});
								}
							})
							.catch(function(error){
								layer.msg('请求出错', {icon: 2});
								console.error('Error:', error);
							});
							layer.close(index);
						});
					break;
					case 'Draft_Delete_Selected':
						var checkStatus = table.checkStatus('Table_Model_Draft');
						var data = checkStatus.data;
						if ( data.length === 0 ) {
							layer.msg('请选择要删除的草稿', {icon: 0});
							return;
						}
						var ids = data.map(function(item){ return item.id; });
						layer.confirm('确定要删除选中的 ' + ids.length + ' 条草稿吗？', {
							icon: 3,
							title: '批量删除确认'
						}, function(index){
							fetch(sApiPrefix + '/draft/delete_batch', {
								method: 'DELETE',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({ ids: ids })
							})
							.then(function(response){ return response.json(); })
							.then(function(result){
								if ( result && result.result === true ) {
									layer.msg(result.message || '删除成功', {icon: 1});
									table.reloadData('Table_Model_Draft');
								} else {
									layer.msg(result.message || '删除失败', {icon: 2});
								}
							})
							.catch(function(error){
								layer.msg('请求出错', {icon: 2});
								console.error('Error:', error);
							});
							layer.close(index);
						});
					break;
					case 'Draft_Clear':
						layer.confirm('确定要清空草稿箱吗？此操作不可恢复！', {
							icon: 3,
							title: '清空草稿箱'
						}, function(index){
							fetch(sApiPrefix + '/draft/clear', {
								method: 'DELETE'
							})
							.then(function(response){ return response.json(); })
							.then(function(result){
								if ( result && result.result === true ) {
									layer.msg(result.message || '已清空', {icon: 1});
									table.reloadData('Table_Model_Draft');
								} else {
									layer.msg(result.message || '清空失败', {icon: 2});
								}
							})
							.catch(function(error){
								layer.msg('请求出错', {icon: 2});
								console.error('Error:', error);
							});
							layer.close(index);
						});
					break;
				};
			});
			
			// 触发单元格工具事件
			table.on('tool(Table_Model_Draft)', function(obj){
				var data = obj.data;
				if ( obj.event == 'edit' ) {
					var sEditUrl = sNamespace ? 
						('/admin/view/model/data/' + sNamespace + '/' + sModelName + '/draft/edit?id=' + data.id) :
						('/admin/view/model/data/' + sModelName + '/draft/edit?id=' + data.id);
					var layerIndex = layer.open({
						title: '编辑草稿',
						type: 2,
						shadeClose: false,
						area: ['700px', '600px'],
						content: sEditUrl,
						end: function(){
							table.reloadData('Table_Model_Draft');
						}
					});
				} else if ( obj.event == 'publish' ) {
					layer.confirm('确定要发布这条草稿吗？', {
						icon: 3,
						title: '发布确认'
					}, function(index){
						fetch(sApiPrefix + '/draft/publish?id=' + data.id, {
							method: 'POST'
						})
						.then(function(response){ return response.json(); })
						.then(function(result){
							if ( result && result.result === true ) {
								layer.msg(result.message || '发布成功', {icon: 1});
								table.reloadData('Table_Model_Draft');
							} else {
								layer.msg(result.message || '发布失败', {icon: 2});
							}
						})
						.catch(function(error){
							layer.msg('请求出错', {icon: 2});
							console.error('Error:', error);
						});
						layer.close(index);
					});
				} else if ( obj.event == 'delete' ) {
					layer.confirm('确定要删除这条草稿吗？', {
						icon: 3,
						title: '删除确认'
					}, function(index){
						fetch(sApiPrefix + '/draft/delete?id=' + data.id, {
							method: 'DELETE'
						})
						.then(function(response){ return response.json(); })
						.then(function(result){
							if ( result && result.result === true ) {
								layer.msg(result.message || '删除成功', {icon: 1});
								table.reloadData('Table_Model_Draft');
							} else {
								layer.msg(result.message || '删除失败', {icon: 2});
							}
						})
						.catch(function(error){
							layer.msg('请求出错', {icon: 2});
							console.error('Error:', error);
						});
						layer.close(index);
					});
				}
			});
			
		});
	})
	.catch(function(error){
		layer.msg('获取模型配置出错', {icon: 2});
		console.error('Error:', error);
	});
	
});
</script>
</body>
</html>
