<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>编辑菜单</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="menuEditForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
			<input type="hidden" name="id" value="{$id}">
			
			<div class="layui-form-item">
				<label class="layui-form-label">上级分类</label>
				<div class="layui-input-block">
					<select name="parent" id="parentSelect" lay-filter="parent">
						<option value="0">无（顶级菜单）</option>
					</select>
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">菜单标题</label>
				<div class="layui-input-block">
					<input type="text" name="title" value="{$title}" required lay-verify="required" placeholder="请输入菜单标题" autocomplete="off" class="layui-input">
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">图标</label>
				<div class="layui-input-block">
					<div style="display: flex; width: 100%;">
						<span id="iconPreview" style="flex-shrink: 0; width: 38px; height: 36px; line-height: 36px; text-align: center; border: 1px solid #e6e6e6; border-radius: 4px 0 0 4px; font-size: 18px; border-right: none; background: #fff;"><i class="{$icon}"></i></span>
						<input type="text" name="icon" id="iconInput" value="{$icon}" placeholder="请选择图标" autocomplete="off" class="layui-input" style="flex: 1; border-radius: 0;" readonly>
						<button type="button" class="layui-btn layui-btn-primary" id="btnSelectIcon" style="flex-shrink: 0; border-radius: 0 4px 4px 0; margin-left: -1px;">选择</button>
					</div>
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">链接地址</label>
				<div class="layui-input-block">
					<input type="text" name="href" value="{$href}" placeholder="如：view/home" autocomplete="off" class="layui-input">
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">打开方式</label>
				<div class="layui-input-block">
					<select name="openType" id="openTypeSelect">
						<option value="_component">组件（_component）</option>
						<option value="_iframe">内嵌页面（_iframe）</option>
						<option value="_blank">新窗口（_blank）</option>
					</select>
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">排序值</label>
				<div class="layui-input-block">
					<input type="number" name="sort" value="{$sort}" placeholder="数值越小越靠前" autocomplete="off" class="layui-input">
				</div>
			</div>
			
			<div class="layui-form-item">
				<label class="layui-form-label">是否显示</label>
				<div class="layui-input-block">
					<input type="checkbox" name="visible" id="visibleCheckbox" lay-skin="switch" lay-text="显示|隐藏">
				</div>
			</div>
			
			<div class="layui-form-item layui-form-text">
				<label class="layui-form-label">备注</label>
				<div class="layui-input-block">
					<textarea name="remark" placeholder="可选，备注信息" class="layui-textarea">{$remark}</textarea>
				</div>
			</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submitMenuEdit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script src="/js/icon-picker.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			var $ = layui.$;
			
			// 当前菜单ID、父级ID和其他字段
			var iCurrentID = {$id};
			var iCurrentParent = {$parent};
			var sOpenType = '{$openType}';
			var iVisible = {$visible};
			
			// 设置打开方式下拉框的值
			$('#openTypeSelect').val(sOpenType || '_component');
			
			// 设置显示状态开关
			if ( iVisible === 1 ) {
				$('#visibleCheckbox').prop('checked', true);
			}
			
			// 加载分类列表
			function loadParentCategories()
			{
				fetch('/admin/option/menu')
				.then(function(response) { return response.json(); })
				.then(function(result) {
					if ( result.result ) {
						var arrData = result.data || [];
						var sOptions = '<option value="0"' + (iCurrentParent === 0 ? ' selected' : '') + '>无（顶级菜单）</option>';
						
						for ( var i = 0; i < arrData.length; i++ ) {
							var item = arrData[i];
							if ( item.type === 0 ) {
								var sSelected = (item.id === iCurrentParent) ? ' selected' : '';
								sOptions += '<option value="' + item.id + '"' + sSelected + '>' + item.title + '</option>';
							}
						}
						
						$('#parentSelect').html(sOptions);
						form.render('select');
					}
				})
				.catch(function(error) {
					console.error('Error:', error);
				});
			}
			
			// 渲染表单
			form.render();
			loadParentCategories();
			
			// 图标选择按钮
			$('#btnSelectIcon').on('click', function(){
				IconPicker.open(this, function(sIcon){
					$('#iconInput').val(sIcon);
					if ( sIcon ) {
						$('#iconPreview').html('<i class="' + sIcon + '"></i>');
					} else {
						$('#iconPreview').html('');
					}
				});
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submitMenuEdit)', function(data){
				var field = data.field;
				
				var tblFormData = {
					id: parseInt(field.id),
					parent: parseInt(field.parent) || 0,
					title: field.title,
					icon: field.icon || '',
					type: 1,
					href: field.href || '',
					openType: field.openType || '_component',
					sort: parseInt(field.sort) || 0,
					visible: field.visible === 'on' ? 1 : 0,
					remark: field.remark || ''
				};
				
				fetch('/admin/option/menu', {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(tblFormData)
				})
				.then(function(response) { return response.json(); })
				.then(function(result) {
					if ( result.result ) {
						layer.msg(result.message || '更新成功', {icon: 1});
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg(result.message || '更新失败', {icon: 2});
					}
				})
				.catch(function(error) {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
