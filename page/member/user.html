<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Member_User" lay-filter="Table_Member_User"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Member_User">
	<div class="layui-inline">
		<input type="text" id="Search_Member_User" placeholder="搜索用户名..." class="layui-input" style="width: 240px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Member_User_Search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Member_User_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Member_Identity_Settings">账户与登录设置</button>
		<button class="layui-btn layui-btn-sm" lay-event="Member_User_Add"><i class="layui-icon layui-icon-addition"></i> 添加用户</button>
	</div>
</script>

<!-- 操作列 -->
<script type="text/html" id="Tool_Member_User">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
        <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="security">安全</a>
		<a class="layui-btn layui-btn-xs layui-bg-cyan" lay-event="resetPwd">重置密码</a>
		<a class="layui-btn layui-btn-xs layui-bg-green" lay-event="balance">余额调整</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<!-- 页面逻辑处理 -->
<script>
	// SHA-256 哈希函数（使用 Web Crypto API）
	
	layui.use(['table'], function(){
		var table = layui.table;
		var layer = layui.layer;
		var $ = layui.$;
		var memberGroupMap = {};

        function securityBadge(verified, contact, success='已验证', absent='未绑定') {
            return '<span class="layui-badge ' + (verified ? 'layui-bg-green' : 'layui-bg-gray') + '">' + (verified ? success : contact ? '未验证' : absent) + '</span>';
        }
		function getGroupName(groupId, groupName) {
			if (groupName) {
				return groupName;
			}
			if (memberGroupMap[groupId]) {
				return memberGroupMap[groupId];
			}
			return groupId || '-';
		}

		function loadMemberGroups() {
			return fetch('/admin/member/group?page=1&limit=1000', {
				credentials: 'same-origin',
				headers: { 'Accept': 'application/json' }
			})
			.then(function(response){ return response.json(); })
			.then(function(result){
				var data = (result && result.data) || [];
				memberGroupMap = {};
				data.forEach(function(item){
					if (item && item.id) {
						memberGroupMap[item.id] = item.name || ('#' + item.id);
					}
				});
			})
			.catch(function(){
				memberGroupMap = {};
			});
		}
		
		// 创建渲染实例
		loadMemberGroups().finally(function(){
			table.render({
				elem: '#Table_Member_User',
				toolbar: '#Toolbar_Member_User',
				url: '/admin/member/user',
				defaultToolbar: ['filter', 'exports', 'print'],
				height: 'full-135',
				css: "",
				cellMinWidth: 60,
				skin: "line",
				totalRow: false,
				page: {
					limit: 20,
					groups: 11,
					layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
				},
				cols: [[
					{field:'id', width:80, title: 'ID'},
					{title: '用户名', templet: '<code>{{= d.username }}</code>'},
					{field:'nickname', width:140, title: '昵称'},
					{width:120, title: '用户组', templet: function(d){ return '<span class="layui-badge layui-bg-blue">' + getGroupName(d.groupId, d.groupName) + '</span>'; }},
					{width:100, title: '权限级别', templet: '<span class="layui-badge layui-bg-orange">{{= d.authLevel }}</span>'},
					{width:120, title: '余额(元)', templet: function(d){ return '<span class="layui-badge layui-bg-green">' + (d.balance / 100).toFixed(2) + '</span>'; }},
					{width:100, title: '状态', templet: function(d){ return d.status == 1 ? '<span class="layui-badge layui-bg-green">正常</span>' : '<span class="layui-badge layui-bg-gray">禁用</span>'; }},
					{field:'phone_verified', width:110, title:'手机验证', templet: function(d){return securityBadge(d.phone_verified, d.phone);}},
                    {field:'email_verified', width:110, title:'邮箱验证', templet: function(d){return securityBadge(d.email_verified, d.email);}},
                    {field:'security_questions_configured', width:130, title:'安全问题', templet:function(d){return d.security_recovery_pending ? '<span class="layui-badge layui-bg-orange">待处理恢复</span>' : securityBadge(d.security_questions_configured, d.security_questions_configured ? 'set' : '', '已设置', '未设置');}},
                    {field:'createTime', width:180, title: '注册时间'},
					{width:320, title: '操作', templet: '#Tool_Member_User'},
				]],
				done: function(){},
				error: function(res, msg){ console.log(res, msg); }
			});
		});
		
		// 工具栏事件
		table.on('toolbar(Table_Member_User)', function(obj){
			switch ( obj.event ) {
				case 'Member_Identity_Settings':
					layer.open({title:'网站账户与登录',type:2,shadeClose:true,area:['min(1000px, 94vw)','90vh'],content:'/admin/view/member/identity'});
					break;
				case 'Member_User_Search':
					table.reloadData('Table_Member_User', {
						where: { search: "%" + document.getElementById('Search_Member_User').value + "%" },
					});
				break;
				case 'Member_User_Refresh':
					table.reloadData('Table_Member_User');
				break;
				case 'Member_User_Add':
					layer.open({
						title: '添加前台用户',
						type: 2,
						shadeClose: true,
						area: ['550px', '560px'],
						content: '/admin/view/member/user/add',
					});
				break;
			};
		});
		
		// 触发单元格工具事件
		table.on('tool(Table_Member_User)', function(obj){
			var data = obj.data;
			if (obj.event === 'security') {
                layer.open({title:'用户安全与恢复',type:2,shadeClose:true,area:['min(850px, 94vw)','90vh'],content:'/admin/view/member/user/security?id='+data.id,
                    end:function(){table.reloadData('Table_Member_User');}});
            } else if ( obj.event == 'edit' ) {
				layer.open({
					title: '编辑用户',
					type: 2,
					shadeClose: true,
					area: ['550px', '576px'],
					content: '/admin/view/member/user/edit?id=' + data.id,
				});
			} else if ( obj.event == 'resetPwd' ) {
				layer.prompt({
					formType: 1,
					title: '重置密码 - ' + data.username,
					area: ['400px', '200px']
				}, async function(newPassword, promptIndex) {
					if (!newPassword || newPassword.trim() === '') {
						layer.msg('密码不能为空', {icon: 2});
						return;
					}
					const password = newPassword;
					fetch('/admin/member/user/repwd', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify({ id: data.id, username: data.username, password: password })
					})
					.then(response => response.json())
					.then(result => {
						if (result && result.result === true) {
							layer.msg(result.message || '密码重置成功', {icon: 1});
							table.reloadData('Table_Member_User');
							layer.close(promptIndex);
						} else {
							layer.msg(result.message || '重置失败', {icon: 2});
						}
					})
					.catch(error => {
						layer.msg('请求出错', {icon: 2});
						console.error('Error:', error);
					});
				});
			} else if ( obj.event == 'balance' ) {
				// 余额调整
				layer.open({
					title: '余额调整 - ' + data.username,
					type: 2,
					shadeClose: true,
					area: ['450px', '400px'],
					content: '/admin/view/member/user/balance?id=' + data.id,
				});
			} else if ( obj.event == 'delete' ) {
				layer.confirm('确定要删除用户 "' + data.username + '" 吗？', {
					icon: 3,
					title: '删除确认'
				}, function(index){
					fetch('/admin/member/user?id=' + data.id, {
						method: 'DELETE',
						headers: { 'Content-Type': 'application/json' }
					})
					.then(response => response.json())
					.then(result => {
						if (result && result.result === true) {
							layer.msg(result.message || '删除成功', {icon: 1});
							table.reloadData('Table_Member_User');
						} else {
							layer.msg(result.message || '删除失败', {icon: 2});
						}
					})
					.catch(error => {
						layer.msg('请求出错', {icon: 2});
						console.error('Error:', error);
					});
					layer.close(index);
				});
			}
		});
	});
</script>
