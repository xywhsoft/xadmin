<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>创建模型</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px; min-height: calc(100vh - 40px); display: flex; flex-direction: column;" lay-filter="ModelAddForm">
		<div class="layui-form-item">
			<label class="layui-form-label">模型标识</label>
			<div class="layui-input-block">
				<input type="text" name="name" required lay-verify="required" placeholder="英文字母，如 article" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">模型名称</label>
			<div class="layui-input-block">
				<input type="text" name="title" required lay-verify="required" placeholder="显示名称，如 文章" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">命名空间</label>
			<div class="layui-input-block">
				<input type="text" name="namespace" placeholder="API路径前缀，如 cms" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">图标</label>
			<div class="layui-input-block">
				<input type="text" name="icon" placeholder="layui-icon 图标类名" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item layui-form-text">
			<label class="layui-form-label">描述</label>
			<div class="layui-input-block">
				<textarea name="desc" placeholder="模型描述信息" class="layui-textarea" style="min-height: 80px;"></textarea>
			</div>
		</div>
		<div style="flex: 1;"></div>
		<div class="layui-form-item" style="text-align: right; margin-bottom: 0;">
			<button class="layui-btn" lay-submit lay-filter="submit">创建模型</button>
			<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submit)', function(data){
				var field = data.field;
				
				fetch('/admin/model/add', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(field)
				})
				.then(response => response.json())
				.then(data => {
					if ( data.result ) {
						layer.msg('创建成功', {icon: 1});
						parent.layui.table.reloadData('Table_Model_List');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
