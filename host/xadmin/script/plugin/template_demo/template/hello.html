<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title><% $title %></title>
	<style>
		body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
		h1 { color: #333; }
		.message { background: #f0f8ff; padding: 20px; border-radius: 5px; margin: 20px 0; }
		.time { color: #666; font-size: 14px; }
	</style>
</head>
<body>
	<h1><% $title %></h1>
	<div class="message">
		<p><% $message %></p>
	</div>
	<div class="time">
		时间戳: <% $time %>
	</div>
</body>
</html>
