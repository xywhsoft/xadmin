<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>上传附件</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/layui/css/layui.css" rel="stylesheet">
<style>
.upload-drag-area {
	width: 100%;
	height: 180px;
	border: 2px dashed #e2e2e2;
	border-radius: 8px;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	transition: all 0.3s;
	background: #fafafa;
}
.upload-drag-area:hover {
	border-color: #1E9FFF;
	background: #f0f9ff;
}
.upload-drag-area .layui-icon {
	font-size: 48px;
	color: #c2c2c2;
}
.upload-drag-area:hover .layui-icon {
	color: #1E9FFF;
}
.upload-drag-area p {
	margin-top: 10px;
	color: #999;
}
.upload-result {
	margin-top: 15px;
	padding: 10px;
	background: #f8f8f8;
	border-radius: 4px;
	display: none;
}
.upload-result.success {
	background: #f0fff0;
	border: 1px solid #52c41a;
}
.upload-result.error {
	background: #fff0f0;
	border: 1px solid #ff4d4f;
}
</style>
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
<div style="flex: 1; overflow-y: auto; padding: 20px;">
<form class="layui-form" lay-filter="Form_Attachment_Upload">
	<div class="layui-form-item">
		<div class="upload-drag-area" id="uploadArea">
			<i class="layui-icon layui-icon-upload"></i>
			<p>点击或拖拽文件到此区域上传</p>
		</div>
		<div class="upload-result" id="uploadResult"></div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">允许外链</label>
		<div class="layui-input-block">
			<input type="checkbox" name="allowHotlink" lay-skin="switch" lay-text="是|否" checked>
		</div>
	</div>
	
	<div class="layui-form-item">
		<label class="layui-form-label">访问类型</label>
		<div class="layui-input-block">
			<select name="accessType" lay-filter="accessType">
				<option value="0" selected>公开</option>
				<option value="1">登录可见</option>
				<option value="2">付费下载</option>
				<option value="3">权限级别</option>
			</select>
		</div>
	</div>
	
	<div class="layui-form-item" id="priceItem" style="display: none;">
		<label class="layui-form-label">价格(分)</label>
		<div class="layui-input-block">
			<input type="number" name="price" value="0" placeholder="请输入价格，单位：分" autocomplete="off" class="layui-input">
		</div>
	</div>
	
	<div class="layui-form-item" id="accessLevelItem" style="display: none;">
		<label class="layui-form-label">权限级别</label>
		<div class="layui-input-block">
			<input type="number" name="accessLevel" value="0" min="0" max="99" placeholder="0-99，用户级别≥此值才能访问" autocomplete="off" class="layui-input">
		</div>
	</div>
</form>
</div>
<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
	<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 关闭</button>
</div>

<script src="/layui/layui.js"></script>
<script>
layui.use(['form', 'upload'], function(){
	var form = layui.form;
	var upload = layui.upload;
	var layer = layui.layer;
	var $ = layui.$;
	
	// 取消按钮
	document.getElementById('btnCancel').onclick = function(){
		var index = parent.layer.getFrameIndex(window.name);
		parent.layer.close(index);
	};
	
	// 监听访问类型变化
	form.on('select(accessType)', function(data){
		if ( data.value == '2' ) {
			$('#priceItem').show();
			$('#accessLevelItem').hide();
		} else if ( data.value == '3' ) {
			$('#priceItem').hide();
			$('#accessLevelItem').show();
		} else {
			$('#priceItem').hide();
			$('#accessLevelItem').hide();
		}
	});
	
	// 上传组件
	upload.render({
		elem: '#uploadArea',
		url: '/admin/attachment/upload',
		accept: 'file',
		drag: true,
		before: function(obj){
			layer.load(1);
		},
		data: function(){
			return {
				allowHotlink: $('input[name="allowHotlink"]').prop('checked') ? '1' : '0',
				accessType: $('select[name="accessType"]').val(),
				accessLevel: $('input[name="accessLevel"]').val() || '0',
				price: $('input[name="price"]').val() || '0'
			};
		},
		done: function(res){
			layer.closeAll('loading');
			var $result = $('#uploadResult');
			if ( res.result ) {
				$result.removeClass('error').addClass('success').html(
					'<strong>上传成功</strong><br>' +
					'文件名：' + res.data.filename + '<br>' +
					'大小：' + formatSize(res.data.size)
				).show();
				// 刷新父窗口列表
				if ( parent.layui && parent.layui.table ) {
					parent.layui.table.reloadData('Table_Attachment_List');
				}
			} else {
				$result.removeClass('success').addClass('error').html(
					'<strong>上传失败</strong><br>' + (res.message || '未知错误')
				).show();
			}
		},
		error: function(){
			layer.closeAll('loading');
			$('#uploadResult').removeClass('success').addClass('error').html(
				'<strong>上传失败</strong><br>网络错误，请重试'
			).show();
		}
	});
	
	// 格式化文件大小
	function formatSize(size)
	{
		if ( size >= 1073741824 ) {
			return (size / 1073741824).toFixed(2) + ' GB';
		} else if ( size >= 1048576 ) {
			return (size / 1048576).toFixed(2) + ' MB';
		} else if ( size >= 1024 ) {
			return (size / 1024).toFixed(2) + ' KB';
		} else {
			return size + ' B';
		}
	}
});
</script>
</body>
</html>
