<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Auth_User" lay-filter="Table_Auth_User"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Auth_User">
	<div class="layui-inline">
		<input type="text" id="searchAuthUser" placeholder="搜索用户名..." class="layui-input" style="width: 240px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Auth_User_Search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Auth_User_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm" lay-event="Auth_User_Add"><i class="layui-icon layui-icon-addition"></i> 添加用户</button>
	</div>
</script>

<!-- 操作列 -->
<script type="text/html" id="Tool_Auth_User">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-bg-cyan" lay-event="resetPwd">重置密码</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<!-- 页面逻辑处理 -->
<script>
	// SHA-256 哈希函数（使用 Web Crypto API）
	async function sha256(message) {
		const msgBuffer = new TextEncoder().encode(message);
		const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
		const hashArray = Array.from(new Uint8Array(hashBuffer));
		const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
		return hashHex;
	}
	
	layui.use(['table'], function(){
		var table = layui.table;
		var layer = layui.layer;
		var $ = layui.$;
		
		// 创建渲染实例
		table.render({
			elem: '#Table_Auth_User',
			toolbar: '#Toolbar_Auth_User',
			url: '/auth/user',
			defaultToolbar: ['filter', 'exports', 'print'],
			height: 'full-135',			// 最大高度减去其他容器已占有的高度差
			css: "",					// 重设当前表格样式
			cellMinWidth: 60,			// 最小列宽度
			skin: "line",				// 表格样式
			totalRow: false,			// 开启合计行
			page: {
				limit: 20,				// 每页显示数量
				groups: 11,				// 显示分页数量
				layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
			},
			cols: [[
				{field:'id', width:80, title: 'ID'},
				{title: '用户名', templet: '<code>{{= d.user }}</code>'},
				{width:160, title: '所属角色', templet: '<span class="layui-badge auth-color-{{= d.role }}">{{= d.roleName || "未分配" }}</span>'},
				{field:'createTime', width:180, title: '创建时间'},
				{field:'updateTime', width:180, title: '修改时间'},
				{width:200, title: '操作', templet: '#Tool_Auth_User'},
			]],
			done: function(){
			},
			error: function(res, msg){
				console.log(res, msg)
			}
		});
		
		// 工具栏事件
		table.on('toolbar(Table_Auth_User)', function(obj){
			switch ( obj.event ) {
				case 'Auth_User_Search':
					// 搜索
					table.reloadData('Table_Auth_User', {
						where: {
							search: "%" + document.getElementById('searchAuthUser').value + "%",
						},
					});
				break;
				case 'Auth_User_Refresh':
					// 刷新
					table.reloadData('Table_Auth_User');
				break;
				case 'Auth_User_Add':
					// 添加用户
					var layerIndex = layer.open({
						title: '添加用户',
						type: 2,
						shadeClose: true,
						area: ['500px', '460px'],
						content: '/view/auth/user/add',
					});
				break;
			};
		});
		
		// 触发单元格工具事件
		table.on('tool(Table_Auth_User)', function(obj){
			var data = obj.data; // 获得当前行数据
			if ( obj.event == 'edit' ) {
				// 编辑
				var layerIndex = layer.open({
					title: '编辑用户',
					type: 2,
					shadeClose: true,
					area: ['500px', '460px'],
					content: '/view/auth/user/edit?id=' + data.id,
				});
			} else if ( obj.event == 'resetPwd' ) {
				// 重置密码
				layer.prompt({
					formType: 1,
					title: '重置密码 - ' + data.user,
					area: ['400px', '200px']
				}, async function(newPassword, promptIndex) {
					if (!newPassword || newPassword.trim() === '') {
						layer.msg('密码不能为空', {icon: 2});
						return;
					}
					
					// 计算密码的 SHA-256 哈希值（客户端加盐：用户名 + "_xywhsoft_" + 密码）
					const pwdHash = await sha256(data.user + '_xywhsoft_' + newPassword);
					
					// 发送请求重置密码（传输哈希值而非明文）
					fetch('/auth/user/repwd', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify({
							id: data.id,
							username: data.user,
							password: pwdHash
						})
					})
					.then(response => response.json())
					.then(result => {
						if (result && result.result === true) {
							layer.msg(result.message || '密码重置成功', {icon: 1});
							table.reloadData('Table_Auth_User');
							layer.close(promptIndex);
						} else {
							layer.msg(result.message || '重置失败', {icon: 2});
						}
					})
					.catch(error => {
						layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
						console.error('Error:', error);
					});
				});
			} else if ( obj.event == 'delete' ) {
				// 删除
				layer.confirm('确定要删除用户 "' + data.user + '" 吗？', {
					icon: 3,
					title: '删除确认'
				}, function(index){
					// 确认删除
					fetch('/auth/user?id=' + data.id, {
						method: 'DELETE',
						headers: {
							'Content-Type': 'application/json'
						}
					})
					.then(response => response.json())
					.then(result => {
						if (result && result.result === true) {
							layer.msg(result.message || '删除成功', {icon: 1});
							// 重新加载表格
							table.reloadData('Table_Auth_User');
						} else {
							layer.msg(result.message || '删除失败', {icon: 2});
						}
					})
					.catch(error => {
						layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
						console.error('Error:', error);
					});
					
					layer.close(index);
				});
			}
		});
	
	});

</script>
