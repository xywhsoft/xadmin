<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>编辑权限分类</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px; min-height: calc(100vh - 40px); display: flex; flex-direction: column;">
		<input type="hidden" name="id" value="{$id}">
		<div class="layui-form-item">
			<label class="layui-form-label">分类名称</label>
			<div class="layui-input-block">
				<input type="text" name="name" value="{$name}" required lay-verify="required" placeholder="请输入分类名称" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item layui-form-text">
			<label class="layui-form-label">描述</label>
			<div class="layui-input-block">
				<textarea name="desc" placeholder="请输入描述" class="layui-textarea" style="height: 80px;">{$desc}</textarea>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">排序</label>
			<div class="layui-input-block">
				<input type="number" name="sort" value="{$sort}" placeholder="请输入排序值" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div style="flex: 1;"></div>
		<div class="layui-form-item" style="text-align: right; margin-bottom: 0;">
			<button class="layui-btn" lay-submit lay-filter="submit">保存</button>
			<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		layui.use('form', function(){{
			var form = layui.form;
			var layer = layui.layer;
			form.render();
			
			document.getElementById('btnCancel').onclick = function(){{
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			form.on('submit(submit)', function(data){{
				var field = data.field;
				var submitData = {{
					id: parseInt(field.id),
					name: field.name,
					desc: field.desc || '',
					sort: parseInt(field.sort) || 0
				};
				
				fetch('/admin/member/authgroup', {{
					method: 'PUT',
					headers: {{ 'Content-Type': 'application/json' },
					body: JSON.stringify(submitData),
				})
				.then(response => response.json())
				.then(data => {{
					if ( data.result ) {{
						layer.msg(data.message, {{icon: 1});
						parent.layui.table.reloadData('Table_Member_AuthGroup');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {{
						layer.msg('请求服务报错：' + data.message, {{icon: 2});
					}
				})
				.catch(error => {{
					layer.msg('请求出错', {{icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
