<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>New Task</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px;" lay-filter="taskForm">
		<input type="hidden" id="serviceId" value="{$serviceId}">
		<div class="layui-form-item">
			<label class="layui-form-label">Task Name</label>
			<div class="layui-input-block">
				<input type="text" name="name" required lay-verify="required" placeholder="Task name" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">Description</label>
			<div class="layui-input-block">
				<textarea name="desc" placeholder="Description (optional)" class="layui-textarea" style="height: 80px;"></textarea>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-input-block">
				<button class="layui-btn" lay-submit lay-filter="submitTask">Create</button>
			</div>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			var serviceId = document.getElementById('serviceId').value;
			form.render();
			form.on('submit(submitTask)', function(data){
				var field = data.field;
				fetch('/admin/api/plugin/xlogserver/tasks?serviceId=' + serviceId, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(field),
				})
				.then(response => response.json())
				.then(data => {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
						parent.layui.table.reloadData('Table_Tasks');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg(data.message, {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('Request error', {icon: 2});
					console.error('Error:', error);
				});
				return false;
			});
		});
	</script>
</body>
</html>
