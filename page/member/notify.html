<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Member_Notify" lay-filter="Table_Member_Notify"></table>
</div>

<script type="text/html" id="Toolbar_Member_Notify">
	<div class="layui-inline">
		<input type="text" id="Search_Member_Notify" placeholder="搜索标题或内容..." class="layui-input" style="width: 240px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm" lay-event="send"><i class="layui-icon layui-icon-addition"></i> 发送站内信</button>
	</div>
</script>

<script>
layui.use(['table', 'layer'], function(){
	var table = layui.table;
	var layer = layui.layer;

	function reloadTable(searchText){
		table.reloadData('Table_Member_Notify', {
			where: {
				search: searchText ? ('%' + searchText + '%') : ''
			}
		});
	}

	table.render({
		elem: '#Table_Member_Notify',
		id: 'Table_Member_Notify',
		toolbar: '#Toolbar_Member_Notify',
		url: '/admin/member/notify',
		defaultToolbar: ['filter', 'exports', 'print'],
		height: 'full-135',
		skin: 'line',
		cellMinWidth: 100,
		page: {
			limit: 20,
			groups: 11,
			layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip']
		},
		cols: [[
			{field:'id', width:80, title:'ID'},
			{field:'title', minWidth:240, title:'标题'},
			{field:'type', width:110, title:'类型'},
			{field:'sendType', width:120, title:'发送范围'},
			{field:'recipientCount', width:110, title:'收件人数'},
			{field:'createTime', width:180, title:'发送时间'}
		]]
	});

	table.on('toolbar(Table_Member_Notify)', function(obj){
		if ( obj.event === 'search' ) {
			reloadTable(document.getElementById('Search_Member_Notify').value);
			return;
		}
		if ( obj.event === 'refresh' ) {
			reloadTable('');
			return;
		}
		if ( obj.event === 'send' ) {
			layer.open({
				title: '发送站内信',
				type: 2,
				shadeClose: true,
				area: ['720px', '758px'],
				content: '/admin/view/member/notify/send',
				end: function(){
					reloadTable('');
				}
			});
		}
	});
});
</script>
