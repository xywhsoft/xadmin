<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Menu" lay-filter="Table_Menu"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Menu">
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Menu_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm layui-btn-normal" lay-event="Menu_AddCategory"><i class="layui-icon layui-icon-addition"></i> 添加分类</button>
		<button class="layui-btn layui-btn-sm" lay-event="Menu_AddMenu"><i class="layui-icon layui-icon-addition"></i> 添加菜单</button>
	</div>
</script>

<!-- 操作列 -->
<script type="text/html" id="Tool_Menu">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<!-- 类型模板 -->
<script type="text/html" id="typeTpl">
	{{# if(d.type === 0){ }}
		<span class="layui-badge layui-bg-blue"><i class="layui-icon layui-icon-folder"></i> 目录</span>
	{{# } else { }}
		<span class="layui-badge layui-bg-green"><i class="layui-icon layui-icon-file"></i> 菜单</span>
	{{# } }}
</script>

<!-- 状态模板 -->
<script type="text/html" id="statusTpl">
	{{# if(d.visible === 1){ }}
		<span class="layui-badge layui-bg-green">显示</span>
	{{# } else { }}
		<span class="layui-badge layui-bg-gray">隐藏</span>
	{{# } }}
</script>

<script>
layui.use(['table', 'layer', 'treeTable'], function(){
	var table = layui.table;
	var layer = layui.layer;
	var treeTable = layui.treeTable;
	var $ = layui.$;
	
	// 菜单数据
	var arrMenuData = [];
	
	// 将扁平数据转换为树形结构
	function buildTreeData(flatData)
	{
		var tblMap = {};
		var arrTree = [];
		
		// 先创建映射，只给目录类型初始化 children
		for ( var i = 0; i < flatData.length; i++ ) {
			var item = flatData[i];
			if ( item.type === 0 ) {
				item.children = [];
			}
			tblMap[item.id] = item;
		}
		
		// 构建树形结构
		for ( var i = 0; i < flatData.length; i++ ) {
			var item = flatData[i];
			if ( item.parent === 0 ) {
				arrTree.push(item);
			} else {
				var parent = tblMap[item.parent];
				if ( parent && parent.children ) {
					parent.children.push(item);
				} else {
					// 父节点不存在或不是目录，放到根级
					arrTree.push(item);
				}
			}
		}
		
		return arrTree;
	}
	
	// 加载菜单数据
	function loadMenuData()
	{
		var loading = layer.load(2);
		
		fetch('/option/menu')
		.then(response => response.json())
		.then(result => {
			layer.close(loading);
			if ( result.result ) {
				arrMenuData = buildTreeData(result.data || []);
				renderMenuTable();
			} else {
				layer.msg(result.message || '加载失败', {icon: 2});
			}
		})
		.catch(error => {
			layer.close(loading);
			layer.msg('请求失败', {icon: 2});
			console.error('Error:', error);
		});
	}
	
	// 渲染菜单表格
	function renderMenuTable()
	{
		// 使用 treeTable 渲染树形表格
		treeTable.render({
			elem: '#Table_Menu',
			toolbar: '#Toolbar_Menu',
			data: arrMenuData,
			tree: {
				customName: {
					children: 'children',
					name: 'title',
					id: 'id'
				},
				view: {
					showIcon: true,
					indent: 24,
					showFlexIconIfNotParent: false,
					expandAllDefault: true,
					iconFn: function(d){
						// 目录使用文件夹图标，菜单使用文件图标
						if ( d.type === 0 ) {
							return '<i class="layui-icon layui-icon-layer" style="color:#1E9FFF;"></i>';
						} else {
							return '<i class="layui-icon layui-icon-file" style="color:#5FB878;"></i>';
						}
					}
				}
			},
			cols: [[
				{field: 'title', title: '菜单标题', minWidth: 200},
				{field: 'type', title: '类型', width: 80, align: 'center', templet: '#typeTpl'},
				{field: 'sort', title: '排序', width: 80, align: 'center'},
				{field: 'href', title: '链接地址', minWidth: 150, templet: function(d){
					return d.href || '-';
				}},
				{field: 'remark', title: '备注', minWidth: 120, templet: function(d){
					return d.remark || '-';
				}},
				{field: 'visible', title: '状态', width: 80, align: 'center', templet: '#statusTpl'},
				{fixed: 'right', title: '操作', width: 170, align: 'center', toolbar: '#Tool_Menu'}
			]],
			page: false
		});
	}
	
	// 工具栏事件
	treeTable.on('toolbar(Table_Menu)', function(obj){
		switch ( obj.event ) {
			case 'Menu_Refresh':
				// 刷新
				loadMenuData();
			break;
			case 'Menu_AddCategory':
				// 添加分类（顶级目录）
				layer.open({
					title: '添加分类',
					type: 2,
					shadeClose: true,
					area: ['600px', '500px'],
					content: '/view/option/menu/add/category',
					end: function(){
						loadMenuData();
					}
				});
			break;
			case 'Menu_AddMenu':
				// 添加菜单
				layer.open({
					title: '添加菜单',
					type: 2,
					shadeClose: true,
					area: ['600px', '640px'],
					content: '/view/option/menu/add',
					end: function(){
						loadMenuData();
					}
				});
			break;
		};
	});
	
	// 触发单元格工具事件
	treeTable.on('tool(Table_Menu)', function(obj){
		var data = obj.data;
		if ( obj.event == 'edit' ) {
			// 编辑
			var sTitle = (data.type === 0) ? '编辑分类' : '编辑菜单';
			var sArea = (data.type === 0) ? ['600px', '500px'] : ['600px', '640px'];
			layer.open({
				title: sTitle,
				type: 2,
				shadeClose: true,
				area: sArea,
				content: '/view/option/menu/edit?id=' + data.id,
				end: function(){
					loadMenuData();
				}
			});
		} else if ( obj.event == 'delete' ) {
			// 删除
			var sConfirmMsg = '确定要删除菜单 "' + data.title + '" 吗？';
			if ( data.children && data.children.length > 0 ) {
				sConfirmMsg = '【' + data.title + '】包含 ' + data.children.length + ' 个子菜单，确定要删除吗？';
			}
			layer.confirm(sConfirmMsg, {
				icon: 3,
				title: '删除确认'
			}, function(index){
				fetch('/option/menu?id=' + data.id, {
					method: 'DELETE',
					headers: {
						'Content-Type': 'application/json'
					}
				})
				.then(response => response.json())
				.then(result => {
					if ( result.result ) {
						layer.msg(result.message || '删除成功', {icon: 1});
						loadMenuData();
					} else {
						layer.msg(result.message || '删除失败', {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				layer.close(index);
			});
		}
	});
	
	// 初始化加载
	loadMenuData();
});
</script>
