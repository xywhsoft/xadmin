<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>编辑菜单</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="menuEditForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
		<div class="layui-form-item">
			<label class="layui-form-label">上级分类</label>
			<div class="layui-input-block">
				<select name="parent" id="parentSelect">
					<option value="0">无（顶级菜单）</option>
				</select>
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">菜单标题</label>
			<div class="layui-input-block">
				<input type="text" name="title" required lay-verify="required" placeholder="请输入菜单标题" autocomplete="off" class="layui-input">
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">图标</label>
			<div class="layui-input-block">
				<div style="display: flex; width: 100%;">
					<span id="iconPreview" style="flex-shrink: 0; width: 38px; height: 36px; line-height: 36px; text-align: center; border: 1px solid #e6e6e6; border-radius: 4px 0 0 4px; font-size: 18px; border-right: none; background: #fff;"></span>
					<input type="text" name="icon" id="iconInput" placeholder="请选择图标" autocomplete="off" class="layui-input" style="flex: 1; border-radius: 0;" readonly>
					<button type="button" class="layui-btn layui-btn-primary" id="btnSelectIcon" style="flex-shrink: 0; border-radius: 0 4px 4px 0; margin-left: -1px;">选择</button>
				</div>
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">链接地址</label>
			<div class="layui-input-block">
				<input type="text" name="href" placeholder="如：/admin/view/home" autocomplete="off" class="layui-input">
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">打开方式</label>
			<div class="layui-input-block">
				<select name="openType">
					<option value="_component">组件（_component）</option>
					<option value="_iframe">内嵌页面（_iframe）</option>
					<option value="_blank">新窗口（_blank）</option>
				</select>
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">排序值</label>
			<div class="layui-input-block">
				<input type="number" name="sort" value="0" placeholder="数值越小越靠前" autocomplete="off" class="layui-input">
			</div>
		</div>

		<div class="layui-form-item">
			<label class="layui-form-label">是否显示</label>
			<div class="layui-input-block">
				<input type="checkbox" name="visible" lay-skin="switch" lay-text="显示|隐藏">
			</div>
		</div>

		<div class="layui-form-item layui-form-text">
			<label class="layui-form-label">备注</label>
			<div class="layui-input-block">
				<textarea name="remark" placeholder="可选，备注信息" class="layui-textarea"></textarea>
			</div>
		</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submitMenuEdit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script src="/js/icon-picker.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			var $ = layui.$;
			var urlParams = new URLSearchParams(window.location.search);
			var iMenuID = parseInt(urlParams.get('id')) || 0;

			function updateIconPreview(sIcon)
			{
				$('#iconPreview').html(sIcon ? ('<i class="' + sIcon + '"></i>') : '');
			}

			function loadMenuInfo()
			{
				if ( iMenuID <= 0 ) {
					layer.msg('菜单ID无效', {icon: 2});
					return;
				}

				fetch('/admin/option/menu')
				.then(response => response.json())
				.then(result => {
					var arrData = (result && result.data) ? result.data : [];
					var item = null;
					var sOptions = '';
					var i = 0;

					if ( !result.result ) {
						layer.msg(result.message || '加载失败', {icon: 2});
						return;
					}

					for ( i = 0; i < arrData.length; i++ ) {
						if ( arrData[i].id === iMenuID ) {
							item = arrData[i];
						}
					}
					if ( !item ) {
						layer.msg('菜单不存在或已删除', {icon: 2});
						return;
					}

					sOptions = '<option value="0"' + ((item.parent || 0) === 0 ? ' selected' : '') + '>无（顶级菜单）</option>';
					for ( i = 0; i < arrData.length; i++ ) {
						if ( arrData[i].type !== 0 || arrData[i].id === iMenuID ) {
							continue;
						}
						sOptions += '<option value="' + arrData[i].id + '"' + (item.parent === arrData[i].id ? ' selected' : '') + '>' + arrData[i].title + '</option>';
					}

					$('#parentSelect').html(sOptions);
					form.val('menuEditForm', {
						parent: String(item.parent || 0),
						title: item.title || '',
						icon: item.icon || '',
						href: item.href || '',
						openType: item.openType || '_component',
						sort: item.sort || 0,
						remark: item.remark || ''
					});
					$('input[name="visible"]').prop('checked', item.visible === 1);
					updateIconPreview(item.icon || '');
					form.render();
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
			}

			form.render();
			loadMenuInfo();

			$('#btnSelectIcon').on('click', function(){
				IconPicker.open(this, function(sIcon){
					$('#iconInput').val(sIcon);
					updateIconPreview(sIcon);
				});
			});

			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};

			form.on('submit(submitMenuEdit)', function(data){
				var field = data.field;

				fetch('/admin/option/menu', {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify({
						id: iMenuID,
						parent: parseInt(field.parent) || 0,
						title: field.title,
						icon: field.icon || '',
						type: 1,
						href: field.href || '',
						openType: field.openType || '_component',
						sort: parseInt(field.sort) || 0,
						visible: field.visible === 'on' ? 1 : 0,
						remark: field.remark || ''
					})
				})
				.then(response => response.json())
				.then(result => {
					if ( result.result ) {
						layer.msg(result.message || '更新成功', {icon: 1});
						parent.layer.close(parent.layer.getFrameIndex(window.name));
					} else {
						layer.msg(result.message || '更新失败', {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});

				return false;
			});
		});
	</script>
</body>
</html>
