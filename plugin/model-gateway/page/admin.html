<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型网关</title><link rel="stylesheet" href="/plugin-static/billing/ui.css"><link rel="stylesheet" href="/plugin-static/model-gateway/ui.css"></head>
<body data-page="admin"><header><h1>模型网关</h1><p>配置上游渠道、在线模型和报价；查看实际用量与费用。</p></header>
<div id="message" role="status" aria-live="polite"></div><div class="toolbar"><button id="refresh" type="button">刷新</button><a href="/admin/billing">账户与计费</a><a href="/account/models" target="_blank" rel="noopener">用户模型页面</a></div>
<nav aria-label="管理分类"><button type="button" data-tab="models">模型</button><button type="button" data-tab="channels">渠道与密钥</button><button type="button" data-tab="usage">请求与用量</button></nav>
<section data-panel="models"><div id="model-list"></div><form id="model"><h2 id="model-heading">创建模型</h2><div class="field-grid">
<label>模型标识<input name="id" required maxlength="128" pattern="[A-Za-z0-9_.-]+"></label><label>显示名称<input name="title" required maxlength="128"></label>
<label>说明<input name="description" maxlength="512"></label><label>输入上下文上限<input name="context_window" type="number" min="64" max="2000000" value="32768" required></label><label>最大输出 token<input name="max_output" type="number" min="1" value="8192" required></label>
<label>默认协议<select name="default_protocol"><option value="chat">Chat Completions</option><option value="responses">Responses</option><option value="anthropic">Anthropic Messages</option></select></label>
<label>Chat 输出上限字段<select name="output_limit_field"><option>max_tokens</option><option>max_completion_tokens</option></select></label><label>思考强度（逗号分隔；留空关闭）<input name="reasoning_efforts" maxlength="128" placeholder="low,medium,high"></label>
<label class="check"><input name="enabled" type="checkbox" checked>允许调用</label><label class="check"><input name="member_only" type="checkbox">仅相应会员可用</label><label class="check"><input name="tool_calling" type="checkbox" checked>函数工具</label><label class="check"><input name="vision" type="checkbox">图片输入</label></div>
<h3>售价（元 / 百万 token）</h3><div id="sale-rates" class="field-grid rates"></div><p class="hint">全部填 0 表示免费。先按上下文与输出上限预留最高费用，实际用量确认后只扣实际消费。</p>
<label class="check"><input name="cost_known" type="checkbox">记录供应商成本</label><div id="cost-rates" class="field-grid rates" hidden></div>
<h3>协议路由</h3><div id="routes"></div><button id="add-route" type="button">添加路由</button><p class="hint">优先级越小越优先。仅选择相同协议的渠道；上游请求发出后不会自动重发。每个渠道可覆盖成本报价。</p>
<div class="toolbar"><button>保存模型与报价</button><button id="new-model" type="button">清空，创建新模型</button></div></form></section>
<section data-panel="channels" hidden><div id="channel-list"></div><div class="forms"><form id="channel"><h2>创建或修改渠道</h2><label>渠道标识<input name="id" maxlength="64" pattern="[A-Za-z0-9_.-]+" required></label><label>名称<input name="title" maxlength="128" required></label><label>提供方标识<input name="provider" maxlength="64" pattern="[A-Za-z0-9_.-]+" required></label><label>协议<select name="protocol"><option value="chat">Chat Completions</option><option value="responses">Responses</option><option value="anthropic">Anthropic Messages</option></select></label><label>完整请求 URL<input name="url" type="url" maxlength="2048" required placeholder="https://provider.example/v1/chat/completions"></label>
<label>认证方式<select name="auth"><option value="bearer">Bearer</option><option value="x-api-key">x-api-key</option><option value="api-key">api-key</option><option value="none">无需认证</option></select></label><label>Anthropic API 版本<input name="anthropic_version" value="2023-06-01" maxlength="32" required></label><label>总超时（毫秒）<input name="timeout_ms" type="number" min="1000" max="600000" value="120000" required></label><label>首个响应超时（毫秒）<input name="first_byte_ms" type="number" min="1000" max="600000" value="60000" required></label><label>空闲超时（毫秒）<input name="idle_ms" type="number" min="1000" max="600000" value="30000" required></label><label>同时请求上限<input name="max_concurrent" type="number" min="1" max="16" value="4" required></label><label class="check"><input name="enabled" type="checkbox" checked>启用</label><label class="check"><input name="allow_http" type="checkbox">允许明文 HTTP（仅可信上游）</label><div class="toolbar"><button>保存渠道</button><button id="new-channel" type="button">新建</button></div></form>
<form id="credentials"><h2>更新上游密钥</h2><label>渠道<select name="channel_id" required></select></label><label>新密钥<input name="api_key" type="password" maxlength="1000" autocomplete="new-password"></label><p class="hint">留空保存会清除文件中的密钥。密钥只保存在站点私有目录，不会回显；环境变量优先。</p><label class="check" id="repair-label" hidden><input name="replace_invalid" type="checkbox">明确重置已损坏的密钥文件（会移除文件内其他密钥）</label><button>更新密钥</button></form></div></section>
<section data-panel="usage" hidden><div id="limits" class="cards"></div><h2>最近 100 次请求</h2><div id="request-list"></div><p class="hint">未核实用量显示未知，不能视为免费；前往「账户与计费 → 请求结算」核实或退款。上游成本仅后台可见。这里不保存对话内容。</p></section>
<script src="/plugin-static/model-gateway/ui.js" defer></script></body></html>
