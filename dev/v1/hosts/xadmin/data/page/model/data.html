<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>模型数据管理</title>
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
<!-- 主体表格 -->
<div style="padding: 16px;">
	<table class="layui-hide" id="Table_Model_Data" lay-filter="Table_Model_Data"></table>
</div>

<!-- 表格工具栏 -->
<script type="text/html" id="Toolbar_Model_Data">
	<div class="layui-inline">
		<input type="text" id="searchKeyword" placeholder="搜索..." class="layui-input" style="width: 200px; height: 32px; margin-right: 10px;">
	</div>
	<div class="layui-inline">
		<button class="layui-btn layui-btn-sm" lay-event="Model_Search"><i class="layui-icon layui-icon-search"></i> 搜索</button>
		<button class="layui-btn layui-btn-sm layui-btn-primary" lay-event="Model_Refresh"><i class="layui-icon layui-icon-refresh"></i> 刷新</button>
	</div>
	<div class="layui-inline" style="float: right;">
		<button class="layui-btn layui-btn-sm layui-btn-warm" lay-event="Model_Draft" style="position: relative;">
			<i class="layui-icon layui-icon-file"></i> 草稿箱
			<span id="draftBadge" class="layui-badge" style="position: absolute; top: -8px; right: -8px; display: none;">0</span>
		</button>
		<button class="layui-btn layui-btn-sm" lay-event="Model_Add"><i class="layui-icon layui-icon-addition"></i> 添加</button>
	</div>
</script>

<!-- 操作列模板 -->
<script type="text/html" id="Tool_Model_Data">
	<div class="layui-clear-space">
		<a class="layui-btn layui-btn-xs layui-bg-blue" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-xs layui-bg-orange" lay-event="delete">删除</a>
	</div>
</script>

<script src="/layui/layui.js"></script>
<script>
layui.use(['table'], function(){
	var table = layui.table;
	var layer = layui.layer;
	var $ = layui.$;
	
	// 从 URL 路径解析模型信息
	var sPath = window.location.pathname;
	var G_DraftCount = 0;  // 草稿箱数量
	
	// 使用正则表达式匹配路径
	var arrMatch = sPath.match(/\/admin\/view\/model\/data\/([^\/]+)\/([^\/]+)/);
	var sNamespace = '';
	var sModelName = '';
	
	if ( arrMatch && arrMatch.length >= 3 ) {
		sNamespace = arrMatch[1];
		sModelName = arrMatch[2];
	} else {
		// 回退方案：从路径的最后两段获取
		var arrParts = sPath.split('/').filter(function(s) { return s.length > 0; });
		if ( arrParts.length >= 2 ) {
			sModelName = arrParts[arrParts.length - 1];
			sNamespace = arrParts[arrParts.length - 2];
			// 确保不是固定路径段
			if ( sNamespace === 'data' || sNamespace === 'model' ) {
				sNamespace = '';
			}
		}
	}
	
	// 构建 API 路径前缀
	var sApiPrefix = sNamespace ? ('/admin/' + sNamespace + '/' + sModelName) : ('/admin/' + sModelName);
	
	// 获取模型配置
	fetch('/admin/model/get?name=' + sModelName)
	.then(function(response){ return response.json(); })
	.then(function(result){
		if ( !result || !result.result ) {
			layer.msg('获取模型配置失败', {icon: 2});
			return;
		}
		
		var tblModel = result.data;
		
		// 获取字段配置
		fetch('/admin/model/fields?name=' + sModelName)
		.then(function(response){ return response.json(); })
		.then(function(fieldsResult){
			if ( !fieldsResult || !fieldsResult.result ) {
				layer.msg('获取字段配置失败', {icon: 2});
				return;
			}
			
			var arrFields = fieldsResult.data || [];
			
			// 构建表格列配置
			var arrCols = [
				{field:'id', width:80, title: 'ID', sort: true}
			];
			
			// 根据字段配置添加列
			for ( var i = 0; i < arrFields.length; i++ ) {
				var tblField = arrFields[i];
				var tblCol = {
					field: tblField.name,
					title: tblField.title || tblField.name
				};
				
				// 根据字段配置设置列宽
				if ( tblField.listWidth ) {
					tblCol.width = tblField.listWidth;
				}
				
				// 根据字段类型设置模板
				if ( tblField.type === 'image' ) {
					tblCol.templet = '<img src="{{= d.' + tblField.name + ' }}" style="max-width:60px;max-height:40px;">';
				} else if ( tblField.type === 'switch' ) {
					tblCol.templet = '{{# if(d.' + tblField.name + '){ }}<span class="layui-badge layui-bg-green">是</span>{{# } else { }}<span class="layui-badge layui-bg-gray">否</span>{{# } }}';
				}
				
				// 只显示配置为在列表中显示的字段
				if ( tblField.showInList !== false ) {
					arrCols.push(tblCol);
				}
			}
			
			// 添加时间列
			arrCols.push({field:'createTime', width:180, title: '创建时间'});
			arrCols.push({field:'updateTime', width:180, title: '修改时间'});
			
			// 添加操作列
			arrCols.push({width:140, title: '操作', toolbar: '#Tool_Model_Data'});
			
			// 创建渲染实例
			table.render({
				elem: '#Table_Model_Data',
				toolbar: '#Toolbar_Model_Data',
				url: sApiPrefix + '/list',
				defaultToolbar: ['filter', 'exports', 'print'],
				height: 'full-80',
				cellMinWidth: 60,
				skin: "line",
				page: {
					limit: 20,
					groups: 11,
					layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
				},
				cols: [arrCols],
				done: function(){
					// 加载草稿箱数量
					loadDraftCount();
				},
				error: function(res, msg){
					console.log(res, msg);
				}
			});
			
			// 工具栏事件
			table.on('toolbar(Table_Model_Data)', function(obj){
				switch ( obj.event ) {
					case 'Model_Search':
						table.reloadData('Table_Model_Data', {
							where: {
								search: document.getElementById('searchKeyword').value,
							},
						});
					break;
					case 'Model_Refresh':
						table.reloadData('Table_Model_Data');
					break;
					case 'Model_Add':
						var sAddUrl = sNamespace ? 
							('/admin/view/model/data/' + sNamespace + '/' + sModelName + '/add') :
							('/admin/view/model/data/' + sModelName + '/add');
						var layerIndex = layer.open({
							title: '添加' + (tblModel.title || sModelName),
							type: 2,
							shadeClose: false,
							area: ['700px', '600px'],
							content: sAddUrl,
						});
					break;
					case 'Model_Draft':
						var sDraftUrl = sNamespace ? 
							('/admin/view/model/data/' + sNamespace + '/' + sModelName + '/draft') :
							('/admin/view/model/data/' + sModelName + '/draft');
						var layerIndex = layer.open({
							title: '草稿箱 - ' + (tblModel.title || sModelName),
							type: 2,
							shadeClose: false,
							area: ['900px', '600px'],
							content: sDraftUrl,
							end: function(){
								// 关闭草稿箱后刷新列表和草稿数量
								table.reloadData('Table_Model_Data');
								loadDraftCount();
							}
						});
					break;
				};
			});
			
			// 触发单元格工具事件
			table.on('tool(Table_Model_Data)', function(obj){
				var data = obj.data;
				if ( obj.event == 'edit' ) {
					var sEditUrl = sNamespace ? 
						('/admin/view/model/data/' + sNamespace + '/' + sModelName + '/edit?id=' + data.id) :
						('/admin/view/model/data/' + sModelName + '/edit?id=' + data.id);
					var layerIndex = layer.open({
						title: '编辑' + (tblModel.title || sModelName),
						type: 2,
						shadeClose: false,
						area: ['700px', '600px'],
						content: sEditUrl,
					});
				} else if ( obj.event == 'delete' ) {
					layer.confirm('确定要删除这条记录吗？', {
						icon: 3,
						title: '删除确认'
					}, function(index){
						fetch(sApiPrefix + '/delete?id=' + data.id, {
							method: 'DELETE'
						})
						.then(function(response){ return response.json(); })
						.then(function(result){
							if ( result && result.result === true ) {
								layer.msg(result.message || '删除成功', {icon: 1});
								table.reloadData('Table_Model_Data');
							} else {
								layer.msg(result.message || '删除失败', {icon: 2});
							}
						})
						.catch(function(error){
							layer.msg('请求出错', {icon: 2});
							console.error('Error:', error);
						});
						layer.close(index);
					});
				}
			});
			
		});
	})
	.catch(function(error){
		layer.msg('获取模型配置出错', {icon: 2});
		console.error('Error:', error);
	});
	
	// 加载草稿箱数量
	function loadDraftCount()
	{
		var sCountUrl = sNamespace ? 
			('/admin/' + sNamespace + '/' + sModelName + '/draft/count') :
			('/admin/' + sModelName + '/draft/count');
		fetch(sCountUrl)
		.then(function(response){ return response.json(); })
		.then(function(result){
			if ( result && result.result ) {
				G_DraftCount = result.count || 0;
				updateDraftBadge();
			}
		})
		.catch(function(error){
			console.error('Error loading draft count:', error);
		});
	}
	
	// 更新草稿箱徽章
	function updateDraftBadge()
	{
		var badge = document.getElementById('draftBadge');
		if ( !badge ) return;
		
		if ( G_DraftCount > 0 ) {
			badge.style.display = 'inline-block';
			badge.textContent = G_DraftCount > 99 ? '99+' : G_DraftCount;
		} else {
			badge.style.display = 'none';
		}
	}
	
});
</script>
</body>
</html>
