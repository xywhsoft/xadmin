<!DOCTYPE html>
<html>
	<head>
		<title>后台管理系统</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
		<link rel="stylesheet" href="/pear/css/pear.css" />
		<link rel="stylesheet" href="/css/admin.css" />
		<link rel="stylesheet" href="/css/admin.dark.css" />
		<link rel="stylesheet" href="/css/variables.css" />
		<link rel="stylesheet" href="/css/reset.css" />
	</head>
	<!-- 结 构 代 码 -->
	<body class="layui-layout-body pear-admin">
		<!-- 布 局 框 架 -->
		<div class="layui-layout layui-layout-admin">
			<!-- 顶 部 样 式 -->
			<div class="layui-header">
				<!-- 菜 单 顶 部 -->
				<div class="layui-logo">
					<!-- 图 标 -->
					<img class="logo">
					<!-- 标 题 -->
					<span class="title">xAdmin</span>
				</div>
				<!-- 顶 部 左 侧 功 能 -->
				<ul class="layui-nav layui-layout-left">
					<li class="collapse layui-nav-item"><a href="#" class="layui-icon layui-icon-shrink-right"></a></li>
					<li class="refresh layui-nav-item"><a href="#" class="layui-icon layui-icon-refresh-1" loading = 600></a></li>
				</ul>
				<!-- 多 系 统 菜 单 -->
				<div id="control" class="layui-layout-control"></div>
				<!-- 顶 部 右 侧 菜 单 -->
				<ul class="layui-nav layui-layout-right">
					<li class="layui-nav-item layui-hide-xs"><a href="#" class="menuSearch layui-icon layui-icon-search"></a></li>
					<li class="layui-nav-item layui-hide-xs"><a href="#" class="fullScreen layui-icon layui-icon-screen-full"></a></li>
					<li class="layui-nav-item user">
						<!-- 头 像 -->
						<a class="layui-icon layui-icon-username" href="javascript:;"></a>
						<!-- 功 能 菜 单 -->
						<dl class="layui-nav-child">
							<dd><a id="adminMfaSettings" href="/admin/view/auth/mfa">账户安全 / 两步验证</a></dd>
							<dd><a href="javascript:void(0);" class="logout">注销登录</a></dd>
						</dl>
					</li>
					<!-- 主 题 配 置 -->
					<li class="layui-nav-item setting"><a href="#" class="layui-icon layui-icon-more-vertical"></a></li>
				</ul>
			</div>
			<!-- 侧 边 区 域 -->
			<div class="layui-side layui-bg-black">
				<!-- 菜 单 顶 部 -->
				<div class="layui-logo">
					<!-- 图 标 -->
					<img class="logo">
					<!-- 标 题 -->
					<span class="title">xAdmin</span>
				</div>
				<!-- 菜 单 内 容 -->
				<div class="layui-side-scroll">
					<div id="side"></div>
				</div>
			</div>
			<!-- 视 图 页 面 -->
			<div class="layui-body">
				<!-- 内 容 页 面 -->
				<div id="content"></div>
			</div>
			<!-- 页脚 -->
			<div class="layui-footer layui-text"></div>
			<!-- 遮 盖 层 -->
			<div class="pear-cover"></div>
			<!-- 加 载 动 画 -->
			<div class="loader-wrapper">
				<!-- 动 画 对 象 -->
				<div class="loader"></div>
			</div>
		</div>
		<!-- 移 动 端 便 捷 操 作 -->
		<div class="pear-collapsed-pe collapse">
			<a href="#" class="layui-icon layui-icon-shrink-right"></a>
		</div>
		<!-- 依 赖 脚 本 -->
		<script src="/layui/layui.js"></script>
		<script src="/pear/pear.js"></script>
		<!-- 框 架 初 始 化 -->
		<script>
			layui.use(['admin','jquery','popup','layer'], function() {
				var admin = layui.admin;
				var popup = layui.popup;
				var $ = layui.jquery;
				var layer = layui.layer;
				var sAdminTitle = document.title;

				function applyAdminBranding(title) {
					var sTitle = title || 'xAdmin';
					sAdminTitle = sTitle;
					document.title = sTitle;
				}

				function loadAdminBranding() {
					return fetch('/brand/admin?_=' + Date.now(), {
						cache: 'no-store'
					})
					.then(function(response){ return response.json(); })
					.then(function(result){
						if ( result && result.result && result.data && result.data.adminTitle ) {
							applyAdminBranding(result.data.adminTitle);
						}
					})
					.catch(function(error){
						console.error('load admin brand failed:', error);
					});
				}
				
				// yml | json | api
				admin.setConfigurationPath("data/pear.config.json");
				
				loadAdminBranding().finally(function(){
					// 渲染
					admin.render();
					setTimeout(function(){
						applyAdminBranding(sAdminTitle);
					}, 0);
				});
				
				// 刷新左侧菜单（供子窗口调用）
				window.refreshMenu = function() {
					location.reload();
				};
				 
				var mfaSettingsLayer = null;
				document.getElementById('adminMfaSettings').addEventListener('click', function(event) {
					event.preventDefault();
					if (mfaSettingsLayer !== null) return;
					mfaSettingsLayer = layer.open({
						type: 2,
						title: '账户安全 / 两步验证',
						content: '/admin/view/auth/mfa',
						area: [Math.min(760, window.innerWidth - 32) + 'px', Math.min(720, window.innerHeight - 32) + 'px'],
						maxmin: true,
						shadeClose: false,
						end: function() {mfaSettingsLayer = null;}
					});
				});

				// 注销
				admin.logout(function(){
					var __f = document.createElement('form'); __f.method = 'POST'; __f.action = '/admin/logout'; document.body.appendChild(__f); __f.submit();
					return new Promise((resolve) => {
						resolve(true)
					});
				});
			})
		</script>		
	</body>
</html>
