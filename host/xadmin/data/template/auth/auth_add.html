<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加权限组</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="AuthAddForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
			<div class="layui-form-item">
				<label class="layui-form-label">权限分类</label>
				<div class="layui-input-block">
					<select name="groupID" lay-verify="required">
						{*GroupComboListItem:groupList}
					</select>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">分组名称</label>
				<div class="layui-input-block">
					<input type="text" name="name" value="" required lay-verify="required" placeholder="分组名称" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">描述</label>
				<div class="layui-input-block">
					<input type="text" name="desc" value="" placeholder="请输入权限组描述" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">排序值</label>
				<div class="layui-input-block">
					<input type="number" name="sort" value="0" placeholder="请输入排序值（数值越小排在前面）" autocomplete="off" class="layui-input">
				</div>
			</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			
			// 渲染表单
			form.render();
			form.val('AuthAddForm', {
				"groupID": 1
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submit)', function(data){
				var field = data.field; // 获取表单字段值
				
				// 提交请求
				fetch('/admin/auth/auth', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(field),
				})
				.then(function(response) { return response.json(); })
				.then(function(data) {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
						// 刷新父窗口列表
						parent.layui.table.reloadData('Table_Auth_Auth');
						// 关闭当前弹窗
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(function(error) {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				
				// 阻止默认 form 跳转
				return false;
			});
		});
	</script>
</body>
</html>
{#define:GroupComboListItem}<option value={$id}>{$name}</option>{#end}
