<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>后台登录</title>
	<link rel="stylesheet" href="/pear/css/pear.css" />
	<link rel="stylesheet" href="/css/other/login.css" />
	<link rel="stylesheet" href="/css/variables.css" />
	<script>if (window.self != window.top) { top.location.reload();}</script>
</head>

<body>
	<div class="login-page" style="background-image: url(/img/background.svg)">
		<div class="layui-row">
			<div class="layui-col-sm6 login-bg layui-hide-xs">
				<img class="login-bg-img" src="/img/banner.png" alt="" />
			</div>
			<div class="layui-col-sm6 layui-col-xs12 login-form">
				<div class="layui-form">
					<div class="form-center">
						<div class="form-center-box">
							<div class="top-log-title">
								<img class="top-log" src="/img/logo.png" alt="" />
								<span id="adminBrandTitle">xAdmin</span>
							</div>
							<div class="top-desc" id="adminBrandDesc">
								通 用 的 网 站 后 台 管 理 系 统
							</div>
		
							<!-- 表单区域 -->
							<form class="layui-form" action="#" lay-filter="install-form" onsubmit="return false;">
								<div style="margin-top: 30px;">
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-username"></i>
											</div>
											<input name="username" placeholder="账户" lay-verify="required" autocomplete="off" class="layui-input">
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-password"></i>
											</div>
											<input type="password" name="password" placeholder="密码" lay-verify="required|confirmPassword" autocomplete="off" class="layui-input" lay-affix="eye">
										</div>
									</div>
									<div class="layui-form-item">
										<div class="remember-passsword">
											<div class="remember-cehcked">
												<input type="checkbox" name="remember" lay-skin="primary" title="记住登录状态">
											</div>
										</div>
									</div>
									<div id="mfaLogin" hidden><p>请输入验证器验证码或未使用的恢复码。</p><input name="mfaCode" class="layui-input" maxlength="40" autocomplete="one-time-code" placeholder="验证码或恢复码"><button id="mfaRestart" type="button" class="layui-btn layui-btn-primary">返回密码登录</button></div>
                            <div class="login-btn">
										<button id="loginBtn" class="layui-btn login" lay-submit lay-filter="login">登 录</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- 资 源 引 入 -->
	<script src="/layui/layui.js"></script>
	<script src="/pear/pear.js"></script>
	<script>
		// SHA-256 哈希函数（使用 Web Crypto API）
		async function sha256(message) {
			if (!window.crypto || !window.crypto.subtle) {
				throw new Error('当前环境无法计算密码哈希，请使用 HTTPS 或 localhost 访问后台');
			}
			const msgBuffer = new TextEncoder().encode(message);
			const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
			const hashArray = Array.from(new Uint8Array(hashBuffer));
			const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
			return hashHex;
		}

		function loadAdminBranding() {
			fetch('/brand/admin?_=' + Date.now(), {
				cache: 'no-store'
			})
			.then(function(response){ return response.json(); })
			.then(function(result){
				if ( !result || !result.result || !result.data ) {
					return;
				}
				var adminTitle = result.data.adminTitle || 'xAdmin';
				document.title = adminTitle + ' - 登录';
			})
			.catch(function(error){
				console.error('load admin brand failed:', error);
			});
		}
		
		layui.use(['form', 'button', 'popup'], function () {
			var form = layui.form;
			var button = layui.button;
			var popup = layui.popup;

			loadAdminBranding();


            var mfaChallenge = null;
            function setMFA(challenge) {
                mfaChallenge = challenge;document.getElementById('mfaLogin').hidden = !challenge;
                document.querySelectorAll('input[name="username"],input[name="password"]').forEach(function(input){
                    if (challenge) {input.dataset.mfaVerify = input.getAttribute('lay-verify') || '';input.removeAttribute('lay-verify');}
                    else input.setAttribute('lay-verify',input.dataset.mfaVerify || 'required');
                    input.disabled = !!challenge;
                });
                var code = document.querySelector('input[name="mfaCode"]');code.value = '';
                if (challenge) {code.setAttribute('lay-verify','required');code.focus();} else code.removeAttribute('lay-verify');
                document.getElementById('loginBtn').textContent = challenge ? '完成两步验证' : '登 录';
                document.querySelector('input[name="password"]').value = '';
            }
            document.getElementById('mfaRestart').addEventListener('click',function(){
                var challenge = mfaChallenge;setMFA(null);
                if (challenge) fetch(window.location.pathname,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({challenge_id:challenge,action:'cancel'})}).catch(function(){});
            });
			// 登 录 提 交
			form.on('submit(login)', function (data) {
				const formData = data.field;
				
				// 禁用按钮
				var btn = document.getElementById('loginBtn');
				if (btn.disabled) return false;
				btn.classList.add('layui-btn-disabled');
				btn.disabled = true;
				
				// 显示加载动画
				var loading = layer.load(2);
				// Layui 需要同步返回 false；异步哈希和请求在内部完成。
				(async function () {
					try {
				
						// 计算密码的 SHA-256 哈希值（客户端加盐：用户名 + "_xywhsoft_" + 密码）
						const payload = mfaChallenge ? {challenge_id:mfaChallenge,code:formData.mfaCode} :
                            {username:formData.username,password:await sha256(formData.username + '_xywhsoft_' + formData.password),remember:formData.remember};
				
						// 发送请求（传输哈希值而非明文）
						const response = await fetch(window.location.pathname, {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json'
							},
							body: JSON.stringify(payload)
						});
						const result = await response.json();
						if ( result.mfa_required ) {setMFA(result.challenge_id);}
                        else if ( result.result ) {
							window.location.href = '/admin';
						} else {
							var mfaErrors = {
                                'MFA challenge invalid or expired': '两步验证已过期，请返回密码登录。',
                                'verification invalid, reused or expired': '验证码无效、已使用或已过期，请使用新验证码或未使用的恢复码。',
                                'too many MFA attempts': '验证尝试过多，请五分钟后再试。',
                                'MFA challenge unavailable; retry later': '两步验证暂时不可用或尝试过多，请稍后再试。'
                            };
                            layer.msg(result.message || mfaErrors[result.msg] || result.msg || '登录失败，请重试', {icon: 2});
						}
					} catch (error) {
						layer.msg(error.message || '登录失败，请重试', {icon: 2});
					} finally {
						btn.classList.remove('layui-btn-disabled');
						btn.disabled = false;
						layer.close(loading);
					}
				})();
				
				// 阻止默认提交（由JS控制）
				return false;
			});
		})
	</script>
</body>

</html>
