<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>余额调整</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="MemberUserBalanceForm" style="height: 100%; display: flex; flex-direction: column;">
	<input type="hidden" name="id" value="{$id}">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
		<div class="layui-form-item">
			<label class="layui-form-label">用户名</label>
			<div class="layui-input-block">
				<input type="text" value="{$username}" class="layui-input" readonly disabled style="background:#f2f2f2;">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">当前余额</label>
			<div class="layui-input-block">
				<input type="text" value="{$balanceYuan} 元" class="layui-input" readonly disabled style="background:#f2f2f2;">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">操作类型</label>
			<div class="layui-input-block">
				<select name="type" lay-verify="required">
					<option value="1">充值 (+)</option>
					<option value="2">扣款 (-)</option>
				</select>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">金额(元)</label>
			<div class="layui-input-block">
				<input type="number" name="amount" step="0.01" min="0.01" placeholder="请输入金额" autocomplete="off" class="layui-input" lay-verify="required|number">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">备注</label>
			<div class="layui-input-block">
				<input type="text" name="remark" placeholder="操作备注（可选）" autocomplete="off" class="layui-input">
			</div>
		</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 确认</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		var iUserId = {$id};
		
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			
			form.render();
			
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			form.on('submit(submit)', function(data){
				var field = data.field;
				var fAmount = parseFloat(field.amount);
				
				if ( !fAmount || fAmount <= 0 ) {
					layer.msg('请输入有效金额', {icon: 2});
					return false;
				}
				
				// 转换为分
				var iAmountCent = Math.round(fAmount * 100);
				
				var submitData = {
					id: iUserId,
					type: parseInt(field.type),
					amount: iAmountCent,
					remark: field.remark || ''
				};
				
				fetch('/admin/member/user/balance', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(submitData),
				})
				.then(function(response) { return response.json(); })
				.then(function(data) {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
						parent.layui.table.reloadData('Table_Member_User');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(function(error) {
					layer.msg('请求出错', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
