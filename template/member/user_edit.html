<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>编辑前台用户</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="MemberUserEditForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
		<input type="hidden" name="id" value="{{$id}}">
		<div class="layui-form-item">
			<label class="layui-form-label">用户名</label>
			<div class="layui-input-block">
				<input type="text" name="username" value="{{$username}}" class="layui-input" readonly disabled style="background:#f2f2f2;">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">昵称</label>
			<div class="layui-input-block">
				<input type="text" name="nickname" value="{{$nickname}}" placeholder="请输入昵称" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">用户组</label>
			<div class="layui-input-block">
				<select name="groupId" lay-verify="required">
					{{#foreach:groupList}}
					<option value="{{$id}}">{{$name}}</option>
					{{#end}}
				</select>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">权限级别</label>
			<div class="layui-input-block">
				<input type="number" name="authLevel" value="{{$authLevel}}" placeholder="请输入权限级别（0-999）" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">余额(分)</label>
			<div class="layui-input-block">
				<input type="text" value="{{$balance}}" class="layui-input" readonly disabled style="background:#f2f2f2;">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">邮箱</label>
			<div class="layui-input-block">
				<input type="email" readonly disabled value="{{$email}}" title="须由会员通过验证码流程绑定" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">手机</label>
			<div class="layui-input-block">
				<input type="text" readonly disabled value="{{$phone}}" title="须由会员通过验证码流程绑定" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">状态</label>
			<div class="layui-input-block">
				<select name="status">
					<option value="1">正常</option>
					<option value="0">禁用</option>
				</select>
			</div>
		</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		var currentGroupId = {{$groupId}};
		var currentStatus = {{$status}};
		
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			
			// 设置当前选中值
			form.val('MemberUserEditForm', {
				groupId: currentGroupId,
				status: currentStatus
			});
			form.render();
			
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			form.on('submit(submit)', function(data){
				var field = data.field;
				
				var submitData = {
					id: parseInt(field.id),
					nickname: field.nickname || '',
					groupId: parseInt(field.groupId),
					authLevel: parseInt(field.authLevel) || 0,
					status: parseInt(field.status)
				};
				
				fetch('/admin/member/user', {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(submitData),
				})
				.then(function(response) { return response.json(); })
				.then(function(data) {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
						parent.layui.table.reloadData('Table_Member_User');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(function(error) {
					layer.msg('请求出错', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
