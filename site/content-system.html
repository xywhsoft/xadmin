<header class="site-header"><nav class="nav"><a class="brand" href="/"><img src="/img/logo.png" alt="xadmin">xadmin</a><div class="nav-links"><a href="/features">功能</a><a href="/plugins">插件生态</a><a href="/capabilities">能力包</a><a href="/content-system">内容系统</a><a href="/docs">文档</a></div><div class="nav-actions"><a class="nav-action nav-security" href="/account/index.html#two-factor-auth">账户安全</a><a class="nav-action" href="/admin">进入后台</a></div></nav></header>
<main>
  <section class="section page-title"><span class="eyebrow">Managed Content</span><h1>内容模型系统</h1><p class="lead">内容模型系统负责定义模型、装配能力包并生成业务插件。生成出来的插件仍然是标准 xadmin 插件，拥有独立数据库和后台菜单。</p></section>
  <section class="band"><div class="section"><h2>生成流程</h2><div class="steps">
    <div class="step"><b>1</b><h3>定义模型</h3><p>配置字段、页面、策略、插件标题和菜单标题。</p></div>
    <div class="step"><b>2</b><h3>装配能力</h3><p>选择评论、标签、静态化等能力包并填写选项。</p></div>
    <div class="step"><b>3</b><h3>生成插件</h3><p>输出 main.c、后台页面、模板、运行时契约和数据库结构。</p></div>
    <div class="step"><b>4</b><h3>启用运行</h3><p>业务插件在插件系统中启用，提供后台管理与公开接口。</p></div>
  </div></div></section>
</main>
