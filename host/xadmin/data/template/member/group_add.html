<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加用户组</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
	<style>
		.auth-group-header { font-weight: bold; margin-top: 10px; margin-bottom: 8px; padding: 6px 12px; background-color: #f8f8f8; border-left: 3px solid #1E9FFF; font-size: 14px; }
		.auth-group-header:first-child { margin-top: 0; }
		.auth-checkbox-container { padding: 0 10px 5px 10px; }
		.auth-checkbox-container .layui-form-checkbox { margin: 0 15px 5px 0; }
	</style>
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="GroupAddForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
		<div class="layui-form-item">
			<label class="layui-form-label">组名称</label>
			<div class="layui-input-block">
				<input type="text" name="name" required lay-verify="required" placeholder="请输入用户组名称" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item layui-form-text">
			<label class="layui-form-label">描述</label>
			<div class="layui-input-block">
				<textarea name="desc" placeholder="请输入描述" class="layui-textarea" style="height: 60px;"></textarea>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">分配权限</label>
			<div class="layui-input-block" id="authListContainer" style="height: 280px; overflow-y: auto;">
				{*AuthGroupItem:authGroups}
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">权限级别</label>
			<div class="layui-input-block">
				<input type="number" name="authLevel" value="0" placeholder="请输入权限级别（0-999）" autocomplete="off" class="layui-input">
			</div>
		</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		layui.use('form', function(){
			var form = layui.form;
			var layer = layui.layer;
			form.render();
			
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			form.on('submit(submit)', function(data){
				var field = data.field;
				var authIds = [];
				var checkboxes = document.querySelectorAll('input[name="authList[]"]:checked');
				for (var i = 0; i < checkboxes.length; i++) {
					authIds.push(parseInt(checkboxes[i].value));
				}
				
				var submitData = {
					name: field.name,
					desc: field.desc || '',
					authList: JSON.stringify(authIds),
					authLevel: parseInt(field.authLevel) || 0
				};
				
				fetch('/admin/member/group', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(submitData),
				})
				.then(function(response) { return response.json(); })
				.then(function(data) {
					if ( data.result ) {
						layer.msg(data.message, {icon: 1});
						parent.layui.table.reloadData('Table_Member_Group');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(function(error) {
					layer.msg('请求出错', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
{#define:AuthGroupItem}<div class="auth-group-header">{$name}</div><div class="auth-checkbox-container">{*AuthCheckboxItem:auths}</div>{#end}
{#define:AuthCheckboxItem}<input type="checkbox" name="authList[]" value="{$id}" title="{$name}" lay-skin="primary">{#end}
