<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guestbook Admin</title>
  <style>
    body { margin: 0; background: #0b1220; color: #e5eef9; font-family: "Segoe UI", Arial, sans-serif; }
    .shell { max-width: 1180px; margin: 0 auto; padding: 34px 18px 72px; }
    .hero { background: linear-gradient(135deg, #111827, #1d4ed8); border-radius: 26px; padding: 28px; box-shadow: 0 22px 56px rgba(15,23,42,.35); margin-bottom: 22px; }
    .hero h1 { margin: 0 0 8px; font-size: 34px; }
    .hero p { margin: 0; color: #bfdbfe; }
    .panel { background: #111827; border: 1px solid #1f2937; border-radius: 24px; padding: 22px; box-shadow: 0 16px 40px rgba(0,0,0,.22); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar h2 { margin: 0; font-size: 20px; }
    .badge { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; background: #172554; color: #93c5fd; font-size: 12px; font-weight: 700; }
    .select { border: 1px solid #334155; border-radius: 999px; background: #0f172a; color: #e2e8f0; padding: 10px 14px; }
    .button { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 700; cursor: pointer; transition: .18s ease; }
    .button.primary { background: #38bdf8; color: #082f49; }
    .button.ghost { background: #1e293b; color: #cbd5e1; }
    .button.danger { background: #ef4444; color: #fff; }
    .button:hover { transform: translateY(-1px); }
    .list { display: flex; flex-direction: column; gap: 16px; }
    .item { padding: 18px; border-radius: 18px; background: #0f172a; border: 1px solid #1e293b; }
    .item-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 10px; }
    .item-meta strong { display: block; font-size: 16px; color: #f8fafc; margin-bottom: 4px; }
    .item-meta span { display: block; font-size: 13px; color: #94a3b8; }
    .status-pill { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status-pending { background: #3f2a12; color: #fcd34d; }
    .status-approved { background: #123524; color: #86efac; }
    .status-rejected { background: #3b1111; color: #fca5a5; }
    .content { white-space: pre-wrap; line-height: 1.7; color: #e2e8f0; margin-bottom: 14px; }
    .reply-grid { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; align-items: start; }
    .reply-grid textarea { width: 100%; min-height: 92px; box-sizing: border-box; border: 1px solid #334155; border-radius: 14px; background: #020617; color: #e2e8f0; padding: 11px 12px; font: inherit; resize: vertical; }
    .reply-preview { padding: 12px 14px; border-radius: 14px; background: #111827; border: 1px solid #1f2937; color: #cbd5e1; }
    .reply-label { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
    .reply-actions { display: flex; flex-direction: column; gap: 10px; }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 18px; padding-top: 18px; border-top: 1px solid #1f2937; }
    .pager-info { font-size: 13px; color: #94a3b8; }
    .pager-actions { display: flex; gap: 10px; }
    .status { min-height: 18px; font-size: 13px; color: #38bdf8; margin-bottom: 12px; }
    .empty { padding: 42px 0; text-align: center; color: #64748b; }
    @media (max-width: 920px) { .reply-grid { grid-template-columns: 1fr; } .hero h1 { font-size: 28px; } }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1>Guestbook Admin</h1>
      <p>Review, approve, reply to, and remove guestbook messages from one screen.</p>
    </section>
    <section class="panel">
      <div class="toolbar">
        <div class="toolbar-left">
          <h2>Messages</h2>
          <span class="badge" id="ga_total">0 total</span>
        </div>
        <div class="toolbar-left">
          <select class="select" id="ga_filter" onchange="gaLoad(1)">
            <option value="-1">All statuses</option>
            <option value="0">Pending</option>
            <option value="1">Approved</option>
            <option value="2">Rejected</option>
          </select>
          <button class="button ghost" onclick="gaLoad(ga.page)">Refresh</button>
        </div>
      </div>
      <div class="status" id="ga_status"></div>
      <div class="list" id="ga_list"><div class="empty">Loading...</div></div>
      <div class="pager">
        <div class="pager-info" id="ga_pager">Page 1</div>
        <div class="pager-actions">
          <button class="button ghost" id="ga_prev" onclick="gaPrev()">Previous</button>
          <button class="button ghost" id="ga_next" onclick="gaNext()">Next</button>
        </div>
      </div>
    </section>
  </div>
  <script>
    const ga = { page: 1, pageSize: 20, total: 0 };
    function gaEscape(value) {
      return String(value || "").replace(/[&<>\"']/g, (ch) => {
        if (ch === "&") return "&amp;";
        if (ch === "<") return "&lt;";
        if (ch === ">") return "&gt;";
        if (ch === "\"") return "&quot;";
        return "&#39;";
      });
    }
    function gaStatusText(status) {
      if (status === 0) return "Pending";
      if (status === 1) return "Approved";
      if (status === 2) return "Rejected";
      return "Unknown";
    }
    function gaStatusClass(status) {
      if (status === 0) return "status-pill status-pending";
      if (status === 1) return "status-pill status-approved";
      return "status-pill status-rejected";
    }
    function gaOptions(current) {
      return [0, 1, 2].map((status) => {
        const selected = status === current ? " selected" : "";
        return `<option value="${status}"${selected}>${gaStatusText(status)}</option>`;
      }).join("");
    }
    function gaSetStatus(message, color) {
      const el = document.getElementById("ga_status");
      el.style.color = color || "#38bdf8";
      el.innerText = message || "";
    }
    function gaRender(payload) {
      const list = document.getElementById("ga_list");
      const items = (payload && payload.data) || [];
      ga.page = (payload && payload.page) || 1;
      ga.pageSize = (payload && payload.pageSize) || ga.pageSize;
      ga.total = (payload && payload.total) || 0;
      document.getElementById("ga_total").innerText = `${ga.total} total`;
      document.getElementById("ga_pager").innerText = `Page ${ga.page} / ${Math.max(1, Math.ceil((ga.total || 0) / (ga.pageSize || 1)))}`;
      document.getElementById("ga_prev").disabled = ga.page <= 1;
      document.getElementById("ga_next").disabled = ga.page * ga.pageSize >= ga.total;
      if (!items.length) {
        list.innerHTML = "<div class='empty'>No messages matched this filter.</div>";
        return;
      }
      list.innerHTML = items.map((item) => {
        const replyPreview = item.reply
          ? `<div class="reply-preview"><div class="reply-label">Current reply</div><div class="content">${gaEscape(item.reply)}</div><div style="font-size:12px;color:#94a3b8;margin-top:8px;">${gaEscape(item.replyTimeText || "")}</div></div>`
          : `<div class="reply-preview"><div class="reply-label">Current reply</div><div class="content">No reply yet.</div></div>`;
        return `<article class="item"><div class="item-top"><div class="item-meta"><strong>${gaEscape(item.nickname)}</strong><span>Created: ${gaEscape(item.createTimeText || "")}</span><span>Updated: ${gaEscape(item.updateTimeText || "")}</span></div><span class="${gaStatusClass(item.status)}">${gaEscape(item.statusText || gaStatusText(item.status))}</span></div><div class="content">${gaEscape(item.content)}</div><div class="reply-grid"><div><select class="select" id="ga_status_${item.id}">${gaOptions(item.status)}</select></div><textarea id="ga_reply_${item.id}" placeholder="Write a reply visible on the public page">${gaEscape(item.reply || "")}</textarea><div class="reply-actions"><button class="button primary" onclick="gaSave(${item.id})">Save</button><button class="button danger" onclick="gaDelete(${item.id})">Delete</button></div></div><div style="margin-top:12px">${replyPreview}</div></article>`;
      }).join("");
    }
    function gaLoad(page) {
      const filter = document.getElementById("ga_filter").value;
      fetch(`/admin/api/plugin/guestbook_v3/list?page=${encodeURIComponent(page || 1)}&limit=${encodeURIComponent(ga.pageSize || 20)}&status=${encodeURIComponent(filter)}`)
        .then((r) => r.json())
        .then((data) => {
          if (!data.result) throw new Error(data.message || "Load failed");
          gaRender(data);
        })
        .catch((err) => gaSetStatus(err && err.message ? err.message : "Load failed", "#f87171"));
    }
    function gaPrev() { if (ga.page > 1) gaLoad(ga.page - 1); }
    function gaNext() { if (ga.page * ga.pageSize < ga.total) gaLoad(ga.page + 1); }
    function gaSave(id) {
      const body = {
        id,
        status: parseInt(document.getElementById(`ga_status_${id}`).value, 10),
        reply: document.getElementById(`ga_reply_${id}`).value
      };
      gaSetStatus("Saving...");
      fetch("/admin/api/plugin/guestbook_v3/update", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      })
        .then((r) => r.json())
        .then((data) => {
          if (!data.result) throw new Error(data.message || "Save failed");
          gaSetStatus(data.message || "Saved.");
          gaLoad(ga.page);
        })
        .catch((err) => gaSetStatus(err && err.message ? err.message : "Save failed", "#f87171"));
    }
    function gaDelete(id) {
      if (!confirm(`Delete message #${id}?`)) return;
      gaSetStatus("Deleting...");
      fetch("/admin/api/plugin/guestbook_v3/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id })
      })
        .then((r) => r.json())
        .then((data) => {
          if (!data.result) throw new Error(data.message || "Delete failed");
          gaSetStatus(data.message || "Deleted.");
          gaLoad(ga.page);
        })
        .catch((err) => gaSetStatus(err && err.message ? err.message : "Delete failed", "#f87171"));
    }
    gaLoad(1);
  </script>
</body>
</html>
