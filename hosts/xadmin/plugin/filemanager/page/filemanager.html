<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Manager</title>
<link rel="stylesheet" href="/layui/css/layui.css">
<style>
html,body{margin:0;height:100%;background:#f5f7fb;font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}
.root{display:flex;flex-direction:column;height:100vh}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid #e7ecf3}
.pathbox{flex:1;min-width:260px;height:38px;padding:0 12px;display:flex;align-items:center;border:1px solid #d9e1ec;border-radius:8px;background:#fff;box-sizing:border-box}
.crumb{flex:1;min-width:0;white-space:nowrap;overflow:hidden}.crumb a{color:#165dff;text-decoration:none}.crumb span,.crumb strong{margin-right:6px}.crumb a:hover{text-decoration:underline}
#pathInput{display:none;width:100%;border:0;outline:none;font-size:14px}.disabled{opacity:.45;pointer-events:none}
.main{flex:1;padding:12px 14px 0;overflow:hidden}.panel{height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e7ecf3;border-radius:10px 10px 0 0;overflow:hidden}
.wrap{flex:1;overflow:auto}.tbl{width:100%;border-collapse:collapse;table-layout:fixed}.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid #eef2f7;font-size:14px;box-sizing:border-box}.tbl th{position:sticky;top:0;background:#f8fafc;z-index:1;color:#5b6b7b;text-align:left}
.tbl tr:hover td{background:#f7fbff}.tbl tr.sel td{background:#edf5ff}.c1{width:46px;text-align:center}.c3{width:120px}.c4{width:180px}.c5{width:100px}.c6{width:170px}
.name{display:flex;align-items:center;gap:10px;min-width:0}.name span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.file{color:#165dff}
.empty{text-align:center;color:#90a0b3;padding:40px 10px}.foot{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid #e7ecf3;background:#fafcff;color:#5b6b7b;font-size:13px}
.editor{height:100%;display:flex;flex-direction:column}.editor .hd{padding:10px 14px;border-bottom:1px solid #e7ecf3;background:#f9fbfd;color:#5b6b7b;font-size:13px}.editor textarea{flex:1;width:100%;border:0;outline:none;resize:none;box-sizing:border-box;padding:14px;font:13px/1.6 Consolas,"Courier New",monospace}
.imgview{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111827}.imgview img{max-width:100%;max-height:100%;object-fit:contain}
@media (max-width:900px){.c4,.c5{display:none}}
</style>
</head>
<body>
<div class="root">
  <div class="bar">
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnUp"><i class="layui-icon layui-icon-return"></i></button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnRefresh"><i class="layui-icon layui-icon-refresh"></i></button>
    <div class="pathbox"><div class="crumb" id="crumb"></div><input id="pathInput" type="text" autocomplete="off"></div>
  </div>
  <div class="bar">
    <button class="layui-btn layui-btn-normal layui-btn-sm" id="btnUpload"><i class="layui-icon layui-icon-upload-drag"></i> Upload</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnNewFile">New File</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnNewDir">New Folder</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnCopy">Copy</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnCut">Cut</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnPaste">Paste</button>
    <button class="layui-btn layui-btn-danger layui-btn-sm" id="btnDelete">Delete</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnCompress">Compress</button>
    <button class="layui-btn layui-btn-primary layui-btn-sm" id="btnExtract">Extract</button>
    <input id="uploadInput" type="file" multiple style="display:none">
  </div>
  <div class="main">
    <div class="panel">
      <div class="wrap">
        <table class="tbl">
          <thead><tr><th class="c1"><input type="checkbox" id="checkAll"></th><th>Name</th><th class="c3">Size</th><th class="c4">Modified</th><th class="c5">Type</th><th class="c6">Action</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="foot"><div id="status">Ready</div><div id="selection">Selected 0 items</div></div>
    </div>
  </div>
</div>
<script src="/layui/layui.js"></script>
<script>
(function(){
var state={path:"",items:[],selected:{},clip:null},layer;
function norm(p){return (p||"").replace(/\\/g,"/").replace(/\/+/g,"/").replace(/^\//,"").replace(/\/$/,"")}
function join(a,b){return norm(a?(a+"/"+b):b)} function enc(s){return encodeURIComponent(s||"")}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}
function isImg(ext){return["jpg","jpeg","png","gif","bmp","webp","svg","ico"].indexOf((ext||"").toLowerCase())>=0}
function isArc(ext){return["zip","7z","rar","tar","gz","tgz","xz","bz2"].indexOf((ext||"").toLowerCase())>=0}
function isEdit(ext,name){ext=(ext||"").toLowerCase();name=(name||"").toLowerCase();if(name==="dockerfile"||name==="makefile")return true;return["txt","md","log","ini","cfg","conf","json","xml","html","htm","css","js","ts","jsx","tsx","c","h","cpp","hpp","py","java","go","rs","sh","bat","sql","yaml","yml","toml","csv","env"].indexOf(ext)>=0}
function size(n){n=Number(n||0);if(n>=1073741824)return(n/1073741824).toFixed(2)+" GB";if(n>=1048576)return(n/1048576).toFixed(2)+" MB";if(n>=1024)return(n/1024).toFixed(2)+" KB";return n+" B"}
function msg(t,i){layer.msg(t,{icon:i||0})} function setStatus(t){document.getElementById("status").textContent=t}
function api(url,opt){return fetch(url,opt).then(function(r){return r.json().catch(function(){return{result:false,message:"Server did not return JSON"}})})}
function curSel(){var map={},ids=Object.keys(state.selected),out=[];state.items.forEach(function(it){map[String(it.id)]=it});ids.forEach(function(id){if(map[id])out.push(map[id])});return out}
function syncBtns(){var c=curSel(),has=c.length>0,oneArc=c.length===1&&!c[0].isdir&&isArc(c[0].ext);[["btnCopy",has],["btnCut",has],["btnDelete",has],["btnCompress",has],["btnExtract",oneArc],["btnPaste",!!state.clip&&state.clip.items.length>0]].forEach(function(p){var el=document.getElementById(p[0]);if(p[1])el.classList.remove("disabled");else el.classList.add("disabled")});document.getElementById("selection").textContent="Selected "+c.length+" items"}
function renderCrumb(){var el=document.getElementById("crumb"),parts=state.path?state.path.split("/"):[],html='<a href="#" data-p="">root</a>',p="";parts.forEach(function(part,i){p+=(p?"/":"")+part;html+='<span>/</span>'+(i===parts.length-1?'<strong>'+esc(part)+'</strong>':'<a href="#" data-p="'+esc(p)+'">'+esc(part)+'</a>')});el.innerHTML=html;Array.prototype.forEach.call(el.querySelectorAll("a[data-p]"),function(a){a.onclick=function(e){e.preventDefault();state.path=this.getAttribute("data-p")||"";load()}})}
function itemType(it){if(it.isroot)return"Drive";if(it.isdir)return"Folder";return it.ext?String(it.ext).toUpperCase():"File"}
function icon(it){if(it.isdir)return"layui-icon-file-b";if(isImg(it.ext))return"layui-icon-picture";if(isArc(it.ext))return"layui-icon-release";return"layui-icon-file"}
function rowHtml(it){var cls=state.selected[String(it.id)]?"sel":"",fileCls=it.isdir?"":"file",actions="",disabled=it.isroot?' disabled':'';if(!it.isroot){actions+='<button class="layui-btn layui-btn-xs layui-btn-primary" data-dl="'+it.id+'">Download</button>';if(!it.isdir&&isEdit(it.ext,it.name))actions+=' <button class="layui-btn layui-btn-xs" data-ed="'+it.id+'">Edit</button>';if(!it.isdir&&isImg(it.ext))actions+=' <button class="layui-btn layui-btn-xs" data-img="'+it.id+'">Preview</button>';actions+=' <button class="layui-btn layui-btn-xs layui-btn-danger" data-del="'+it.id+'">Delete</button>'}return'<tr data-id="'+it.id+'" class="'+cls+'"><td class="c1"><input class="chk" data-id="'+it.id+'" type="checkbox"'+disabled+' '+(state.selected[String(it.id)]?"checked":"")+'></td><td><div class="name"><i class="layui-icon '+icon(it)+'"></i><span class="'+fileCls+'" data-open="'+it.id+'">'+esc(it.name)+'</span></div></td><td class="c3">'+(it.isdir?"-":size(it.size))+'</td><td class="c4">'+esc(it.time||"-")+'</td><td class="c5">'+esc(itemType(it))+'</td><td class="c6">'+actions+'</td></tr>'}
function find(id){id=String(id);for(var i=0;i<state.items.length;i++)if(String(state.items[i].id)===id)return state.items[i];return null}
function render(){var tb=document.getElementById("tbody");if(!state.items.length){tb.innerHTML='<tr><td colspan="6" class="empty">This folder is empty</td></tr>';syncBtns();return}tb.innerHTML=state.items.map(rowHtml).join("");Array.prototype.forEach.call(document.querySelectorAll(".chk"),function(el){el.onchange=function(){var id=String(this.getAttribute("data-id"));if(this.disabled)return;if(this.checked)state.selected[id]=true;else delete state.selected[id];render()}});Array.prototype.forEach.call(document.querySelectorAll("[data-open]"),function(el){el.onclick=function(){var tr=this.closest("tr"),chk=tr.querySelector(".chk");if(!chk.disabled){chk.checked=!chk.checked;chk.dispatchEvent(new Event("change"))}};el.ondblclick=function(){open(find(this.getAttribute("data-open")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-dl]"),function(el){el.onclick=function(){download(find(this.getAttribute("data-dl")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-ed]"),function(el){el.onclick=function(){edit(find(this.getAttribute("data-ed")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-img]"),function(el){el.onclick=function(){preview(find(this.getAttribute("data-img")))}});Array.prototype.forEach.call(document.querySelectorAll("[data-del]"),function(el){el.onclick=function(){removeItems([find(this.getAttribute("data-del"))])}});syncBtns()}
function load(){state.selected={};document.getElementById("checkAll").checked=false;renderCrumb();setStatus("Loading "+(state.path||"root"));api("/admin/api/plugin/filemanager/list?path="+enc(state.path)).then(function(res){state.items=Array.isArray(res.data)?res.data:[];state.items.sort(function(a,b){if(!!a.isdir!==!!b.isdir)return a.isdir?-1:1;return String(a.name||"").localeCompare(String(b.name||""),"en")});render();setStatus("Current: "+(state.path||"root")+" | "+state.items.length+" items")}).catch(function(err){state.items=[];render();setStatus("Load failed");msg("List failed: "+err.message,2)})}
function open(it){if(!it)return;if(it.isdir){state.path=join(state.path,it.name);load();return}if(isImg(it.ext)){preview(it);return}if(isEdit(it.ext,it.name)){edit(it);return}download(it)}
function download(it){if(!it)return;window.open("/admin/api/plugin/filemanager/download?path="+enc(join(state.path,it.name)),"_blank")}
function promptCreate(isFile){layer.prompt({formType:0,title:isFile?"Enter file name":"Enter folder name"},function(val,idx){val=String(val||"").trim();if(!val){msg("Name is required",2);return}api("/admin/api/plugin/filemanager/create",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fileName:val,folderPath:state.path,isfile:isFile?1:0})}).then(function(res){if(res.result){layer.close(idx);msg(isFile?"File created":"Folder created",1);load()}else msg(res.message||"Create failed",2)}).catch(function(err){msg("Create failed: "+err.message,2)})})}
function removeItems(items){items=(items||[]).filter(Boolean);if(!items.length){msg("Select items first");return}layer.confirm("Delete "+items.length+" selected item(s)?",{icon:3,title:"Confirm"},function(idx){api("/admin/api/plugin/filemanager/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({folderPath:state.path,items:items.map(function(it){return{name:it.name,isdir:it.isdir?1:0}})})}).then(function(res){layer.close(idx);if(res.result){msg("Delete success",1);load()}else msg(res.message||"Delete failed",2)}).catch(function(err){layer.close(idx);msg("Delete failed: "+err.message,2)})})}
function copySel(isCut){var items=curSel();if(!items.length){msg("Select items first");return}state.clip={isCut:!!isCut,items:items.map(function(it){return{sourcePath:join(state.path,it.name),isdir:it.isdir?1:0}})};syncBtns();msg(isCut?"Cut list ready":"Copy list ready",1)}
function pasteSel(){if(!state.clip||!state.clip.items.length){msg("Clipboard is empty");return}api("/admin/api/plugin/filemanager/copy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({targetPath:state.path,isCut:state.clip.isCut?1:0,items:state.clip.items})}).then(function(res){if(res.result){msg(state.clip.isCut?"Move success":"Copy success",1);if(state.clip.isCut)state.clip=null;load()}else msg(res.message||"Paste failed",2);syncBtns()}).catch(function(err){msg("Paste failed: "+err.message,2)})}
function edit(it){if(!it)return;var fp=join(state.path,it.name);api("/admin/api/plugin/filemanager/content?path="+enc(fp)).then(function(res){if(!res.result){msg(res.message||"Read file failed",2);return}var html='<div class="editor"><div class="hd">'+esc(fp)+'</div><textarea id="editorText">'+esc(res.content||"")+'</textarea></div>';var id=layer.open({type:1,title:"Edit file",area:["860px","640px"],maxmin:true,content:html,btn:["Save","Close"],yes:function(){api("/admin/api/plugin/filemanager/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:fp,content:document.getElementById("editorText").value})}).then(function(ret){if(ret.result){msg("Save success",1);layer.close(id);load()}else msg(ret.message||"Save failed",2)}).catch(function(err){msg("Save failed: "+err.message,2)})}})}).catch(function(err){msg("Read file failed: "+err.message,2)})}
function preview(it){if(!it)return;var fp=join(state.path,it.name);layer.open({type:1,title:it.name,area:["900px","680px"],shadeClose:true,maxmin:true,content:'<div class="imgview"><img alt="" src="/admin/api/plugin/filemanager/image?path='+enc(fp)+'"></div>'})}
function upload(files){files=Array.prototype.slice.call(files||[]);if(!files.length)return;var i=0,bad=0;setStatus("Uploading "+files.length+" file(s)");(function next(){if(i>=files.length){setStatus("Upload finished");msg(bad>0?"Upload finished, failed "+bad:"Upload success",bad>0?2:1);load();return}var fd=new FormData();fd.append("file",files[i]);fetch("/admin/api/plugin/filemanager/upload?path="+enc(state.path),{method:"POST",body:fd}).then(function(r){return r.json()}).then(function(res){if(!res.result)bad++;i++;next()}).catch(function(){bad++;i++;next()})})()}
function compressSel(){var items=curSel();if(!items.length){msg("Select items first");return}var def=items.length===1?items[0].name:"archive";layer.open({type:1,title:"Compress",area:["420px","290px"],content:'<div style="padding:16px"><div class="layui-form-item"><label class="layui-form-label" style="width:90px">Format</label><div class="layui-input-block" style="margin-left:120px"><select id="cfmt" class="layui-input"><option value="zip">zip</option><option value="7z">7z</option><option value="tar.gz">tar.gz</option></select></div></div><div class="layui-form-item"><label class="layui-form-label" style="width:90px">Name</label><div class="layui-input-block" style="margin-left:120px"><input id="cname" class="layui-input" value="'+esc(def.replace(/\.[^.]+$/,""))+'"></div></div><div class="layui-form-item"><label class="layui-form-label" style="width:90px">Save Path</label><div class="layui-input-block" style="margin-left:120px"><input id="cpath" class="layui-input" value="'+esc(state.path)+'"></div></div></div>',btn:["Run","Cancel"],yes:function(idx){var fmt=document.getElementById("cfmt").value,name=document.getElementById("cname").value.trim(),save=norm(document.getElementById("cpath").value.trim());if(!name){msg("Archive name is required",2);return}api("/admin/api/plugin/filemanager/compress",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({format:fmt,filename:name,savePath:save,sourcePath:state.path,items:items.map(function(it){return{name:it.name}})})}).then(function(res){if(res.result){layer.close(idx);msg("Compress success",1);load()}else msg(res.message||"Compress failed",2)}).catch(function(err){msg("Compress failed: "+err.message,2)})}})}
function extractSel(){var items=curSel();if(items.length!==1||items[0].isdir||!isArc(items[0].ext)){msg("Select one archive file");return}var it=items[0],ap=join(state.path,it.name),def=join(state.path,it.name.replace(/\.[^.]+$/,""));layer.prompt({formType:0,title:"Enter extract path",value:def},function(val,idx){val=norm(String(val||"").trim());if(!val){msg("Extract path is required",2);return}api("/admin/api/plugin/filemanager/extract",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({archivePath:ap,extractPath:val})}).then(function(res){if(res.result){layer.close(idx);msg("Extract success",1);load()}else msg(res.message||"Extract failed",2)}).catch(function(err){msg("Extract failed: "+err.message,2)})})}
layui.use(["layer"],function(){layer=layui.layer;document.getElementById("btnUp").onclick=function(){if(!state.path)return;var arr=state.path.split("/");arr.pop();state.path=arr.join("/");load()};document.getElementById("btnRefresh").onclick=load;document.getElementById("btnNewFile").onclick=function(){promptCreate(true)};document.getElementById("btnNewDir").onclick=function(){promptCreate(false)};document.getElementById("btnDelete").onclick=function(){removeItems(curSel())};document.getElementById("btnCopy").onclick=function(){copySel(false)};document.getElementById("btnCut").onclick=function(){copySel(true)};document.getElementById("btnPaste").onclick=pasteSel;document.getElementById("btnCompress").onclick=compressSel;document.getElementById("btnExtract").onclick=extractSel;document.getElementById("btnUpload").onclick=function(){document.getElementById("uploadInput").click()};document.getElementById("uploadInput").onchange=function(){upload(this.files);this.value=""};document.getElementById("checkAll").onchange=function(){state.selected={};if(this.checked)state.items.forEach(function(it){if(!it.isroot)state.selected[String(it.id)]=true});render()};document.getElementById("crumb").ondblclick=function(){var inp=document.getElementById("pathInput");inp.style.display="block";inp.value=state.path;inp.focus();inp.select()};document.getElementById("pathInput").onkeydown=function(e){if(e.key==="Enter"){state.path=norm(this.value);this.style.display="none";load()}else if(e.key==="Escape"){this.style.display="none"}};document.getElementById("pathInput").onblur=function(){this.style.display="none"};load()})
})();
</script>
</body>
</html>
