<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>编辑模型</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
	<style>
		.layui-form-label { width: 120px; }
		.layui-input-block { margin-left: 150px; }
		.layui-colla-item { margin-bottom: 10px; }
		.layui-colla-title { background: #f8f8f8; }
		.layui-colla-content { padding: 15px; }
	</style>
</head>
<body style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
	<form class="layui-form" lay-filter="ModelEditForm" style="height: 100%; display: flex; flex-direction: column;">
	<div style="flex: 1; overflow-y: auto; padding: 20px;">
			<input type="hidden" name="name" id="modelName">
			<div class="layui-form-item">
				<label class="layui-form-label">模型标识</label>
				<div class="layui-input-block">
					<input type="text" id="displayName" class="layui-input layui-disabled" readonly>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">模型名称</label>
				<div class="layui-input-block">
					<input type="text" name="title" required lay-verify="required" placeholder="显示名称" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">命名空间</label>
				<div class="layui-input-block">
					<input type="text" name="namespace" placeholder="API路径前缀" autocomplete="off" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">图标</label>
				<div class="layui-input-block">
					<div style="display: flex; width: 100%;">
						<span id="iconPreview" style="flex-shrink: 0; width: 38px; height: 36px; line-height: 36px; text-align: center; border: 1px solid #e6e6e6; border-radius: 4px 0 0 4px; font-size: 18px; border-right: none; background: #fff;"></span>
						<input type="text" name="icon" id="iconInput" placeholder="请选择图标" autocomplete="off" class="layui-input" style="flex: 1; border-radius: 0;" readonly>
						<button type="button" class="layui-btn layui-btn-primary" id="btnSelectIcon" style="flex-shrink: 0; border-radius: 0 4px 4px 0; margin-left: -1px;">选择</button>
					</div>
				</div>
			</div>
			<div class="layui-form-item layui-form-text">
				<label class="layui-form-label">描述</label>
				<div class="layui-input-block">
					<textarea name="desc" placeholder="模型描述信息" class="layui-textarea" style="min-height: 60px;"></textarea>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">排序值</label>
				<div class="layui-input-block">
					<input type="number" name="sort" value="0" placeholder="数值越小越靠前" autocomplete="off" class="layui-input" style="width: 200px;">
				</div>
			</div>
			
			<div class="layui-collapse" lay-accordion>
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">功能开关</h2>
					<div class="layui-colla-content layui-show">
						<div class="layui-form-item">
							<label class="layui-form-label">前台API</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enableApi" lay-skin="switch" lay-text="启用|禁用">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">后台管理</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enableAdmin" lay-skin="switch" lay-text="启用|禁用">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">前台投稿</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enableSubmit" lay-skin="switch" lay-text="启用|禁用">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">评论功能</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enableReply" lay-skin="switch" lay-text="启用|禁用">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">访问控制</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enableAccessControl" lay-skin="switch" lay-text="启用|禁用">
							</div>
						</div>
					</div>
				</div>
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">访问控制配置</h2>
					<div class="layui-colla-content">
						<div class="layui-form-item">
							<label class="layui-form-label">默认访问级别</label>
							<div class="layui-input-block">
								<input type="number" name="defaultAccessLevel" value="0" placeholder="0=公开，>0=需指定会员等级" autocomplete="off" class="layui-input" style="width: 200px;">
								<div class="layui-form-mid layui-word-aux">0=公开, 1~N=需会员等级>=N, -1=付费, -2=仅作者</div>
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">启用预览</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enablePreview" lay-skin="switch" lay-text="是|否" checked>
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">启用付费</label>
							<div class="layui-input-block">
								<input type="checkbox" name="enablePurchase" lay-skin="switch" lay-text="是|否">
							</div>
						</div>
					</div>
				</div>
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">权限配置</h2>
					<div class="layui-colla-content">
						<div class="layui-form-item">
							<label class="layui-form-label">API权限级别</label>
							<div class="layui-input-block">
								<input type="number" name="apiAuthLevel" value="0" placeholder="0表示公开访问" autocomplete="off" class="layui-input" style="width: 200px;">
							</div>
						</div>
					</div>
				</div>
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">评论配置</h2>
					<div class="layui-colla-content">
						<div class="layui-form-item">
							<label class="layui-form-label">评论需审核</label>
							<div class="layui-input-block">
								<input type="checkbox" name="replyNeedApprove" lay-skin="switch" lay-text="是|否">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">评论权限级别</label>
							<div class="layui-input-block">
								<input type="number" name="replyAuthLevel" value="0" placeholder="0表示游客可评论" autocomplete="off" class="layui-input" style="width: 200px;">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">引用摘要长度</label>
							<div class="layui-input-block">
								<input type="number" name="replyQuoteMaxLen" value="50" placeholder="默认50字符" autocomplete="off" class="layui-input" style="width: 200px;">
							</div>
						</div>
					</div>
				</div>
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">投稿配置</h2>
					<div class="layui-colla-content">
						<div class="layui-form-item">
							<label class="layui-form-label">允许游客投稿</label>
							<div class="layui-input-block">
								<input type="checkbox" name="allowGuestSubmit" lay-skin="switch" lay-text="是|否">
							</div>
						</div>
						<div class="layui-form-item">
							<label class="layui-form-label">会员投稿审核</label>
							<div class="layui-input-block">
								<input type="checkbox" name="submitNeedReview" lay-skin="switch" lay-text="是|否" checked>
								<div class="layui-form-mid layui-word-aux">游客投稿始终进入草稿箱，此选项仅控制会员投稿</div>
							</div>
						</div>
					</div>
				</div>
			</div>
	</div>
	<div style="padding: 10px 20px; border-top: 1px solid #e6e6e6; text-align: right;">
		<button class="layui-btn layui-bg-blue" lay-submit lay-filter="submit"><i class="layui-icon layui-icon-ok"></i> 保存修改</button>
		<button type="button" class="layui-btn layui-btn-primary" id="btnCancel"><i class="layui-icon layui-icon-close"></i> 取消</button>
	</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script src="/js/icon-picker.js"></script>
	<script>
		layui.use(['form', 'element'], function(){
			var form = layui.form;
			var element = layui.element;
			var layer = layui.layer;
			var $ = layui.$;
			
			// 图标选择按钮
			$('#btnSelectIcon').on('click', function(){
				IconPicker.open(this, function(sIcon){
					$('#iconInput').val(sIcon);
					if ( sIcon ) {
						$('#iconPreview').html('<i class="' + sIcon + '"></i>');
					} else {
						$('#iconPreview').html('');
					}
				});
			});
			
			// 获取URL参数
			function procGetUrlParam(sName) {
				var sReg = new RegExp("(^|&)" + sName + "=([^&]*)(&|$)", "i");
				var arrR = window.location.search.substr(1).match(sReg);
				if ( arrR != null ) return decodeURIComponent(arrR[2]);
				return null;
			}
			
			var sModelName = procGetUrlParam('name');
			if ( !sModelName ) {
				layer.msg('缺少模型参数', {icon: 2});
				return;
			}
			
			// 加载模型数据
			fetch('/admin/model/get?name=' + sModelName)
			.then(response => response.json())
			.then(result => {
				if ( result && result.result && result.data ) {
					var tblData = result.data;
					document.getElementById('modelName').value = tblData.name;
					document.getElementById('displayName').value = tblData.name;
					form.val('ModelEditForm', {
						'title': tblData.title || '',
						'namespace': tblData.namespace || '',
						'icon': tblData.icon || '',
						'desc': tblData.desc || '',
						'sort': tblData.sort || 0,
						'enableApi': tblData.enableApi,
						'enableAdmin': tblData.enableAdmin,
						'enableSubmit': tblData.enableSubmit,
						'enableReply': tblData.enableReply,
						'enableAccessControl': tblData.enableAccessControl,
						'apiAuthLevel': tblData.apiAuthLevel || 0,
						'defaultAccessLevel': tblData.defaultAccessLevel || 0,
						'enablePreview': tblData.enablePreview !== false,
						'enablePurchase': tblData.enablePurchase,
						'replyNeedApprove': tblData.replyNeedApprove,
						'replyAuthLevel': tblData.replyAuthLevel || 0,
						'replyQuoteMaxLen': tblData.replyQuoteMaxLen || 50,
						'allowGuestSubmit': tblData.allowGuestSubmit,
						'submitNeedReview': tblData.submitNeedReview !== false
					});
					// 同步图标预览
					if ( tblData.icon ) {
						$('#iconPreview').html('<i class="' + tblData.icon + '"></i>');
					}
				} else {
					layer.msg(result.message || '加载失败', {icon: 2});
				}
			})
			.catch(error => {
				layer.msg('请求出错', {icon: 2});
				console.error('Error:', error);
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submit)', function(data){
				var field = data.field;
				
				// 处理开关值
				field.enableApi = field.enableApi === 'on';
				field.enableAdmin = field.enableAdmin === 'on';
				field.enableSubmit = field.enableSubmit === 'on';
				field.enableReply = field.enableReply === 'on';
				field.enableAccessControl = field.enableAccessControl === 'on';
				field.enablePreview = field.enablePreview === 'on';
				field.enablePurchase = field.enablePurchase === 'on';
				field.replyNeedApprove = field.replyNeedApprove === 'on';
				field.allowGuestSubmit = field.allowGuestSubmit === 'on';
				field.submitNeedReview = field.submitNeedReview === 'on';
				field.sort = parseInt(field.sort) || 0;
				field.apiAuthLevel = parseInt(field.apiAuthLevel) || 0;
				field.defaultAccessLevel = parseInt(field.defaultAccessLevel) || 0;
				field.replyAuthLevel = parseInt(field.replyAuthLevel) || 0;
				field.replyQuoteMaxLen = parseInt(field.replyQuoteMaxLen) || 50;
				
				fetch('/admin/model/save', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(field)
				})
				.then(response => response.json())
				.then(data => {
					if ( data.result ) {
						layer.msg('保存成功', {icon: 1});
						parent.layui.table.reloadData('Table_Model_List');
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {
						layer.msg('请求服务报错：' + data.message, {icon: 2});
					}
				})
				.catch(error => {
					layer.msg('请求出错，请查看开发者工具检查原因', {icon: 2});
					console.error('Error:', error);
				});
				
				return false;
			});
		});
	</script>
</body>
</html>
