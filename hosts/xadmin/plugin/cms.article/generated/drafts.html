<!-- Page logic -->
<script>
layui.use(['table', 'form'], function(){
  var table = layui.table;
  var form = layui.form;
  var layer = layui.layer;
  var $ = layui.$;
  var pluginXid = 'cms.article';
  var domBase = 'Content_MakePlugin_cms_article_Drafts';
  var pageKind = 'drafts';
  var ids = {
    table: 'Table_' + domBase,
    toolbar: 'Toolbar_' + domBase,
    tool: 'Tool_' + domBase,
    search: 'Search_' + domBase,
    category: 'Category_' + domBase,
    editor: 'Editor_' + domBase,
    form: 'Form_' + domBase,
    save: 'Save_' + domBase,
    saveDraft: 'SaveDraft_' + domBase,
    cancel: 'Cancel_' + domBase,
    status: 'Status_' + domBase
  };
  var state = {
    meta: null,
    categories: null,
    categoryMap: {},
    form: null,
    currentId: 0,
    layerIndex: 0
  };

  function t(key) {
    var dict = {
      loadingForm: '\u6b63\u5728\u52a0\u8f7d\u8868\u5355...',
      xformMissing: 'XForm \u8868\u5355\u8fd0\u884c\u65f6\u52a0\u8f7d\u5931\u8d25',
      metaLoadFailed: '\u8868\u5355\u5143\u6570\u636e\u52a0\u8f7d\u5931\u8d25',
      recordLoadFailed: '\u8bb0\u5f55\u52a0\u8f7d\u5931\u8d25',
      addTitle: '\u65b0\u589e\u5185\u5bb9',
      editTitle: '\u7f16\u8f91\u5185\u5bb9',
      formNotReady: '\u8868\u5355\u5c1a\u672a\u51c6\u5907\u5b8c\u6210',
      validateFailed: '\u6821\u9a8c\u5931\u8d25',
      saving: '\u6b63\u5728\u4fdd\u5b58...',
      saveFailed: '\u4fdd\u5b58\u5931\u8d25',
      saved: '\u5185\u5bb9\u5df2\u4fdd\u5b58',
      draftSaved: '\u8349\u7a3f\u5df2\u4fdd\u5b58',
      confirmDelete: '\u786e\u5b9a\u5220\u9664 "',
      confirmDeleteEnd: '" \u5417\uff1f',
      deleteConfirm: '\u5220\u9664\u786e\u8ba4',
      deleteFailed: '\u5220\u9664\u5931\u8d25',
      deleted: '\u5df2\u5220\u9664',
      failed: '\u64cd\u4f5c\u5931\u8d25',
      draft: '\u8349\u7a3f',
      published: '\u5df2\u53d1\u5e03',
      title: '\u6807\u9898',
      status: '\u72b6\u6001',
      summary: '\u6458\u8981',
      createTime: '\u521b\u5efa\u65f6\u95f4',
      updateTime: '\u4fee\u6539\u65f6\u95f4',
      operation: '\u64cd\u4f5c'
    };
    return dict[key] || key;
  }

  function byId(id) {
    return document.getElementById(id);
  }

  function loadStyleOnce(id, href) {
    if (byId(id)) return;
    var link = document.createElement('link');
    link.id = id;
    link.rel = 'stylesheet';
    link.href = href;
    document.head.appendChild(link);
  }

  function loadScriptOnce(id, src) {
    window.__managedContentScriptPromises = window.__managedContentScriptPromises || {};
    if (byId(id)) return window.__managedContentScriptPromises[id] || Promise.resolve();
    var script = document.createElement('script');
    script.id = id;
    script.src = src;
    script.async = true;
    var promise = new Promise(function(resolve, reject){
      script.onload = resolve;
      script.onerror = function(){ reject(new Error('Failed to load ' + src)); };
    });
    window.__managedContentScriptPromises[id] = promise;
    document.head.appendChild(script);
    return promise;
  }

  async function ensureAssets() {
    window.__xformDebug = false;
    loadStyleOnce('managed-content-editormd-css', '/lib/editormd/css/editormd.min.css');
    loadStyleOnce('managed-content-wangeditor-css', '/lib/wangEditor/css/style.css');
    loadStyleOnce('managed-content-codemirror-css', '/lib/CodeMirror/lib/codemirror.css');
    loadStyleOnce('managed-content-codemirror-monokai-css', '/lib/CodeMirror/theme/monokai.css');
    if (!window.XForm || window.XForm.version !== '20260408_01') {
      await loadScriptOnce('managed-content-xform-runtime', '/lib/xform/xform.js?v=20260408_01');
    }
    if (!window.XForm || window.XForm.version !== '20260408_01') throw new Error(t('xformMissing'));
  }

  function textOf(value) {
    return value == null ? '' : String(value);
  }

  function escapeHtml(value) {
    return textOf(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function rowTitle(row) {
    return textOf((row && (row.title || (row.data && row.data.title))) || '-');
  }

  function statusTemplate(row) {
    if (row && row.isDraft) return '<span class="layui-badge layui-bg-orange">' + t('draft') + '</span>';
    return '<span class="layui-badge layui-bg-green">' + t('published') + '</span>';
  }

  function searchValue() {
    var el = byId(ids.search);
    return el ? el.value : '';
  }

  function categoryValue() {
    var el = byId(ids.category);
    return el ? el.value : '';
  }

  function reloadTable(resetPage) {
    var options = { where: { q: searchValue(), categoryId: categoryValue() } };
    if (resetPage !== false) options.page = { curr: 1 };
    table.reloadData(ids.table, options);
  }

  function setStatus(message, color) {
    var el = byId(ids.status);
    if (!el) return;
    el.innerText = message || '';
    el.style.color = color || '#1677ff';
  }

  async function loadMeta() {
    if (state.meta) return state.meta;
    var response = await fetch('/admin/api/plugin/' + pluginXid + '/form-meta', { cache: 'no-store' });
    var result = await response.json();
    if (!result || !result.result) throw new Error((result && result.message) || t('metaLoadFailed'));
    state.meta = result.data || {};
    return state.meta;
  }

  function categoryLabel(row) {
    var level = Number((row && row.level) || 0);
    var prefix = '';
    for (var i = 0; i < level; i++) prefix += '\u3000\u3000';
    return prefix + textOf((row && row.title) || '');
  }

  async function loadCategories() {
    if (state.categories) return state.categories;
    var response = await fetch('/admin/api/plugin/' + pluginXid + '/category/list', { cache: 'no-store' });
    var result = await response.json();
    if (!result || !result.result) {
      state.categories = [];
      return state.categories;
    }
    state.categories = Array.isArray(result.data) ? result.data : [];
    return state.categories;
  }

  function categoryOptions(categories, includeEmpty) {
    var list = [];
    if (includeEmpty) list.push({ value: 0, label: '\u672a\u5f52\u7c7b' });
    (categories || []).forEach(function(row){
      list.push({ value: Number(row.id || 0), label: categoryLabel(row) });
    });
    return list;
  }

  function categoryTitle(id) {
    var key = String(id || 0);
    if (key === '0') return '\u672a\u5f52\u7c7b';
    return state.categoryMap[key] || '-';
  }

  function hasSchemaField(schema, name) {
    var groups = (schema && schema.groups) || [];
    for (var i = 0; i < groups.length; i++) {
      var fields = groups[i].fields || [];
      for (var j = 0; j < fields.length; j++) {
        if (fields[j] && fields[j].name === name) return true;
      }
    }
    return false;
  }

  function withManagedSystemFields(schema, categories) {
    var next = JSON.parse(JSON.stringify(schema || { title: 'Content', groups: [] }));
    next.groups = Array.isArray(next.groups) ? next.groups : [];
    if (!hasSchemaField(next, 'slug')) {
      next.groups.push({
        key: 'url',
        title: '\u8bbf\u95ee\u8def\u5f84',
        desc: '\u516c\u5f00\u8bbf\u95ee\u548c\u68c0\u7d22\u4f7f\u7528\u7684 URL \u6807\u8bc6\u3002',
        fields: [{
          name: 'slug',
          type: 'text',
          label: 'URL\u6807\u8bc6',
          required: false,
          placeholder: 'my-first-post'
        }]
      });
    }
    if (!hasSchemaField(next, 'categoryId')) {
      next.groups.push({
        key: 'category',
        title: '\u53d1\u5e03\u8bbe\u7f6e',
        desc: '\u5185\u5bb9\u680f\u76ee\u5f52\u5c5e\u3002',
        fields: [{
          name: 'categoryId',
          type: 'select',
          label: '\u6240\u5c5e\u680f\u76ee',
          required: false,
          list: categoryOptions(categories, true)
        }]
      });
    }
    return next;
  }

  async function renderCategoryFilter() {
    var el = byId(ids.category);
    if (!el) return;
    var categories = await loadCategories();
    state.categoryMap = {};
    (categories || []).forEach(function(row){
      state.categoryMap[String(row.id || 0)] = categoryLabel(row);
    });
    el.innerHTML = '<option value="">\u5168\u90e8\u680f\u76ee</option>' + categoryOptions(categories, false).map(function(item){
      return '<option value="' + escapeHtml(item.value) + '">' + escapeHtml(item.label) + '</option>';
    }).join('');
    form.render('select');
    reloadTable(false);
  }

  function formValuesFromRecord(record) {
    var data = record && record.data && typeof record.data === 'object' ? record.data : {};
    var values = JSON.parse(JSON.stringify(data));
    values.categoryId = Number((record && record.categoryId) || values.categoryId || 0);
    return values;
  }

  async function renderEditor(record) {
    await ensureAssets();
    var meta = await loadMeta();
    var categories = await loadCategories();
    var host = byId(ids.form);
    host.innerHTML = '<div class="managed-content-empty">' + t('loadingForm') + '</div>';
    state.form = await window.XForm.render(host, withManagedSystemFields(meta.schema || { title: 'Content', groups: [] }, categories), formValuesFromRecord(record), meta.fieldTypes || {}, {});
    setStatus('');
  }

  async function openEditor(id) {
    state.currentId = Number(id || 0);
    var title = state.currentId > 0 ? t('editTitle') : t('addTitle');
    var record = null;
    if (state.currentId > 0) {
      var response = await fetch('/admin/api/plugin/' + pluginXid + '/get?id=' + encodeURIComponent(state.currentId), { cache: 'no-store' });
      var result = await response.json();
      if (!result || !result.result) throw new Error((result && result.message) || t('recordLoadFailed'));
      record = result.data || {};
    }
    state.layerIndex = layer.open({
      title: title,
      type: 1,
      area: ['78%', '86%'],
      shadeClose: false,
      content: $('#' + ids.editor),
      success: function(layero){
        layero.addClass('managed-content-layer');
        renderEditor(record).catch(handleError);
      },
      end: function(){ byId(ids.editor).style.display = 'none'; }
    });
  }

  async function saveRecord(asDraft) {
    if (!state.form) { layer.msg(t('formNotReady'), { icon: 2 }); return; }
    var check = state.form.validate ? state.form.validate() : { result: true };
    if (!check.result) { setStatus(check.message || t('validateFailed'), '#b91c1c'); return; }
    var values = state.form.collect ? state.form.collect() : {};
    var categoryId = Number(values.categoryId || 0);
    setStatus(t('saving'));
    var response = await fetch('/admin/api/plugin/' + pluginXid + '/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: state.currentId || 0, categoryId: categoryId, isDraft: !!asDraft, data: values })
    });
    var result = await response.json();
    if (!result || !result.result) throw new Error((result && result.message) || t('saveFailed'));
    layer.msg(asDraft ? t('draftSaved') : t('saved'), { icon: 1 });
    layer.close(state.layerIndex);
    reloadTable(false);
  }

  function deleteRecord(row) {
    var id = row && row.id;
    if (!id) return;
    layer.confirm(t('confirmDelete') + rowTitle(row) + t('confirmDeleteEnd'), { icon: 3, title: t('deleteConfirm') }, function(index){
      fetch('/admin/api/plugin/' + pluginXid + '/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      }).then(function(response){ return response.json(); }).then(function(result){
        if (!result || !result.result) throw new Error((result && result.message) || t('deleteFailed'));
        layer.msg(t('deleted'), { icon: 1 });
        reloadTable(false);
      }).catch(handleError);
      layer.close(index);
    });
  }

  function handleError(error) {
    var message = error && error.message ? error.message : String(error || t('failed'));
    layer.msg(message, { icon: 2 });
    setStatus(message, '#b91c1c');
  }

  table.render({
    elem: '#' + ids.table,
    toolbar: '#' + ids.toolbar,
    url: '/admin/api/plugin/' + pluginXid + (pageKind === 'drafts' ? '/drafts' : '/list'),
    method: 'get',
    where: { q: '', categoryId: '' },
    request: { pageName: 'page', limitName: 'limit' },
    parseData: function(result){
      return {
        code: result && result.result ? 0 : 1,
        msg: (result && result.message) || '',
        count: (result && result.count) || 0,
        data: (result && result.data) || []
      };
    },
    defaultToolbar: ['filter', 'exports', 'print'],
    height: 'full-135',
    cellMinWidth: 80,
    skin: 'line',
    page: {
      limit: 20,
      groups: 11,
      layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip']
    },
    cols: [[
      { field: 'id', width: 80, title: 'ID' },
      { title: t('title'), minWidth: 220, templet: function(d){ return '<code>' + escapeHtml(rowTitle(d)) + '</code>'; } },
      { title: t('status'), width: 100, templet: statusTemplate },
      { field: 'categoryId', width: 150, title: '\u680f\u76ee', templet: function(d){ return escapeHtml(categoryTitle(d.categoryId)); } },
      { field: 'summary', minWidth: 220, title: t('summary'), templet: function(d){ return escapeHtml(d.summary || '-'); } },
      { field: 'createTimeText', width: 170, title: t('createTime') },
      { field: 'updateTimeText', width: 170, title: t('updateTime') },
      { width: 140, title: t('operation'), fixed: 'right', templet: '#' + ids.tool }
    ]]
  });

  table.on('toolbar(' + ids.table + ')', function(obj){
    switch (obj.event) {
      case 'Search_Content_MakePlugin_cms_article_Drafts':
        reloadTable(true);
        break;
      case 'Refresh_Content_MakePlugin_cms_article_Drafts':
        reloadTable(false);
        break;
      case 'Add_Content_MakePlugin_cms_article_Drafts':
        openEditor(0).catch(handleError);
        break;
    }
  });

  table.on('tool(' + ids.table + ')', function(obj){
    if (obj.event === 'edit') {
      openEditor((obj.data || {}).id).catch(handleError);
    } else if (obj.event === 'delete') {
      deleteRecord(obj.data || {});
    }
  });

  byId(ids.save).onclick = function(){ saveRecord(false).catch(handleError); };
  byId(ids.saveDraft).onclick = function(){ saveRecord(true).catch(handleError); };
  byId(ids.cancel).onclick = function(){ layer.close(state.layerIndex); };
  byId(ids.search).addEventListener('keydown', function(event){
    if (event.key === 'Enter') reloadTable(true);
  });
  byId(ids.category).addEventListener('change', function(){ reloadTable(true); });
  renderCategoryFilter().catch(handleError);
});
</script>
