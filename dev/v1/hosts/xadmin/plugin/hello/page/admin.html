<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>Hello Plugin</title>
	<link rel="stylesheet" href="/plugin-static/hello/css/admin.css">
</head>
<body>
	<div class="hello-plugin-page">
		<h1>Hello Plugin</h1>
		<p>This page is loaded from the plugin page directory.</p>
		<button class="layui-btn" onclick="helloPluginTest()">Call API</button>
		<pre id="hello_plugin_result"></pre>
	</div>
	<script>
	function helloPluginTest() {
		fetch('/api/plugin/hello/greeting')
			.then(function(resp) { return resp.json(); })
			.then(function(data) {
				document.getElementById('hello_plugin_result').innerText = JSON.stringify(data, null, 2);
			});
	}
	</script>
</body>
</html>
