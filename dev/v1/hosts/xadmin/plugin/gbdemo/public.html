<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message Board</title>
  <style>
    body{margin:0;background:#fafaf9;color:#1c1917;font-family:"Segoe UI",system-ui,sans-serif}
    .shell{max-width:1080px;margin:0 auto;padding:36px 18px 72px}
    .hero{background:linear-gradient(135deg,#0f172a,#1e3a5f);border-radius:24px;padding:32px;box-shadow:0 20px 50px rgba(15,23,42,.25);margin-bottom:24px}
    .hero h1{margin:0 0 8px;font-size:34px;color:#f8fafc}
    .hero p{margin:0;color:#94a3b8;line-height:1.6}
    .layout{display:grid;grid-template-columns:360px 1fr;gap:24px}
    .panel{background:#fff;border:1px solid #e7e5e4;border-radius:20px;box-shadow:0 12px 32px rgba(0,0,0,.04)}
    .panel.pad{padding:24px}
    .sec-title{font-size:20px;font-weight:700;margin:0 0 16px}
    label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#57534e}
    input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #d6d3d1;border-radius:12px;padding:10px 12px;font:inherit;background:#fff;color:#1c1917}
    textarea{min-height:120px;resize:vertical}
    select{cursor:pointer;appearance:auto}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
    .hint{font-size:13px;color:#78716c}
    .status{min-height:18px;font-size:13px;margin-top:12px;color:#0f172a}
    .btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;transition:.15s}
    .btn-dark{background:#1c1917;color:#fafaf9}
    .btn-amber{background:#f59e0b;color:#1c1917}
    .btn:hover{transform:translateY(-1px)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
    .pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#f5f5f4;color:#57534e;font-size:12px;font-weight:700}
    .cat-pill{display:inline-flex;padding:4px 10px;border-radius:999px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:600;margin-right:6px;margin-bottom:6px}
    .item{padding:16px 0;border-top:1px solid #f5f5f4}
    .item:first-child{border-top:0;padding-top:0}
    .item-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px;font-size:13px;color:#78716c}
    .item-meta strong{color:#1c1917;font-size:15px}
    .item-content{white-space:pre-wrap;line-height:1.7;color:#292524}
    .item-actions{display:flex;gap:8px;margin-top:10px}
    .like-btn{border:1px solid #e7e5e4;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;background:#fff;color:#57534e;transition:.15s}
    .like-btn:hover{background:#fef2f2;color:#dc2626;border-color:#fecaca}
    .like-btn.liked{background:#fef2f2;color:#dc2626;border-color:#fecaca}
    .reply-box{margin-top:12px;padding:14px 16px;border-radius:14px;background:#f5f5f4;border:1px solid #e7e5e4}
    .reply-head{font-size:12px;font-weight:700;color:#78716c;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
    .reply-time{margin-top:6px;font-size:12px;color:#a8a29e}
    .thread-indicator{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#0f172a;background:#e0f2fe;border-radius:999px;padding:3px 8px;margin-bottom:6px}
    .empty{padding:36px 0;text-align:center;color:#a8a29e}
    .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid #f5f5f4}
    .pager-info{font-size:13px;color:#78716c}
    .pager-actions{display:flex;gap:10px}
    .cat-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
    .cat-btn{border:1px solid #e7e5e4;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;background:#fff;color:#57534e;transition:.15s}
    .cat-btn.active{background:#1c1917;color:#fafaf9;border-color:#1c1917}
    .cat-btn:hover{background:#f5f5f4}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.hero h1{font-size:28px}}
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <h1 id="gb_title">Message Board</h1>
      <p id="gb_intro">Loading...</p>
    </section>
    <section class="layout">
      <aside class="panel pad">
        <div class="sec-title">Post a message</div>
        <label for="gb_name">Nickname</label>
        <input id="gb_name" maxlength="32" placeholder="Your name">
        <div style="height:10px"></div>
        <label for="gb_category">Category</label>
        <select id="gb_category"></select>
        <div style="height:10px"></div>
        <label for="gb_content">Message</label>
        <textarea id="gb_content" maxlength="500" placeholder="Write something..."></textarea>
        <div class="row">
          <div class="hint" id="gb_counter">0 / 500</div>
          <button class="btn btn-dark" id="gb_submit" onclick="gbSubmit()">Post</button>
        </div>
        <div class="hint" id="gb_policy" style="margin-top:10px"></div>
        <div class="status" id="gb_status"></div>
      </aside>
      <section class="panel pad">
        <div class="toolbar">
          <div class="sec-title" style="margin:0">Messages</div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="pill" id="gb_total">0 total</span>
            <button class="btn btn-amber" onclick="gbLoad(gb.page)">Refresh</button>
          </div>
        </div>
        <div class="cat-filter" id="gb_cats"></div>
        <div id="gb_list"><div class="empty">Loading...</div></div>
        <div class="pager">
          <div class="pager-info" id="gb_pager">Page 1</div>
          <div class="pager-actions">
            <button class="btn btn-amber" id="gb_prev" onclick="gbPrev()">Prev</button>
            <button class="btn btn-amber" id="gb_next" onclick="gbNext()">Next</button>
          </div>
        </div>
      </section>
    </section>
  </div>
  <script>
    const gb = {page:1,total:0,pageSize:15,maxContent:500,maxNick:32,allowReactions:true,requireApproval:false,categories:[],filterCategory:""};
    function gbEsc(v){return String(v||"").replace(/[&<>"']/g,c=>c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c==='"'?"&quot;":"&#39;")}
    function gbStatus(msg,color){const el=document.getElementById("gb_status");el.style.color=color||"#0f172a";el.innerText=msg||""}
    function gbUpdateCounter(){const a=document.getElementById("gb_content");document.getElementById("gb_counter").innerText=`${(a.value||"").length} / ${gb.maxContent||500}`}
    function gbRenderCats(){
      const el=document.getElementById("gb_cats");
      let html=`<button class="cat-btn ${gb.filterCategory===""?"active":""}" onclick="gbFilterCat('')">All</button>`;
      gb.categories.forEach(c=>{html+=`<button class="cat-btn ${gb.filterCategory===c?"active":""}" onclick="gbFilterCat('${gbEsc(c)}')">${gbEsc(c)}</button>`});
      el.innerHTML=html;
    }
    function gbFilterCat(c){gb.filterCategory=c;gb.page=1;gbLoad(1)}
    function gbRender(payload){
      const list=document.getElementById("gb_list");
      const items=(payload&&payload.data)||[];
      gb.page=(payload&&payload.page)||1;
      gb.pageSize=(payload&&payload.pageSize)||gb.pageSize;
      gb.total=(payload&&payload.total)||0;
      document.getElementById("gb_total").innerText=`${gb.total} total`;
      document.getElementById("gb_pager").innerText=`Page ${gb.page} / ${Math.max(1,Math.ceil(gb.total/gb.pageSize))}`;
      document.getElementById("gb_prev").disabled=gb.page<=1;
      document.getElementById("gb_next").disabled=gb.page*gb.pageSize>=gb.total;
      if(!items.length){list.innerHTML="<div class='empty'>No messages yet.</div>";return}
      list.innerHTML=items.map(item=>{
        const reply=item.reply?`<div class="reply-box"><div class="reply-head">Admin Reply</div><div style="white-space:pre-wrap;line-height:1.6">${gbEsc(item.reply)}</div><div class="reply-time">${gbEsc(item.replyTimeText||"")}</div></div>`:"";
        const thread=item.parentId>0?`<div class="thread-indicator">&#x21A9;&#xFE0F; Reply to #${item.parentId}</div>`:"";
        const cat=item.category?`<span class="cat-pill">${gbEsc(item.category)}</span>`:"";
        const likes=gb.allowReactions?`<div class="item-actions"><button class="like-btn" onclick="gbLike(${item.id})">&#x2764;&#xFE0F; ${item.likes||0}</button></div>`:"";
        return `<article class="item">${thread}<div class="item-meta"><div><strong>${gbEsc(item.nickname)}</strong> ${cat}<br><span>${gbEsc(item.createTimeText||"")}</span></div></div><div class="item-content">${gbEsc(item.content)}</div>${likes}${reply}</article>`;
      }).join("");
    }
    function gbLoad(page){
      const cat=gb.filterCategory?`&category=${encodeURIComponent(gb.filterCategory)}`:"";
      fetch(`/api/plugin/gbdemo/list?page=${encodeURIComponent(page||1)}&limit=${encodeURIComponent(gb.pageSize||15)}${cat}`)
        .then(r=>r.json()).then(data=>{if(!data.result)throw new Error(data.message||"Load failed");gbRender(data)})
        .catch(err=>gbStatus(err&&err.message?err.message:"Load failed","#dc2626"));
    }
    function gbPrev(){if(gb.page>1)gbLoad(gb.page-1)}
    function gbNext(){if(gb.page*gb.pageSize<gb.total)gbLoad(gb.page+1)}
    function gbLike(id){
      fetch("/api/plugin/gbdemo/like",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})})
        .then(r=>r.json()).then(data=>{if(data.result)gbLoad(gb.page)})
        .catch(()=>{});
    }
    function gbSubmit(){
      const btn=document.getElementById("gb_submit");
      const body={nickname:document.getElementById("gb_name").value,content:document.getElementById("gb_content").value,category:document.getElementById("gb_category").value};
      btn.disabled=true;gbStatus("Posting...");
      fetch("/api/plugin/gbdemo/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
        .then(r=>r.json()).then(data=>{
          if(!data.result)throw new Error(data.message||"Post failed");
          document.getElementById("gb_content").value="";gbUpdateCounter();
          gbStatus(data.message||"Posted.");
          if(!gb.requireApproval)gbLoad(1);
        }).catch(err=>gbStatus(err&&err.message?err.message:"Post failed","#dc2626"))
        .finally(()=>{btn.disabled=false});
    }
    function gbLoadMeta(){
      fetch("/api/plugin/gbdemo/meta").then(r=>r.json()).then(data=>{
        if(!data.result||!data.data)throw new Error("Meta failed");
        const d=data.data;
        gb.pageSize=d.pageSize||15;gb.maxContent=d.maxContentLength||500;gb.maxNick=d.maxNicknameLength||32;
        gb.allowReactions=!!d.allowReactions;gb.requireApproval=!!d.requireApproval;
        document.getElementById("gb_title").innerText=d.title||"Message Board";
        document.getElementById("gb_intro").innerText=d.subtitle||"";
        document.getElementById("gb_content").maxLength=gb.maxContent;
        document.getElementById("gb_name").maxLength=gb.maxNick;
        document.getElementById("gb_policy").innerText=gb.requireApproval?"Messages require admin approval.":"Messages appear immediately.";
        if(d.categories){
          gb.categories=d.categories.split(",").map(s=>s.trim()).filter(Boolean);
          const sel=document.getElementById("gb_category");
          sel.innerHTML=gb.categories.map(c=>`<option value="${gbEsc(c)}">${gbEsc(c)}</option>`).join("");
        }
        gbUpdateCounter();gbRenderCats();gbLoad(1);
      }).catch(err=>gbStatus(err&&err.message?err.message:"Meta failed","#dc2626"));
    }
    document.getElementById("gb_content").addEventListener("input",gbUpdateCounter);
    gbUpdateCounter();gbLoadMeta();
  </script>
</body>
</html>
