<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>添加用户</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="/layui/css/layui.css" rel="stylesheet">
</head>
<body>
	<form class="layui-form" style="padding: 20px; min-height: calc(100vh - 40px); display: flex; flex-direction: column;" lay-filter="UserAddForm">
		<div class="layui-form-item">
			<label class="layui-form-label">用户名</label>
			<div class="layui-input-block">
				<input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">密码</label>
			<div class="layui-input-block">
				<input type="password" name="password" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">所属角色</label>
			<div class="layui-input-block">
				<select name="role" lay-verify="required">
					<option value="">请选择角色</option>
					{*RoleComboListItem:roleList}
				</select>
			</div>
		</div>
		<div class="layui-form-item">
			<label class="layui-form-label">权限级别 <i class="layui-icon layui-icon-tips" lay-tips="该字段与角色管理中的字段用途相同，使用其中更高的作为最终权限级别" style="color: #1E9FFF; cursor: help;"></i></label>
			<div class="layui-input-block">
				<input type="number" name="authLevel" value="0" placeholder="请输入权限级别（0-999）" autocomplete="off" class="layui-input">
			</div>
		</div>
		<div style="flex: 1;"></div>
		<div class="layui-form-item" style="text-align: right; margin-bottom: 0;">
			<button class="layui-btn" lay-submit lay-filter="submit">保存</button>
			<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
		</div>
	</form>
	<script src="/layui/layui.js"></script>
	<script>
		// SHA-256 哈希函数（使用 Web Crypto API）
		async function sha256(message) {{
			const msgBuffer = new TextEncoder().encode(message);
			const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
			const hashArray = Array.from(new Uint8Array(hashBuffer));
			const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
			return hashHex;
		}
		
		layui.use('form', function(){{
			var form = layui.form;
			var layer = layui.layer;
			
			// 渲染表单
			form.render();
			
			// 启用提示功能
			$(document).on('mouseenter', '[lay-tips]', function(){{
				var tips = $(this).attr('lay-tips');
				if(tips){{
					layer.tips(tips, this, {{
						tips: [1, '#333'],
						time: 3000
					});
				}
			}).on('mouseleave', '[lay-tips]', function(){{
				// 补充：鼠标离开时关闭气泡，避免多个气泡残留
				layer.closeAll('tips');
			});
			
			// 取消按钮
			document.getElementById('btnCancel').onclick = function(){{
				var index = parent.layer.getFrameIndex(window.name);
				parent.layer.close(index);
			};
			
			// 提交事件
			form.on('submit(submit)', async function(data){{
				var field = data.field;
				
				// 计算密码的 SHA-256 哈希值（客户端加盐：用户名 + "_xywhsoft_" + 密码）
				const pwdHash = await sha256(field.username + '_xywhsoft_' + field.password);
				
				// 构建提交数据（传输哈希值而非明文）
				var submitData = {{
					username: field.username,
					password: pwdHash,
					role: parseInt(field.role),
					authLevel: parseInt(field.authLevel) || 0
				};
				
				// 提交请求
				fetch('/auth/user', {{
					method: 'POST',
					headers: {{
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(submitData),
				})
				.then(response => response.json())
				.then(data => {{
					if ( data.result ) {{
						layer.msg(data.message, {{icon: 1});
						// 刷新父窗口列表
						parent.layui.table.reloadData('Table_Auth_User');
						// 关闭当前弹窗
						var index = parent.layer.getFrameIndex(window.name);
						parent.layer.close(index);
					} else {{
						layer.msg('请求服务报错：' + data.message, {{icon: 2});
					}
				})
				.catch(error => {{
					layer.msg('请求出错，请查看开发者工具检查原因', {{icon: 2});
					console.error('Error:', error);
				});
				
				// 阻止默认 form 跳转
				return false;
			});
		});
	</script>
</body>
</html>
{#define:RoleComboListItem}<option value="{$id}">{$name}</option>{#end}
