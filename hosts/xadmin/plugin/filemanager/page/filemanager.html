<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Manager</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <style>
html, body { width: 100%; height: 100vh; overflow: hidden; margin: 0; padding: 0; }
.LayoutRoot { width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.LayoutAddr { width: 100%; height: 38px; display: flex; }
.LayoutTool { width: 100%; height: 38px; flex-grow: 1; }
.LayoutList { width: 100%; height: calc(100vh - 98px); }
.LayoutInfo { width: 100%; height: 22px; background-color: #f2f2f2; border-top: 1px solid #e6e6e6; }
.AddrButton { width: 38px !important; cursor: pointer; }
.AddrButton:hover { background-color: #f2f2f2; }
.AddrBreadcrumb { display: block; position: absolute; left: 10px; top: 8px; }
.ToolBtns { margin-left: 10px !important; margin-right: 10px !important; }
.layui-table-cell { text-align: center; height: 32px; line-height: 32px; padding: 0; }
.layui-unselect { height: 32px; }
.layui-form-switch { height: 24px; min-width: 38px; }

/* Breadcrumb */
.AddrBreadcrumb span { font-size: 13px; }
.AddrBreadcrumb a { color: #1e9fff; text-decoration: none; font-size: 13px; }
.AddrBreadcrumb a:hover { text-decoration: underline; }
.AddrBreadcrumb cite { font-size: 13px; color: #999; }

/* Address edit input */
#AddrEdit { font-size: 13px; }

/* File list container */
.file-list-container { width: 100%; height: 100%; overflow: hidden; }
.file-list-container .layui-table-view { margin: 0; }
.file-list-container .layui-table-box { border: none; }
.file-list-container .layui-table th { background: #f8f8f8; font-weight: 600; }
.file-list-container .layui-table td { padding: 0; }
.file-list-container .layui-table-main { overflow-x: hidden; }

/* Table row hover */
.file-list-container .layui-table-hover { background-color: #f2f8ff !important; }

/* Scrollbar */
.file-list-container .layui-table-main::-webkit-scrollbar { width: 8px; }
.file-list-container .layui-table-main::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
.file-list-container .layui-table-main::-webkit-scrollbar-track { background: #f1f1f1; }

/* File type icons */
.file-icon { display: inline-block; width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 16px; vertical-align: middle; margin-right: 4px; }
.file-icon.folder { color: #ffb800; }
.file-icon.image { color: #1e9fff; }
.file-icon.text { color: #00b578; }
.file-icon.archive { color: #ff5722; }
.file-icon.code { color: #7c4dff; }
.file-icon.video { color: #e91e63; }
.file-icon.audio { color: #ff9800; }
.file-icon.default { color: #999; }

/* Thumbnail in table */
.file-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 2px; vertical-align: middle; }

/* Status bar */
.status-bar { padding: 0 10px; height: 22px; line-height: 22px; font-size: 12px; color: #666; overflow: hidden; white-space: nowrap; }

/* Context menu */
#contextMenu { position: absolute; background: #fff; border: 1px solid #e6e6e6; box-shadow: 0 2px 4px rgba(0,0,0,.12); z-index: 9999; min-width: 120px; border-radius: 2px; }
#contextMenu ul { margin: 0; padding: 0; list-style: none; }
#contextMenu li { margin: 0; padding: 0; }
#contextMenu li a { display: block; padding: 6px 15px; font-size: 13px; color: #333; text-decoration: none; white-space: nowrap; }
#contextMenu li a:hover { background: #f2f2f2; color: #1e9fff; }
#contextMenu .layui-nav-divider { height: 1px; background: #e6e6e6; margin: 2px 0; }

/* Upload dialog */
.upload-dialog { padding: 20px; }
.upload-drag-area { border: 2px dashed #e6e6e6; border-radius: 6px; padding: 30px; text-align: center; cursor: pointer; transition: border-color 0.3s; margin: 10px 0; }
.upload-drag-area:hover, .upload-drag-area.drag-over { border-color: #1e9fff; }
.upload-drag-area .layui-icon { font-size: 48px; color: #1e9fff; }
.upload-drag-area p { margin: 10px 0 0; color: #999; font-size: 13px; }
.upload-file-list { margin-top: 10px; max-height: 200px; overflow-y: auto; }
.upload-file-item { display: flex; align-items: center; padding: 5px 10px; border-bottom: 1px solid #f2f2f2; font-size: 13px; }
.upload-file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upload-file-item .file-size { color: #999; margin-left: 10px; }
.upload-file-item .file-remove { color: #ff5722; cursor: pointer; margin-left: 10px; }

/* New dialog */
.new-dialog { padding: 20px; }
.new-dialog .layui-form-label { width: 80px; }
.new-dialog .layui-input-block { margin-left: 110px; }

/* Compress dialog */
.compress-dialog { padding: 20px; }
.compress-dialog .layui-form-label { width: 80px; }
.compress-dialog .layui-input-block { margin-left: 110px; }

/* Extract dialog */
.extract-dialog { padding: 20px; }
.extract-dialog .layui-form-label { width: 80px; }
.extract-dialog .layui-input-block { margin-left: 110px; }

/* File editor */
.edit-dialog-container { display: flex; flex-direction: column; height: 100%; }
.edit-toolbar { display: flex; align-items: center; padding: 6px 10px; background: #f8f8f8; border-bottom: 1px solid #e6e6e6; flex-shrink: 0; gap: 6px; }
.edit-toolbar .edit-title { flex: 1; font-size: 13px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edit-toolbar .edit-info { font-size: 12px; color: #999; margin-left: 10px; }
.edit-search-box { display: none; align-items: center; padding: 4px 10px; background: #fff; border-bottom: 1px solid #e6e6e6; flex-shrink: 0; }
.edit-search-box.active { display: flex; }
.edit-search-box input { flex: 1; height: 28px; border: 1px solid #e6e6e6; border-radius: 2px; padding: 0 8px; font-size: 13px; outline: none; }
.edit-search-box input:focus { border-color: #1e9fff; }
.edit-search-box .search-info { font-size: 12px; color: #999; margin-left: 8px; white-space: nowrap; }
.edit-body { flex: 1; display: flex; overflow: hidden; position: relative; }
.line-numbers { width: 50px; background: #f8f8f8; border-right: 1px solid #e6e6e6; overflow: hidden; font-family: Consolas, Monaco, 'Courier New', monospace; font-size: 13px; line-height: 20px; color: #999; text-align: right; padding: 10px 8px 10px 0; user-select: none; flex-shrink: 0; }
.edit-textarea { flex: 1; border: none; outline: none; resize: none; font-family: Consolas, Monaco, 'Courier New', monospace; font-size: 13px; line-height: 20px; padding: 10px; tab-size: 4; white-space: pre; overflow: auto; }
.edit-status-bar { height: 24px; display: flex; align-items: center; padding: 0 10px; background: #f8f8f8; border-top: 1px solid #e6e6e6; font-size: 12px; color: #999; flex-shrink: 0; }
.edit-status-bar span { margin-right: 15px; }

/* Image viewer */
.image-viewer-container { display: flex; flex-direction: column; height: 100%; background: #1a1a1a; }
.image-viewer-toolbar { display: flex; align-items: center; justify-content: center; padding: 8px; background: #2d2d2d; flex-shrink: 0; gap: 8px; }
.image-viewer-toolbar button { background: #3d3d3d; color: #fff; border: 1px solid #555; border-radius: 3px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.image-viewer-toolbar button:hover { background: #4d4d4d; }
.image-viewer-toolbar .image-name { color: #ccc; font-size: 13px; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.image-viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 10px; }
.image-viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s; }

/* Toolbar buttons */
.LayoutTool .layui-btn { height: 32px; line-height: 32px; padding: 0 12px; font-size: 13px; }
.LayoutTool .layui-btn i { margin-right: 3px; }

/* Selected row highlight */
.layui-table-click { background-color: #e8f4ff !important; }

/* Toolbar disabled state */
.toolbar-disabled { opacity: 0.5; pointer-events: none; }

/* Layer dialog overrides for file manager */
.fm-dialog .layui-layer-title { font-size: 14px; }
.fm-dialog .layui-layer-content { overflow: hidden; }

/* New menu dropdown */
#NewMenu { position: absolute; top: 100%; left: 0; z-index: 999; display: none; min-width: 120px; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.12); border-radius: 2px; }
#NewMenu a { display: block; padding: 8px 15px; font-size: 13px; color: #333; text-decoration: none; white-space: nowrap; }
#NewMenu a:hover { background: #f2f2f2; color: #1e9fff; }

/* Checkbox column alignment */
.layui-table-cell .layui-form-checkbox { margin: 0; }
.layui-table-cell .layui-form-checkbox i { height: 24px; line-height: 24px; }
    </style>
</head>
<body>

        <div class="layui-clear-space">

    <script src="/static/layui/layui.js"></script>
    <script>
    var currentPath = "";
    var clipboard = null;
    var selectedItems = [];
    var tableIns = null;

    function formatFileSize(bytes) {
        if (bytes === undefined || bytes === null) return '0 B';
        if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
        if (bytes >= 1048576) return (bytes / 1048576).toFixed(2) + ' MB';
        if (bytes >= 1024) return (bytes / 1024).toFixed(2) + ' KB';
        return bytes + ' B';
    }

    function getFileIconClass(ext) {
        if (!ext) return 'layui-icon-file';
        ext = ext.toLowerCase();
        var imageExts = ['jpg','jpeg','png','gif','bmp','webp','svg','ico'];
        var textExts = ['txt','md','log','ini','cfg','conf'];
        var codeExts = ['js','ts','html','css','json','xml','c','h','cpp','hpp','py','java','go','rs','vue','jsx','tsx','sh','bat','sql','yaml','yml'];
        var archiveExts = ['zip','rar','7z','tar','gz','bz2','xz','tgz'];
        var videoExts = ['mp4','avi','mkv','mov','wmv','flv','webm'];
        var audioExts = ['mp3','wav','flac','aac','ogg','wma','m4a'];
        if (imageExts.indexOf(ext) >= 0) return 'layui-icon-picture';
        if (textExts.indexOf(ext) >= 0) return 'layui-icon-file';
        if (codeExts.indexOf(ext) >= 0) return 'layui-icon-code-circle';
        if (archiveExts.indexOf(ext) >= 0) return 'layui-icon-release';
        if (videoExts.indexOf(ext) >= 0) return 'layui-icon-video';
        if (audioExts.indexOf(ext) >= 0) return 'layui-icon-headset';
        return 'layui-icon-file';
    }

    function updateBreadcrumb() {
        var html = '<a href="javascript:;" data-path="">根目录</a>';
        if (currentPath) {
            var parts = currentPath.split('/');
            var path = '';
            for (var i = 0; i < parts.length; i++) {
                if (i > 0) html += ' <span>&gt;</span> ';
                path += (i > 0 ? '/' : '') + parts[i];
                if (i < parts.length - 1) {
                    html += '<a href="javascript:;" data-path="' + path + '">' + parts[i] + '</a>';
                } else {
                    html += '<cite>' + parts[i] + '</cite>';
                }
            }
        }
        document.getElementById('AddrList').innerHTML = html;
        var links = document.getElementById('AddrList').querySelectorAll('a');
        for (var i = 0; i < links.length; i++) {
            links[i].addEventListener('click', function(e) {
                e.preventDefault();
                var p = this.getAttribute('data-path');
                currentPath = p || '';
                refreshFileList();
            });
        }
    }

    function refreshFileList() {
        updateBreadcrumb();
        document.getElementById('AddrEdit').value = currentPath;
        if (tableIns) {
            tableIns.reload({
                where: { path: currentPath },
                page: { curr: 1 }
            });
        }
        resetSelectedStats();
    }

    function resetSelectedStats() {
        selectedItems = [];
        updateSelectedStats();
        updateToolbarButtons();
    }

    function updateSelectedStats() {
        var dirs = 0, files = 0;
        for (var i = 0; i < selectedItems.length; i++) {
            if (selectedItems[i].isdir) dirs++;
            else files++;
        }
        document.getElementById('selectedStats').textContent = '已选中' + dirs + '个目录，' + files + '个文件';
    }

    function updateToolbarButtons() {
        var hasSelected = selectedItems.length > 0;
        var hasClipboard = clipboard !== null;
        var btns = ['CutBtn', 'CopyBtn', 'DeleteBtn', 'CompressBtn', 'ExtractBtn'];
        for (var i = 0; i < btns.length; i++) {
            var el = document.getElementById(btns[i]);
            if (hasSelected) el.classList.remove('toolbar-disabled');
            else el.classList.add('toolbar-disabled');
        }
        var pasteBtn = document.getElementById('PasteBtn');
        if (hasClipboard) pasteBtn.classList.remove('toolbar-disabled');
        else pasteBtn.classList.add('toolbar-disabled');
    }

    function submitNewPath(path) {
        currentPath = path.replace(/\\/g, '/').replace(/\/+/g, '/').replace(/^\//, '').replace(/\/$/, '');
        refreshFileList();
    }

    function deleteFiles(items) {
        if (!items || items.length === 0) return;
        layui.layer.confirm('确定要删除选中的 ' + items.length + ' 个项目吗？', { icon: 3, title: '确认删除' }, function(idx) {
            layui.layer.close(idx);
            var body = JSON.stringify({
                folderPath: currentPath,
                items: items.map(function(it) { return { name: it.name, isdir: it.isdir ? 1 : 0 }; })
            });
            fetch('/admin/api/plugin/filemanager/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: body
            }).then(function(r) { return r.json(); }).then(function(data) {
                if (data.result) {
                    refreshFileList();
                    layui.layer.msg('删除成功', { icon: 1 });
                } else {
                    layui.layer.msg(data.message || '删除失败', { icon: 2 });
                }
            }).catch(function(err) {
                layui.layer.msg('请求失败: ' + err.message, { icon: 2 });
            });
        });
    }

    function navigateUp() {
        if (!currentPath) return;
        var parts = currentPath.split('/');
        parts.pop();
        currentPath = parts.join('/');
        refreshFileList();
    }

    function refreshCurrent() {
        refreshFileList();
    }

    function isImageFile(ext) {
        if (!ext) return false;
        return ['jpg','jpeg','png','gif','bmp','webp','svg','ico'].indexOf(ext.toLowerCase()) >= 0;
    }

    function isEditableFile(ext) {
        if (!ext) return true;
        ext = ext.toLowerCase();
        var editables = ['txt','md','log','ini','cfg','conf','json','xml','html','css','js','ts','c','h','cpp','hpp','py','java','go','rs','vue','jsx','tsx','sh','bat','sql','yaml','yml','csv','toml','env','gitignore','dockerfile','makefile','cmake','gradle','properties'];
        return editables.indexOf(ext) >= 0;
    }

    function isArchiveFile(ext) {
        if (!ext) return false;
        return ['zip','rar','7z','tar','gz','bz2','xz','tgz'].indexOf(ext.toLowerCase()) >= 0;
    }

    function showContextMenu(x, y, type, rowData) {
        var menu = document.getElementById('contextMenu');
        var blankItems = menu.querySelectorAll('.blank-menu');
        var fileItems = menu.querySelectorAll('.file-menu');
        var i;
        if (type === 'blank') {
            for (i = 0; i < blankItems.length; i++) blankItems[i].style.display = '';
            for (i = 0; i < fileItems.length; i++) fileItems[i].style.display = 'none';
            var hasClip = clipboard !== null;
            document.getElementById('menuPasteItem').style.display = hasClip ? '' : 'none';
        } else {
            for (i = 0; i < blankItems.length; i++) blankItems[i].style.display = 'none';
            for (i = 0; i < fileItems.length; i++) fileItems[i].style.display = '';
            if (rowData) {
                document.getElementById('menuEdit').style.display = rowData.isdir ? 'none' : '';
                document.getElementById('menuViewImage').style.display = (!rowData.isdir && isImageFile(rowData.ext)) ? '' : 'none';
                document.getElementById('menuCompress').style.display = '';
                document.getElementById('menuExtract').style.display = (!rowData.isdir && isArchiveFile(rowData.ext)) ? '' : 'none';
            }
        }
        menu.classList.remove('layui-hide');
        var menuW = menu.offsetWidth;
        var menuH = menu.offsetHeight;
        if (x + menuW > window.innerWidth) x = window.innerWidth - menuW - 5;
        if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 5;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    }

    function hideContextMenu() {
        document.getElementById('contextMenu').classList.add('layui-hide');
    }

    function showUploadDialog() {
        var uploadPath = currentPath;
        var content = '<div class="upload-dialog">' +
            '<div class="upload-drag-area" id="uploadDragArea">' +
            '<i class="layui-icon layui-icon-upload-drag"></i>' +
            '<p>将文件拖拽到此处，或点击选择文件</p>' +
            '</div>' +
            '<input type="file" id="uploadFileInput" multiple style="display:none;">' +
            '<div class="upload-file-list" id="uploadFileList"></div>' +
            '<div style="margin-top:15px;text-align:right;">' +
            '<button type="button" class="layui-btn layui-btn-primary" id="uploadClearBtn">清空列表</button> ' +
            '<button type="button" class="layui-btn" id="uploadStartBtn" disabled>开始上传</button>' +
            '</div>' +
            '</div>';

        var layerIdx = layui.layer.open({
            type: 1,
            title: '上传文件 - ' + (uploadPath || '根目录'),
            area: ['500px', '400px'],
            content: content,
            btn: false
        });

        var pendingFiles = [];

        function updateFileListDisplay() {
            var html = '';
            for (var i = 0; i < pendingFiles.length; i++) {
                html += '<div class="upload-file-item" data-index="' + i + '">' +
                    '<span class="file-name">' + pendingFiles[i].name + '</span>' +
                    '<span class="file-size">' + formatFileSize(pendingFiles[i].size) + '</span>' +
                    '<span class="file-remove" data-index="' + i + '">&times;</span>' +
                    '</div>';
            }
            document.getElementById('uploadFileList').innerHTML = html;
            var startBtn = document.getElementById('uploadStartBtn');
            startBtn.disabled = pendingFiles.length === 0;

            var removeBtns = document.querySelectorAll('.file-remove');
            for (var j = 0; j < removeBtns.length; j++) {
                removeBtns[j].addEventListener('click', function() {
                    var idx = parseInt(this.getAttribute('data-index'));
                    pendingFiles.splice(idx, 1);
                    updateFileListDisplay();
                });
            }
        }

        var dragArea = document.getElementById('uploadDragArea');
        var fileInput = document.getElementById('uploadFileInput');

        dragArea.addEventListener('click', function() { fileInput.click(); });

        dragArea.addEventListener('dragover', function(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        });
        dragArea.addEventListener('dragleave', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
        });
        dragArea.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            var files = e.dataTransfer.files;
            for (var i = 0; i < files.length; i++) {
                pendingFiles.push(files[i]);
            }
            updateFileListDisplay();
        });

        fileInput.addEventListener('change', function() {
            for (var i = 0; i < this.files.length; i++) {
                pendingFiles.push(this.files[i]);
            }
            this.value = '';
            updateFileListDisplay();
        });

        document.getElementById('uploadClearBtn').addEventListener('click', function() {
            pendingFiles = [];
            updateFileListDisplay();
        });

        document.getElementById('uploadStartBtn').addEventListener('click', function() {
            if (pendingFiles.length === 0) return;
            var btn = this;
            btn.disabled = true;
            btn.textContent = '上传中...';
            var completed = 0;
            var failed = 0;

            function uploadNext() {
                if (pendingFiles.length === 0) {
                    btn.textContent = '上传完成';
                    refreshFileList();
                    if (failed > 0) {
                        layui.layer.msg('上传完成，' + failed + '个文件失败', { icon: 2 });
                    } else {
                        layui.layer.msg('上传完成', { icon: 1 });
                    }
                    setTimeout(function() { layui.layer.close(layerIdx); }, 1000);
                    return;
                }
                var file = pendingFiles.shift();
                var formData = new FormData();
                formData.append('file', file);
                fetch('/admin/api/plugin/filemanager/upload?path=' + encodeURIComponent(uploadPath), {
                    method: 'POST',
                    body: formData
                }).then(function(r) { return r.json(); }).then(function(data) {
                    completed++;
                    updateFileListDisplay();
                    uploadNext();
                }).catch(function(err) {
                    failed++;
                    completed++;
                    updateFileListDisplay();
                    uploadNext();
                });
            }
            uploadNext();
        });
    }

    function showEditor(filePath, content) {
        var fileName = filePath.split('/').pop();

        }

            '<button class="layui-btn layui-btn-xs layui-btn-primary" id="editorSearchBtn"><i class="layui-icon layui-icon-search"></i> 搜索</button> ' +
            '<span class="edit-info">Ctrl+S 保存</span>' +
            '</div>' +
            '<div class="edit-search-box" id="editorSearchBox">' +
            '<input type="text" id="editorSearchInput" placeholder="搜索内容...">' +
            '<span class="search-info" id="editorSearchInfo"></span>' +
            '</div>' +
            '<div class="edit-body">' +
            '<pre class="line-numbers" id="editorLineNumbers">' + lineNumHtml + '</pre>' +
            '<textarea class="edit-textarea" id="editorTextarea" spellcheck="false">' + escapeHtml(content) + '</textarea>' +
            '</div>' +
            '<div class="edit-status-bar">' +
            '<span id="editorCursorInfo">行 1, 列 1</span>' +
            '<span id="editorLineInfo">共 ' + lineCount + ' 行</span>' +
            '</div>' +
            '</div>';

        var editorIdx = layui.layer.open({
            type: 1,
            title: '编辑文件 - ' + fileName,
            area: ['800px', '600px'],
            content: html,
            btn: false,
            maxmin: true
        });

        var textarea = document.getElementById('editorTextarea');
        var lineNumbers = document.getElementById('editorLineNumbers');

        function updateLineNumbers() {
            var txt = textarea.value;
            var count = txt.split('\n').length;
            var nums = '';
            for (var i = 1; i <= count; i++) nums += i + '\n';
            lineNumbers.textContent = nums;
        }

        textarea.addEventListener('scroll', function() {
            lineNumbers.scrollTop = textarea.scrollTop;
        });

        textarea.addEventListener('input', function() {
            updateLineNumbers();
            updateCursorInfo();
        });

        textarea.addEventListener('click', updateCursorInfo);
        textarea.addEventListener('keyup', updateCursorInfo);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                var start = this.selectionStart;
                var end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 1;
                updateLineNumbers();
            }
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveEditorContent(filePath);
            }
        });

        function updateCursorInfo() {
            var txt = textarea.value.substring(0, textarea.selectionStart);
            var lines = txt.split('\n');
            var line = lines.length;
            var col = lines[lines.length - 1].length + 1;
            document.getElementById('editorCursorInfo').textContent = '行 ' + line + ', 列 ' + col;
            document.getElementById('editorLineInfo').textContent = '共 ' + textarea.value.split('\n').length + ' 行';
        }

        document.getElementById('editorSaveBtn').addEventListener('click', function() {
            saveEditorContent(filePath);
        });

        document.getElementById('editorSearchBtn').addEventListener('click', function() {
            var box = document.getElementById('editorSearchBox');
            box.classList.toggle('active');
            if (box.classList.contains('active')) {
                document.getElementById('editorSearchInput').focus();
            }
        });

        document.getElementById('editorSearchInput').addEventListener('input', function() {
            var keyword = this.value;
            var info = document.getElementById('editorSearchInfo');
            if (!keyword) {
                info.textContent = '';
                return;
            }
            var text = textarea.value;
            var idx = text.indexOf(keyword);
            if (idx >= 0) {
                var count = 0;
                var pos = 0;
                while ((pos = text.indexOf(keyword, pos)) !== -1) {
                    count++;
                    pos += keyword.length;
                }
                info.textContent = '找到 ' + count + ' 处';
                textarea.focus();
                textarea.setSelectionRange(idx, idx + keyword.length);
            } else {
                info.textContent = '未找到';
            }
        });

        textarea.focus();
    }

    function initFileManager() {
        layui.use(['table', 'form', 'layer', 'element'], function() {
            var table = layui.table;
            var form = layui.form;
            var layer = layui.layer;
            var element = layui.element;

            tableIns = table.render({
                elem: '#FileList',
                url: '/admin/api/plugin/filemanager/list',
                where: { path: currentPath },
                method: 'get',
                page: false,
                limit: 99999,
                cols: [[
                    { type: 'checkbox', width: 50, fixed: 'left' },
                    { field: 'name', title: '名称', minWidth: 300, templet: '#dirTpl', event: 'nameClick' },
                    { field: 'size', title: '大小', width: 120, templet: '#sizeTpl', align: 'right', sort: true },
                    { field: 'time', title: '修改时间', width: 180, align: 'center' },
                    { field: 'type', title: '类型', width: 80, align: 'center' },
                    { toolbar: '#toolTpl', title: '操作', width: 120, align: 'center', fixed: 'right' }
                ]],
                parseData: function(res) {
                    return {
                        "code": res.code || 0,
                        "msg": res.msg || "",
                        "count": res.count || 0,
                        "data": (res.data || []).map(function(item) {
                            item.currentPath = currentPath;
                            if (item.isdir) {
                                item.type = '文件夹';
                                item.size = 0;
                            } else {
                                item.type = (item.ext || '').toUpperCase() || '文件';
                            }
                            return item;
                        })
                    };
                },
                done: function(res, curr, count) {
                    resetSelectedStats();
                    adjustTableScroll();
                    var that = this;
                    var tableView = document.querySelector('.file-list-container .layui-table-view');
                    if (tableView) {
                        tableView.oncontextmenu = function(e) {
                            e.preventDefault();
                            var tr = e.target.closest('tr');
                            if (tr) {
                                var dataIdx = tr.getAttribute('data-index');
                                if (dataIdx !== null) {
                                    var rowData = res.data[parseInt(dataIdx)];
                                    if (rowData) {
                                        var checkStatus = table.checkStatus('FileList');
                                        var found = false;
                                        for (var i = 0; i < checkStatus.data.length; i++) {
                                            if (checkStatus.data[i].name === rowData.name) { found = true; break; }
                                        }
                                        if (!found) {
                                            selectedItems = [rowData];
                                        } else {
                                            selectedItems = checkStatus.data;
                                        }
                                        updateSelectedStats();
                                        showContextMenu(e.clientX, e.clientY, 'file', rowData);
                                    }
                                }
                            } else {
                                showContextMenu(e.clientX, e.clientY, 'blank', null);
                            }
                        };
                    }
                },
                height: 'full-98'
            });

            table.on('checkbox(FileList)', function(obj) {
                var checkStatus = table.checkStatus('FileList');
                selectedItems = checkStatus.data;
                updateSelectedStats();
                updateToolbarButtons();
            });

            table.on('tool(FileList)', function(obj) {
                var data = obj.data;
                if (obj.event === 'nameClick') {
                    if (data.isdir) {
                        submitNewPath(currentPath ? currentPath + '/' + data.name : data.name);
                    } else {
                        var filePath = currentPath ? currentPath + '/' + data.name : data.name;
                        if (isImageFile(data.ext)) {
                            viewImage(filePath);
                        } else if (isEditableFile(data.ext)) {
                            editFile(filePath);
                        } else {
                            downloadFile(data);
                        }
                    }
                } else if (obj.event === 'download') {
                    downloadFile(data);
                } else if (obj.event === 'delete') {
                    deleteFiles([data]);
                }
            });

            table.on('sort(FileList)', function(obj) {
                tableIns.reload({
                    initSort: obj,
                    where: { path: currentPath }
                });
            });

            document.getElementById('BtnBack').addEventListener('click', function() {
                navigateUp();
            });

            document.getElementById('BtnRefresh').addEventListener('click', function() {
                refreshCurrent();
            });

            document.getElementById('AddrList').addEventListener('dblclick', function() {
                var addrEdit = document.getElementById('AddrEdit');
                addrEdit.style.display = 'block';
                addrEdit.value = currentPath;
                addrEdit.focus();
                addrEdit.select();
            });

            document.getElementById('AddrEdit').addEventListener('blur', function() {
                this.style.display = 'none';
            });

            document.getElementById('AddrEdit').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    submitNewPath(this.value);
                    this.style.display = 'none';
                } else if (e.key === 'Escape') {
                    this.style.display = 'none';
                }
            });

            document.getElementById('UploadBtn').addEventListener('click', function() {
                showUploadDialog();
            });

            document.getElementById('NewBtn').addEventListener('click', function(e) {
                var menu = document.getElementById('NewMenu');
                menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
                e.stopPropagation();
            });

            document.getElementById('NewFile').addEventListener('click', function() {
                document.getElementById('NewMenu').style.display = 'none';
                showNewDialog(true);
            });

            document.getElementById('NewFolder').addEventListener('click', function() {
                document.getElementById('NewMenu').style.display = 'none';
                showNewDialog(false);
            });

            document.addEventListener('click', function() {
                document.getElementById('NewMenu').style.display = 'none';
            });

            document.getElementById('CutBtn').addEventListener('click', function() {
                doCut(selectedItems);
            });

            document.getElementById('CopyBtn').addEventListener('click', function() {
                doCopy(selectedItems);
            });

            document.getElementById('PasteBtn').addEventListener('click', function() {
                doPaste();
            });

            document.getElementById('DeleteBtn').addEventListener('click', function() {
                deleteFiles(selectedItems);
            });

            document.getElementById('CompressBtn').addEventListener('click', function() {
                showCompressDialog(selectedItems);
            });

            document.getElementById('ExtractBtn').addEventListener('click', function() {
                if (selectedItems.length === 1 && !selectedItems[0].isdir) {
                    showExtractDialog(selectedItems[0]);
                } else {
                    layer.msg('请选择一个压缩文件', { icon: 2 });
                }
            });

            initContextMenu();

            window.addEventListener('resize', function() {
                adjustTableScroll();
            });

            updateBreadcrumb();
            resetSelectedStats();
            updateToolbarButtons();
        });
    }

    var FileManager = {
        init: function() {
            initFileManager();
        },
        refresh: function() {
            refreshFileList();
        },
        currentPath: function() {
            return currentPath;
        },
        deleteFiles: function(items) {
            deleteFiles(items);
        },
        copyFiles: function(items) {
            doCopy(items);
        },
        cutFiles: function(items) {
            doCut(items);
        },
        pasteFiles: function() {
            doPaste();
        },
        compressFiles: function(items) {
            showCompressDialog(items);
        },
        extractFiles: function(item) {
            showExtractDialog(item);
        },
        editFile: function(path) {
            editFile(path);
        },
        showEditor: function(path, content) {
            showEditor(path, content);
        },
        viewImage: function(path) {
            viewImage(path);
        },
        navigateUp: function() {
            navigateUp();
        },
        refreshCurrent: function() {
            refreshCurrent();
        }
    };

    FileManager.init();
    </script>
</body>
</html>
